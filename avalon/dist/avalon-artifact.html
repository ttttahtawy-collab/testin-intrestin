<title>Avalon: The Withering</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap');

:root {
  --ink: #2a1a0e;
  --ink-soft: #5a4028;
  --gold: #c9a25a;
  --gold-hi: #f0d79a;
  --gold-dk: #7a5a26;
  --blood: #7a1414;
  --blood-hi: #a82222;
  --parch: #e2d2a8;
  --parch-dk: #c4ad7c;
  --night: #0d0b09;
  --hud-bg: rgba(16, 12, 9, 0.72);
  --hp: #a3261c;
  --st: #4a8a3a;
  --res: #3a6aa8;
  --xp: #c9a25a;
  --serif: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --caps: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', Georgia, serif;
  --deco: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --night: #0d0b09; } }
:root[data-theme="dark"] { --night: #0d0b09; }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: var(--parch); font-family: var(--serif); user-select: none; -webkit-user-select: none; touch-action: none; }
#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
#ui * { pointer-events: none; }
#ui .interactive, #ui .interactive * { pointer-events: auto; }
.hidden { display: none !important; }

/* ---------- parchment & frames ---------- */
.parchment {
  color: var(--ink);
  background-color: var(--parch);
  background-image:
    radial-gradient(ellipse at 20% 15%, rgba(255, 248, 220, 0.55), transparent 55%),
    radial-gradient(ellipse at 80% 85%, rgba(120, 80, 30, 0.22), transparent 60%),
    radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(90, 55, 20, 0.35) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.12  0 0 0 0.22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.frame { border: 1px solid var(--gold-dk); box-shadow: 0 0 0 1px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(240, 215, 154, 0.25), 0 10px 40px rgba(0,0,0,0.6); }
.dark-frame { background: linear-gradient(180deg, rgba(28,20,14,0.86), rgba(12,9,7,0.86)); border: 1px solid var(--gold-dk); box-shadow: inset 0 0 0 1px rgba(201,162,90,0.18), 0 4px 18px rgba(0,0,0,0.6); }
.orn { position: relative; }
.orn::before, .orn::after { content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid var(--gold); opacity: 0.8; }
.orn::before { left: -3px; top: -3px; border-right: none; border-bottom: none; }
.orn::after { right: -3px; bottom: -3px; border-left: none; border-top: none; }
.caps { font-family: var(--caps); letter-spacing: 0.08em; }
.divider { height: 10px; margin: 4px auto; width: 70%; background: radial-gradient(circle at 50% 50%, var(--blood) 0 3px, transparent 4px), linear-gradient(90deg, transparent, var(--ink-soft) 20%, var(--ink-soft) 80%, transparent) center/100% 1px no-repeat; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; transition: opacity 0.4s; }
#compass { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: min(560px, 62vw); height: 30px; overflow: hidden;
  background: linear-gradient(90deg, transparent, rgba(14,10,7,0.82) 12%, rgba(14,10,7,0.82) 88%, transparent);
  border-top: 1px solid rgba(201,162,90,0.5); border-bottom: 1px solid rgba(201,162,90,0.5);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
#compass .tick { position: absolute; top: 0; width: 1px; height: 7px; background: rgba(240,215,154,0.55); }
#compass .tick.big { height: 11px; background: var(--gold); }
#compass .lbl { position: absolute; top: 6px; transform: translateX(-50%); font-family: var(--caps); font-size: 12px; color: var(--parch); text-shadow: 0 1px 2px #000; }
#compass .lbl.card { font-size: 16px; top: 4px; color: var(--gold-hi); font-weight: 700; }
#compass .lbl.card.n { color: #e05a3a; }
#compass .mk { position: absolute; top: 5px; width: 18px; height: 18px; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; font-size: 13px; text-shadow: 0 0 4px #000; }
#compass .mk.quest { color: #ffcf5a; font-size: 18px; }
#compass .mk.enemy { color: #e04030; font-size: 11px; }
#compass .mk.poi { color: var(--parch); opacity: 0.85; font-size: 12px; }
#compass-notch { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--gold); filter: drop-shadow(0 1px 1px #000); }

#bossbar { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); width: min(420px, 60vw); text-align: center; }
#bossbar .name { font-family: var(--caps); font-size: 15px; color: var(--parch); text-shadow: 0 1px 3px #000, 0 0 8px #000; letter-spacing: 0.12em; }
#bossbar .bar { margin-top: 4px; height: 9px; background: rgba(10,6,4,0.85); border: 1px solid var(--gold-dk); position: relative; clip-path: polygon(2% 0, 98% 0, 100% 50%, 98% 100%, 2% 100%, 0 50%); }
#bossbar .fill { height: 100%; background: linear-gradient(180deg, #c8402a, #7a1a10); width: 100%; transition: width 0.15s; }
#bossbar .lag { position: absolute; left: 0; top: 0; height: 100%; background: rgba(240, 200, 120, 0.5); transition: width 0.8s 0.25s; }

#minimap-wrap { position: absolute; top: 14px; right: 18px; width: 172px; height: 172px; }
#minimap { position: absolute; inset: 10px; width: 152px; height: 152px; border-radius: 50%; }
#minimap-frame { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--gold-dk); box-shadow: inset 0 0 0 2px #1a120a, inset 0 0 0 5px var(--gold), inset 0 0 22px rgba(0,0,0,0.6), 0 4px 16px rgba(0,0,0,0.7); background: radial-gradient(circle, transparent 66%, rgba(20,14,8,0.95) 67%); }
#minimap-frame .rose { position: absolute; font-family: var(--caps); font-weight: 700; font-size: 11px; color: var(--gold-hi); text-shadow: 0 1px 2px #000; transform: translate(-50%, -50%); }
#clock { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); font-family: var(--caps); font-size: 11px; color: var(--gold-hi); background: rgba(14,10,7,0.9); border: 1px solid var(--gold-dk); padding: 1px 8px; border-radius: 9px; white-space: nowrap; }

#tracker { position: absolute; top: 196px; right: 18px; width: 268px; padding: 10px 14px 10px 14px; }
#tracker .chap { font-family: var(--caps); font-size: 10px; letter-spacing: 0.16em; color: var(--gold); opacity: 0.9; text-transform: uppercase; }
#tracker .qname { font-family: var(--caps); font-weight: 700; font-size: 15px; color: var(--parch); margin: 2px 0 4px; }
#tracker .obj { font-size: 14px; line-height: 1.25; color: #eadfc6; padding-left: 12px; position: relative; }
#tracker .obj::before { content: '◆'; position: absolute; left: 0; top: 1px; font-size: 8px; color: #e0a040; }
#tracker .dist { font-style: italic; font-size: 12.5px; color: var(--gold); margin-top: 4px; padding-left: 12px; }

#vitals { position: absolute; left: 22px; bottom: 22px; display: flex; align-items: flex-end; gap: 10px; }
#medal { width: 78px; height: 78px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 40% 35%, #6a4a24, #2a1a0c 70%); border: 3px solid var(--gold); box-shadow: 0 0 0 2px #1a0e06, 0 4px 14px rgba(0,0,0,0.8), inset 0 0 12px rgba(0,0,0,0.8); }
#medal .lv { font-family: var(--deco); font-size: 30px; color: var(--gold-hi); line-height: 1; text-shadow: 0 2px 2px #000; }
#medal .lt { font-family: var(--caps); font-size: 8.5px; letter-spacing: 0.2em; color: var(--gold); }
#bars { width: 270px; }
#counters { display: flex; gap: 8px; margin-bottom: 6px; }
.pill { font-family: var(--caps); font-size: 12px; color: var(--parch); background: rgba(14,10,7,0.85); border: 1px solid var(--gold-dk); border-radius: 12px; padding: 1px 10px 1px 6px; display: flex; align-items: center; gap: 5px; }
.pill .coin { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe08a, #b0801a); box-shadow: 0 0 0 1px #5a3a0a; }
.bar { height: 12px; margin: 3px 0; background: rgba(8,6,4,0.85); border: 1px solid var(--gold-dk); position: relative; overflow: hidden; }
.bar .f { position: absolute; left: 0; top: 0; bottom: 0; transition: width 0.12s; }
.bar .ghost { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(255,240,200,0.4); transition: width 0.9s 0.3s; }
.bar .txt { position: absolute; inset: 0; font-family: var(--caps); font-size: 9.5px; color: rgba(255,250,235,0.9); text-align: center; line-height: 11px; text-shadow: 0 1px 1px #000; }
.bar.hp .f { background: linear-gradient(180deg, #d0452e, var(--hp) 55%, #5a120c); }
.bar.res .f { background: linear-gradient(180deg, #5a90d0, var(--res) 55%, #1a3a68); }
.bar.st .f { background: linear-gradient(180deg, #7ac05a, var(--st) 55%, #1e4a18); }
.bar.xp { height: 5px; } .bar.xp .f { background: linear-gradient(90deg, #8a6a2a, var(--gold-hi)); }
.bar.mask { height: 6px; } .bar.mask .f { background: linear-gradient(90deg, #4a6a3a, #a8c890); }

#abilities { position: absolute; left: 22px; bottom: 132px; display: flex; gap: 6px; }
.abil { width: 42px; height: 42px; border: 2px solid var(--gold-dk); background: radial-gradient(circle, #4a2a14, #1a0e08); box-shadow: 0 2px 8px rgba(0,0,0,0.7), inset 0 0 8px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--gold-hi); position: relative; transform: rotate(0deg); }
.abil .k { position: absolute; bottom: -2px; right: 1px; font-family: var(--caps); font-size: 10px; color: var(--parch); text-shadow: 0 1px 1px #000; }
.abil.locked { opacity: 0.3; filter: grayscale(1); }
.abil.low { opacity: 0.55; }
.abil.flash { animation: abilflash 0.5s; }
@keyframes abilflash { 0% { box-shadow: 0 0 0 0 #ffd070; } 100% { box-shadow: 0 0 0 14px transparent; } }

#quick { position: absolute; right: 30px; bottom: 30px; width: 96px; height: 96px; }
#quick .dia { position: absolute; left: 16px; top: 16px; width: 64px; height: 64px; transform: rotate(45deg); background: radial-gradient(circle, #3a2614, #120a06); border: 2px solid var(--gold); box-shadow: 0 0 0 2px #120a06, 0 4px 14px rgba(0,0,0,0.8); }
#quick img { position: absolute; left: 22px; top: 22px; width: 52px; height: 52px; }
#quick .n { position: absolute; left: 0; bottom: 6px; font-family: var(--caps); font-size: 14px; color: var(--parch); text-shadow: 0 1px 2px #000; }
#quick .key { position: absolute; width: 18px; height: 18px; border: 1px solid var(--parch); border-radius: 3px; background: rgba(10,8,6,0.85); font-family: var(--caps); font-size: 11px; color: var(--parch); display: flex; align-items: center; justify-content: center; }
#quick .key.use { left: 39px; bottom: -8px; } #quick .key.cyc { right: -6px; top: 8px; }
#quick .side { position: absolute; right: -2px; top: -16px; width: 34px; height: 34px; transform: rotate(45deg); background: #1a120a; border: 1px solid var(--gold-dk); }
#quick .side img { left: 1px; top: 1px; width: 30px; height: 30px; transform: rotate(-45deg); }
#weaponmode { position: absolute; right: 136px; bottom: 34px; font-family: var(--caps); font-size: 11px; color: var(--parch); text-align: right; text-shadow: 0 1px 2px #000; opacity: 0.85; }

#crosshair { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255,245,220,0.85); box-shadow: 0 0 2px #000; }
#crosshair.charge { width: 22px; height: 22px; margin: -11px; background: none; border: 2px solid rgba(255,220,150,0.8); }
#prompt { position: absolute; left: 50%; top: calc(50% + 46px); transform: translateX(-50%); text-align: center; font-size: 17px; color: var(--parch); text-shadow: 0 1px 3px #000, 0 0 10px #000; white-space: nowrap; }
#prompt .key { display: inline-block; min-width: 22px; padding: 0 5px; margin-right: 8px; border: 1px solid var(--gold); border-radius: 3px; background: rgba(14,10,7,0.9); font-family: var(--caps); font-size: 13px; color: var(--gold-hi); }
#prompt .verb { font-family: var(--caps); font-size: 13px; color: var(--gold); margin-right: 6px; letter-spacing: 0.1em; text-transform: uppercase; }

#toasts { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.toast { font-size: 17px; color: #f2e6c8; text-shadow: 0 1px 3px #000, 0 0 12px #000; animation: toastIn 0.25s ease-out; text-align: center; max-width: 70vw; }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#subtitle { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); max-width: 60vw; text-align: center; font-size: 18px; color: #f0e4c4; text-shadow: 0 1px 3px #000, 0 0 10px #000; }
#subtitle b { font-family: var(--caps); color: var(--gold-hi); font-weight: 500; margin-right: 6px; }
#pickups { position: absolute; right: 150px; bottom: 140px; display: flex; flex-direction: column-reverse; gap: 4px; align-items: flex-end; }
.pick { display: flex; align-items: center; gap: 8px; padding: 3px 12px 3px 4px; background: linear-gradient(90deg, transparent, rgba(14,10,7,0.88) 30%); font-size: 15px; color: var(--parch); animation: toastIn 0.25s; }
.pick img { width: 30px; height: 30px; }
.pick .n { font-family: var(--caps); color: var(--gold-hi); font-size: 13px; }
#banner { position: absolute; left: 50%; top: 13%; transform: translateX(-50%); text-align: center; min-width: 420px; padding: 14px 40px; }
#banner .kind { font-family: var(--caps); font-size: 13px; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; }
#banner .title { font-family: var(--deco); font-size: 34px; color: #f6ecd2; text-shadow: 0 2px 4px #000, 0 0 18px rgba(0,0,0,0.9); margin: 4px 0; }
#banner .sub { font-style: italic; font-size: 16px; color: #e8dcc0; text-shadow: 0 1px 3px #000; }
#banner .rule { width: 260px; height: 1px; margin: 6px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.banner-in { animation: bannerIn 4.5s forwards; }
@keyframes bannerIn { 0% { opacity: 0; letter-spacing: 0.02em; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
#xpfloat { position: absolute; left: 110px; bottom: 120px; font-family: var(--caps); font-size: 14px; color: var(--gold-hi); text-shadow: 0 1px 2px #000; }
.dmg { position: absolute; font-family: var(--caps); font-weight: 700; font-size: 18px; color: #f0e0c0; text-shadow: 0 1px 2px #000, 0 0 6px #000; transform: translate(-50%, -50%); }
.dmg.heavy { color: #ffb050; font-size: 24px; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity 0.8s; display: flex; align-items: center; justify-content: center; font-family: var(--caps); font-size: 22px; color: var(--parch); letter-spacing: 0.15em; }
#death { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(60,0,0,0.3), rgba(0,0,0,0.85)); opacity: 0; transition: opacity 1.5s; }
#death .t { font-family: var(--deco); font-size: 56px; color: #b02a1a; text-shadow: 0 0 20px #000; }
#death .s { font-style: italic; font-size: 18px; color: var(--parch); margin-top: 8px; }
#hurtflash { position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(160,10,0,0.0); transition: box-shadow 0.3s; }

/* ---------- Dialogue ---------- */
#dialogue { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); width: min(900px, 94vw); display: flex; gap: 0; }
#dialogue .portrait { flex: 0 0 132px; height: 132px; margin: 14px 0 14px 16px; border: 3px solid var(--gold-dk); box-shadow: inset 0 0 0 2px var(--parch-dk), 0 2px 8px rgba(0,0,0,0.5); background: radial-gradient(circle at 50% 40%, #6a5038, #2a1a0e); display: flex; align-items: center; justify-content: center; }
#dialogue .portrait img { width: 100%; height: 100%; image-rendering: auto; }
#dialogue .body { flex: 1; padding: 14px 22px 12px 18px; min-height: 160px; display: flex; flex-direction: column; }
#dialogue .head { display: flex; align-items: baseline; gap: 10px; }
#dialogue .who { font-family: var(--caps); font-weight: 700; font-size: 21px; color: var(--blood); letter-spacing: 0.04em; }
#dialogue .title { font-style: italic; font-size: 14px; color: var(--ink-soft); }
#dialogue .qtag { margin-left: auto; font-family: var(--caps); font-size: 10.5px; letter-spacing: 0.18em; color: var(--ink-soft); border: 1px solid var(--ink-soft); border-radius: 10px; padding: 1px 10px; text-transform: uppercase; }
#dialogue .text { font-size: 18.5px; line-height: 1.38; color: var(--ink); margin-top: 6px; min-height: 52px; }
#dialogue .opts { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
#dialogue .opt { font-size: 17px; color: var(--ink); padding: 3px 8px; border-left: 3px solid transparent; cursor: pointer; }
#dialogue .opt .num { font-family: var(--caps); font-size: 12px; color: var(--blood); margin-right: 8px; }
#dialogue .opt:hover, #dialogue .opt.sel { background: rgba(122,20,20,0.1); border-left-color: var(--blood); }
#dialogue .opt.locked { color: rgba(42,26,14,0.45); cursor: default; }
#dialogue .opt.check .num::after { content: ''; }
#dialogue .hint { margin-top: auto; text-align: right; font-size: 12px; font-style: italic; color: var(--ink-soft); padding-top: 6px; }
.k { display: inline-block; font-family: var(--caps); font-style: normal; font-size: 10px; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; margin: 0 3px; }

/* ---------- Book ---------- */
#book-wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(0,0,0,0.35), rgba(0,0,0,0.75)); }
#book { position: relative; width: min(1180px, 96vw); height: min(700px, 90vh); display: flex; padding: 22px 26px; border-radius: 6px;
  background: linear-gradient(180deg, #5a1414, #3a0c0c); box-shadow: 0 30px 80px rgba(0,0,0,0.85), inset 0 0 0 3px #2a0808, inset 0 0 0 6px var(--gold-dk), inset 0 0 0 7px #2a0808; }
#book .page { position: relative; flex: 1; padding: 22px 30px 18px; overflow: hidden; display: flex; flex-direction: column; }
#book .page.left { border-radius: 4px 0 0 4px; box-shadow: inset -18px 0 26px -14px rgba(60, 30, 10, 0.55); }
#book .page.right { border-radius: 0 4px 4px 0; box-shadow: inset 18px 0 26px -14px rgba(60, 30, 10, 0.55); }
#book .spine { width: 6px; background: linear-gradient(90deg, #7a5a30, #3a2410, #7a5a30); }
#book h2 { font-family: var(--caps); font-weight: 700; font-size: 26px; margin: 0; text-align: center; color: var(--ink); letter-spacing: 0.06em; }
#book h3 { font-family: var(--caps); font-size: 13px; letter-spacing: 0.2em; color: var(--blood); margin: 10px 0 4px; text-transform: uppercase; }
#book .ribbons { position: absolute; top: -10px; right: 70px; display: flex; gap: 8px; z-index: 2; }
#book .ribbon { font-family: var(--caps); font-size: 13.5px; color: #f6ecd2; padding: 12px 14px 16px; background: linear-gradient(180deg, var(--blood-hi), var(--blood)); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%); cursor: pointer; text-shadow: 0 1px 1px #000; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
#book .ribbon.blue { background: linear-gradient(180deg, #2c4c7c, #1a3054); }
#book .ribbon.green { background: linear-gradient(180deg, #3c6a3a, #22421f); }
#book .ribbon.ochre { background: linear-gradient(180deg, #9a6a1a, #6a440c); }
#book .ribbon.active { padding-bottom: 24px; }
#book .close { position: absolute; right: 22px; bottom: 16px; font-family: var(--caps); font-size: 13px; color: #f6ecd2; background: var(--blood); border: 1px solid var(--gold-dk); padding: 4px 14px; border-radius: 3px; cursor: pointer; z-index: 3; }
#book .foot { position: absolute; left: 30px; right: 120px; bottom: 10px; font-size: 12px; font-style: italic; color: var(--ink-soft); }

/* bearer page */
.doll { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.doll canvas { width: 230px; height: 100%; max-height: 330px; cursor: grab; }
.doll .slot { position: absolute; width: 62px; text-align: center; }
.doll .slot .box { width: 56px; height: 56px; margin: 0 auto; border: 1px solid var(--ink-soft); background: rgba(255, 250, 235, 0.35); box-shadow: inset 0 0 8px rgba(90,60,20,0.35); display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; }
.doll .slot .box img { width: 50px; height: 50px; }
.doll .slot .box.empty::after { content: attr(data-glyph); font-size: 22px; color: rgba(60,40,20,0.35); }
.doll .slot .lab { font-style: italic; font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.doll .dots { position: absolute; border-top: 1px dotted var(--ink-soft); width: 46px; opacity: 0.6; }
.platform { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); width: 200px; height: 30px; border-radius: 50%; background: radial-gradient(ellipse, #6a7a3a, #3a4a1a 60%, transparent 72%); }
.nameplate { margin: 6px auto 0; padding: 4px 24px; background: linear-gradient(180deg, var(--blood-hi), var(--blood)); color: #f6ecd2; font-family: var(--caps); font-size: 17px; letter-spacing: 0.08em; box-shadow: 0 2px 6px rgba(0,0,0,0.35); text-align: center; }
.hearts { text-align: center; color: var(--blood); font-size: 15px; margin-top: 4px; letter-spacing: 1px; }
.hearts span { font-style: italic; font-size: 13px; color: var(--ink-soft); margin-left: 6px; letter-spacing: 0; }
.xpline { width: 70%; margin: 4px auto 0; }
.xpline .bar { border-color: var(--ink-soft); background: rgba(90,60,20,0.2); height: 7px; border-radius: 4px; }
.xpline .cap { text-align: center; font-style: italic; font-size: 12px; color: var(--ink-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 2px 10px 2px 3px; border: 1px solid var(--parch-dk); background: rgba(255,250,235,0.45); border-radius: 14px; font-size: 13px; }
.chip i { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 11px; color: #fff; }
.chip b { font-family: var(--caps); font-size: 14px; }

/* satchel page */
.cats { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.cat { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--ink-soft); background: rgba(255,250,235,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.cat img { width: 34px; height: 34px; }
.cat.active { border: 2px solid var(--blood); background: rgba(255,250,235,0.75); box-shadow: 0 0 0 2px rgba(122,20,20,0.15); }
.cat .cnt { position: absolute; right: -3px; bottom: -3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--ink); color: var(--parch); font-family: var(--caps); font-size: 10px; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
.catname { text-align: center; font-style: italic; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.grid { margin-top: 8px; padding: 8px; border: 1px solid var(--parch-dk); background: rgba(160,130,80,0.12); display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; flex: 1; align-content: start; overflow-y: auto; min-height: 120px; }
.cell { position: relative; aspect-ratio: 1; border: 1px solid var(--parch-dk); border-radius: 4px; background: rgba(255,250,235,0.45); box-shadow: inset 0 0 6px rgba(90,60,20,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.cell img { width: 88%; height: 88%; }
.cell.sel { border: 2px solid var(--blood); background: rgba(255,250,235,0.75); }
.cell.eq::before { content: '✓'; position: absolute; left: -5px; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--blood); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; }
.cell .n { position: absolute; right: 2px; bottom: 0; font-family: var(--caps); font-size: 11px; color: var(--ink); text-shadow: 0 0 2px #fff; }
.cell .new { position: absolute; right: -6px; top: -7px; font-family: var(--caps); font-size: 8.5px; background: #d8a830; color: #2a1a0e; border-radius: 6px; padding: 0 4px; }
.cell .r { position: absolute; left: 3px; bottom: 3px; width: 6px; height: 6px; border-radius: 50%; }
.cell.empty { cursor: default; opacity: 0.6; }
.details { margin-top: 8px; display: flex; gap: 12px; padding: 10px; border: 1px solid var(--parch-dk); background: rgba(255,250,235,0.35); min-height: 150px; position: relative; }
.details::before { content: ''; position: absolute; top: -6px; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--blood-hi); box-shadow: 0 1px 2px rgba(0,0,0,0.4); }
.details .big { flex: 0 0 96px; height: 96px; border: 1px solid var(--parch-dk); border-radius: 6px; background: rgba(255,250,235,0.6); display: flex; align-items: center; justify-content: center; }
.details .big img { width: 90px; height: 90px; }
.details .mid { flex: 1; min-width: 0; }
.details .nm { font-family: var(--caps); font-weight: 700; font-size: 19px; color: var(--ink); }
.details .ty { font-family: var(--caps); font-size: 10.5px; letter-spacing: 0.18em; color: var(--ink-soft); text-transform: uppercase; }
.details .ds { font-style: italic; font-size: 14.5px; color: var(--ink); margin-top: 6px; line-height: 1.3; }
.details .st { flex: 0 0 180px; border-left: 1px solid var(--parch-dk); padding-left: 12px; font-size: 14px; display: flex; flex-direction: column; }
.details .st .row { display: flex; justify-content: space-between; color: var(--ink); }
.details .st .row .v { font-family: var(--caps); }
.details .st .up { color: #3a7a2a; } .details .st .down { color: var(--blood); }
.btn { font-family: var(--caps); font-size: 14px; color: #f6ecd2; background: linear-gradient(180deg, var(--blood-hi), var(--blood)); border: 1px solid #3a0808; box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 4px rgba(0,0,0,0.35); padding: 6px 14px; border-radius: 4px; cursor: pointer; text-align: center; }
.btn:hover { filter: brightness(1.15); }
.btn.alt { background: linear-gradient(180deg, #6a5a3a, #3a2e1a); }
.btn.dis { opacity: 0.45; cursor: default; filter: grayscale(0.6); }
.btns { margin-top: auto; display: flex; gap: 6px; flex-direction: column; }

/* path page */
.qlist { overflow-y: auto; flex: 1; margin-top: 8px; }
.qitem { padding: 6px 8px; border-left: 3px solid transparent; cursor: pointer; }
.qitem:hover, .qitem.sel { background: rgba(122,20,20,0.08); border-left-color: var(--blood); }
.qitem .n { font-family: var(--caps); font-size: 15px; color: var(--ink); }
.qitem .c { font-style: italic; font-size: 12.5px; color: var(--ink-soft); }
.qitem.done .n { text-decoration: line-through; opacity: 0.6; }
.qitem .trk { float: right; color: var(--blood); font-size: 12px; }
.qdesc { font-size: 16px; line-height: 1.4; color: var(--ink); }
.qstep { font-size: 15px; padding-left: 16px; position: relative; margin: 5px 0; }
.qstep::before { content: '◆'; position: absolute; left: 0; color: var(--blood); font-size: 9px; top: 4px; }
.qstep.past { opacity: 0.55; text-decoration: line-through; }

/* bearer/skills */
.attr { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px dotted var(--parch-dk); }
.attr .nm { font-family: var(--caps); font-size: 16px; flex: 0 0 120px; }
.attr .ds { flex: 1; font-style: italic; font-size: 13.5px; color: var(--ink-soft); }
.attr .v { font-family: var(--deco); font-size: 22px; width: 34px; text-align: center; }
.attr .plus { width: 26px; height: 26px; border-radius: 50%; padding: 0; line-height: 24px; }
.perks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; overflow-y: auto; margin-top: 6px; }
.perk { border: 1px solid var(--parch-dk); background: rgba(255,250,235,0.35); padding: 6px 8px; border-radius: 4px; display: flex; gap: 8px; cursor: pointer; }
.perk .ic { flex: 0 0 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle, #6a4a24, #2a1a0c); color: var(--gold-hi); display: flex; align-items: center; justify-content: center; font-size: 17px; border: 1px solid var(--gold-dk); }
.perk .pn { font-family: var(--caps); font-size: 13.5px; }
.perk .pd { font-size: 12px; font-style: italic; color: var(--ink-soft); line-height: 1.2; }
.perk.have { border-color: var(--blood); background: rgba(255,250,235,0.7); }
.perk.have .ic { background: radial-gradient(circle, #a82a1a, #4a0a06); }
.perk.na { opacity: 0.55; }

/* map */
#mapcanvas { width: 100%; height: 100%; display: block; cursor: grab; }
.maplegend { position: absolute; left: 40px; bottom: 26px; font-size: 13px; font-style: italic; color: var(--ink-soft); }

/* loot / shop / fire panels */
.panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, 92vw); max-height: 80vh; padding: 18px 22px; display: flex; flex-direction: column; }
.panel h2 { font-family: var(--caps); font-size: 22px; text-align: center; margin: 0 0 4px; color: var(--ink); }
.panel .sub { text-align: center; font-style: italic; color: var(--ink-soft); font-size: 14px; }
.list { overflow-y: auto; margin: 10px 0; display: flex; flex-direction: column; gap: 4px; }
.row-item { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; background: rgba(255,250,235,0.3); }
.row-item:hover, .row-item.sel { border-color: var(--blood); background: rgba(255,250,235,0.65); }
.row-item img { width: 36px; height: 36px; }
.row-item .nm { flex: 1; font-size: 16px; color: var(--ink); }
.row-item .q { font-family: var(--caps); font-size: 13px; color: var(--ink-soft); }
.row-item .pr { font-family: var(--caps); font-size: 13px; color: #7a5a10; display: flex; align-items: center; gap: 4px; }
.row-item.dis { opacity: 0.45; }
.row-item .req { font-size: 12px; font-style: italic; color: var(--ink-soft); }
.shop { width: min(980px, 96vw); flex-direction: row; gap: 18px; height: min(600px, 86vh); }
.shop .col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.gold { font-family: var(--caps); font-size: 15px; color: #7a5a10; text-align: center; }
.menu .btn { margin: 4px 0; }

/* title & menus */
#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.05), rgba(0,0,0,0.65) 80%); }
#title .logo { font-family: var(--deco); font-size: clamp(42px, 8vw, 96px); color: #f2e2b8; text-shadow: 0 4px 10px #000, 0 0 40px rgba(0,0,0,0.8); letter-spacing: 0.04em; line-height: 1; }
#title .logo2 { font-family: var(--caps); font-size: clamp(14px, 2.2vw, 24px); letter-spacing: 0.5em; color: var(--gold); margin-top: 8px; text-shadow: 0 2px 6px #000; }
#title .tag { font-style: italic; color: #e8dcc0; margin-top: 12px; font-size: 17px; text-shadow: 0 2px 6px #000; }
#title .menu { margin-top: 40px; display: flex; flex-direction: column; gap: 10px; width: 260px; }
#title .menu .btn { font-size: 17px; padding: 10px; background: linear-gradient(180deg, rgba(122,20,20,0.92), rgba(70,10,10,0.92)); border-color: var(--gold-dk); }
#title .foot { position: absolute; bottom: 14px; font-size: 12.5px; color: rgba(240,230,200,0.6); font-style: italic; text-align: center; padding: 0 16px; }
#loading { position: absolute; inset: 0; background: #0b0907; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#loading .logo { font-family: var(--deco); font-size: clamp(36px, 6vw, 72px); color: #e8d8b0; }
#loading .bar { width: min(420px, 80vw); height: 6px; margin-top: 30px; }
#loading .bar .f { background: linear-gradient(90deg, var(--gold-dk), var(--gold-hi)); }
#loading .msg { margin-top: 10px; font-style: italic; color: var(--parch-dk); }
.overlay-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); }
.controls { columns: 2; column-gap: 26px; font-size: 14.5px; }
.controls div { break-inside: avoid; display: flex; justify-content: space-between; border-bottom: 1px dotted var(--parch-dk); padding: 2px 0; }
.controls b { font-family: var(--caps); font-size: 12px; color: var(--blood); }
.setting { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; font-size: 15px; }
.setting select, .setting input { font-family: var(--serif); font-size: 14px; }
#ending { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.82); }
#ending .panel { position: relative; transform: none; left: auto; top: auto; width: min(720px, 92vw); text-align: center; }
#ending p { font-size: 17px; line-height: 1.45; color: var(--ink); }

/* touch */
#touch { position: absolute; inset: 0; }
#touch .stick { position: absolute; left: 40px; bottom: 150px; width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(240,215,154,0.35); background: rgba(0,0,0,0.18); }
#touch .knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(240,215,154,0.35); }
#touch .tb { position: absolute; width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(240,215,154,0.5); background: rgba(20,14,8,0.45); color: var(--gold-hi); font-family: var(--caps); font-size: 12px; display: flex; align-items: center; justify-content: center; text-align: center; }

@media (max-width: 760px) {
  #tracker { width: 200px; top: 150px; } #minimap-wrap { transform: scale(0.75); transform-origin: top right; }
  #bars { width: 190px; } #medal { width: 60px; height: 60px; } #medal .lv { font-size: 22px; }
  #book { padding: 12px; } #book .page { padding: 14px 12px; } .grid { grid-template-columns: repeat(6, 1fr); }
  .details .st { flex-basis: 130px; }
  #dialogue .portrait { flex-basis: 80px; height: 80px; } #dialogue .text { font-size: 16px; }
}

nts the High Pass. Grimtooth, they call it. The Watch put a price on it.","Ironhollow's gone quiet. Brigands moved into the deep tunnels, I heard.","The lighthouse at Gull Point went dark. Morwen's been asking for oil.","There's a great tree east of the Weald that blooms purple all year. The Elder Bloom. Old folk leave things in its roots.","Pages of the old Chronicle are scattered all over the isle. The archivist in Caer Dawn pays for them."];var se=(s,t)=>s.quests.isActive(t)?s.quests.stageOf(t):null,Wi=(s,t)=>s.quests.isActive(t),Qn=(s,t)=>s.quests.isDone(t),ke=(s,t,e=1)=>s.inventory.has(t,e),ra=(s,t)=>!!s.flags[t],ui=(s,t)=>s.setFlag(t),ts=()=>Hc[Math.floor(Math.random()*Hc.length)],re={};re.maeve={start:s=>{let t=s.quests.stageOf("mq_tents");return t?Wi(s,"mq_tents")?{wake:"wake",gear:"gear",equip:"gear",herbs:"herbs",return:"herbsdone",craft:"craft",show:"show",bram:"bram"}[t]||"hub":se(s,"mq_draught")==="brew"?"brew":se(s,"mq_draught")==="wait"?ra(s,"draught_ready")?"cure":"waiting":se(s,"mq_draught")==="cure"?"cure":se(s,"mq_kingsfall")==="report"?"corvinback":"hub":"wake"},nodes:{wake:{t:"Easy \u2014 don't sit up so fast. You've been asleep two days. Bram dragged you out of the surf with a lantern still clenched in your fist. Do you remember your name? Anything at all?",o:[{t:"Nothing. Only the cold\u2026 and the light.",n:"wake2"},{t:"Where am I?",n:"where"}]},where:{t:"The sick-tents, outside Greywater Hollow. On the isle of Avalon. We keep the newcomers here until we know they don't carry the Withering.",o:[{t:"The Withering?",n:"withering"}]},wake2:{t:"That's more than most castaways keep. Light, then. You'll be the Lantern-Bearer until you think of something better.",o:[{t:"Why am I being kept here?",n:"withering"}]},withering:{t:"Since the old king died, a grey fog has crept out of the Mirefen. Where it settles, the wheat blackens and folk start to cough grey. The Withering. My poultices slow it. Nothing stops it.",o:[{t:"What do you need from me?",n:"task"}]},task:{t:"Prove your lungs are clear and your hands are useful. Your things are in the supply chest by the fence. Arm yourself \u2014 the wolves come close at night \u2014 then come back to me.",o:[{t:"I'll fetch my things.",n:"end",d:s=>s.quests.setStage("mq_tents","gear")}]},gear:{t:"The chest by the fence. And put that tunic on, at least. You look like a drowned rat.",o:[{t:"On my way.",n:"end"}]},herbs:{t:"Yarrow. White, flat flower-heads, past the east gate of the tents. Three stems. Pull them up gently \u2014 the roots matter.",o:[{t:"Three yarrow. Got it.",n:"end"}]},herbsdone:{t:s=>ke(s,"yarrow",3)?"Good, good \u2014 and no cough. Now watch. Yarrow, mashed with clean linen, pressed to the wound. Here, take some linen. Make a poultice at the fire yourself.":"You don't have three yarrow yet. White flowers, past the east gate.",o:[{t:"I'll make it at the fire.",c:s=>ke(s,"yarrow",3),n:"end",d:s=>{s.inventory.add("linen",2),s.quests.setStage("mq_tents","craft")}},{t:"I'll keep looking.",c:s=>!ke(s,"yarrow",3),n:"end"}]},craft:{t:"Kneel at the campfire and use what you've got. Two yarrow, one linen. Don't burn your fingers.",o:[{t:"Right.",n:"end"}]},show:{t:"Let me see\u2026 Not bad at all. Neat edges. You've a steady hand, castaway. I'll tell Bram you're clear. Go into Greywater and find Elder Wynn \u2014 he'll want a pair of hands like yours.",o:[{t:"Thank you, Maeve.",n:"end",d:s=>{ui(s,"tents_cleared"),s.quests.setStage("mq_tents","bram")}}]},bram:{t:"Bram knows. Go on \u2014 he'll open the gate.",o:[{t:"Farewell for now.",n:"end"}]},hub:{t:s=>s.isNight()?"Can't sleep either? The coughing keeps me up.":"Lantern-Bearer. What ails you?",o:[{t:"Do you need anything?",c:s=>!s.quests.stageOf("sq_herbs")&&Qn(s,"mq_tents"),n:"herbquest"},{t:"I've brought the herbs.",c:s=>se(s,"sq_herbs")==="back"||Wi(s,"sq_herbs")&&ke(s,"yarrow",5)&&ke(s,"comfrey",3),n:"herbgive"},{t:"Tell me more about the Withering.",n:"withering2"},{t:"Can you patch me up?",n:"heal"},{t:"Farewell.",n:"end"}]},withering2:{t:"It starts as a tickle in the chest. Then grey threads under the skin. Corvin \u2014 the king's physician \u2014 said it was something in the fog. He went to Kingsfall to look in the old archives. That was months ago.",o:[{t:"Back.",n:"hub"}]},heal:{t:"Sit. Hold still\u2026 There. Don't make a habit of bleeding.",o:[{t:"Thanks.",n:"hub",d:s=>{s.player.hp=s.player.maxHp,s.ui.toast("Maeve tends your wounds.",2)}}]},herbquest:{t:"Always. Five yarrow, three comfrey \u2014 the purple one. My patients go through them faster than I can pick.",o:[{t:"I'll gather them.",n:"end",d:s=>s.quests.start("sq_herbs")},{t:"Not now.",n:"hub"}]},herbgive:{t:"Bless you. That's a week of poultices. Take this \u2014 willowbark tonic, my own brew.",o:[{t:"Glad to help.",n:"hub",d:s=>{s.inventory.remove("yarrow",5),s.inventory.remove("comfrey",3),s.quests.complete("sq_herbs")}}]},corvinback:{t:"Corvin! Alive! Talk to him \u2014 he's barely stopped lecturing me since he walked in.",o:[{t:"I will.",n:"end"}]},brew:{t:s=>ke(s,"sunpetal",3)&&ke(s,"bitterroot",3)?"Sunpetal\u2026 and bitterroot. You actually did it. Corvin! Get the copper pot. It must steep through the night \u2014 come back in the morning.":"Corvin says we need three Sunpetal blooms and three Bitterroot. Bring them both.",o:[{t:"I'll rest until morning.",c:s=>ke(s,"sunpetal",3)&&ke(s,"bitterroot",3),n:"end",d:s=>{s.inventory.remove("sunpetal",3),s.inventory.remove("bitterroot",3),s.flags.draught_brew_t=s.time.total,s.quests.setStage("mq_draught","wait")}},{t:"Not yet.",c:s=>!(ke(s,"sunpetal",3)&&ke(s,"bitterroot",3)),n:"end"}]},waiting:{t:"Not yet. It needs the whole night. Rest at a fire \u2014 the time will pass faster than you think.",o:[{t:"Very well.",n:"end"}]},cure:{t:"Look at it. Grey as fog, but it shines. One sip and the threads under Wenna's skin faded in an hour. This is the Grey Draught. Corvin has written the recipe down. Now \u2014 who gets it first? The Steward will want to control it. Ysolde will want to give it away.",o:[{t:"I'll decide what happens to it.",n:"end",d:s=>{s.inventory.add("grey_draught",1),s.quests.setStage("mq_draught","choice")}}]}}};re.bram={start:s=>se(s,"mq_tents")==="bram"?"open":Qn(s,"mq_tents")?"after":"closed",nodes:{closed:{t:"Gate stays shut till Maeve clears you. Nothing personal. Last castaway I let through coughed himself to death in the inn.",o:[{t:"How did you find me?",n:"found"},{t:"Fair enough.",n:"end"}]},found:{t:"Storm night. You were face-down in the shallows, holding a lantern so tight I had to pry your fingers off it. The flame was still lit. Never seen the like.",o:[{t:"Strange.",n:"end"}]},open:{t:"Maeve says you're clean. Go on, then. Greywater's up the hill \u2014 follow the path to the gate. Elder Wynn's usually in the square.",o:[{t:"Thanks, Bram.",n:"end",d:s=>s.quests.complete("mq_tents")}]},after:{t:"Still alive, Lantern-Bearer? Good.",o:[{t:"Any news?",n:"news"},{t:"Farewell.",n:"end"}]},news:{t:()=>ts(),o:[{t:"Thanks.",n:"end"}]}}};re.wynn={start:s=>se(s,"mq_greywater")==="elder"?"meet":se(s,"mq_greywater")==="report"?ke(s,"osric_letter")?"report":"nopaper":"hub",nodes:{meet:{t:"So you're Maeve's castaway. Welcome to Greywater Hollow \u2014 such as it is. I'd offer you a feast, but our larders are thin and our herbs thinner. Do you know what keeps this village alive? Medicine carts from Caer Dawn. And they've stopped coming.",o:[{t:"Why have they stopped?",n:"why"},{t:"How can I help?",n:"help"}]},why:{t:"The last cart left the castle three weeks ago and never arrived. The Steward's clerks say it was sent. So where is it? Somewhere on the Kingsway, between here and Crow's Crossroads.",o:[{t:"I'll find it.",n:"help"}]},help:{t:"Walk the Kingsway north. Look for the cart \u2014 or what's left of it. And speak to Haldor the smith before you go; that rusty sword won't frighten a goose.",o:[{t:"I'll search the road.",n:"end",d:s=>s.quests.setStage("mq_greywater","cart")}]},nopaper:{t:"Osric's Hollow, in the Weald. If he has our herbs, he has a reason. Find it.",o:[{t:"I'm going.",n:"end"}]},report:{t:'"Take every herb-cart on the Kingsway. The Steward pays in silver. \u2014 H." H\u2026 Harlan. The Steward himself. He starves the villages of medicine while the castle hoards it. Why?',o:[{t:"Control. Whoever holds the medicine holds Avalon.",n:"report2"},{t:"Maybe it's a forgery.",n:"report2"}]},report2:{t:"Whatever his reason, we can't fight a Steward with pitchforks. Go to Caer Dawn. Captain Ysolde of the Watch is an honest woman \u2014 if anyone will listen, she will. Take this, for the road.",o:[{t:"I'll go to Caer Dawn.",n:"end",d:s=>s.quests.complete("mq_greywater")}]},hub:{t:"Lantern-Bearer. The village is talking about you.",o:[{t:"Tell me about Avalon.",n:"lore"},{t:"Any work in the village?",n:"work"},{t:"Heard any rumours?",n:"rumor"},{t:"Farewell.",n:"end"}]},lore:{t:`Avalon was the king's isle. King Aldric ruled from Caer Dawn; his fathers ruled from Kingsfall, before the war burned it. When Aldric died without an heir, his Steward took the keys "until the heir is found." That was eleven months ago. Then came the fog.`,o:[{t:"Back.",n:"hub"}]},work:{t:"Edda at Brannoc Farm is losing sheep to wolves. Haldor wants ore for his forge. Tamsin has lost something at the mere \u2014 and Rowena\u2026 poor Rowena. Her boy went into the woods and hasn't come back.",o:[{t:"I'll ask around.",n:"hub",d:s=>ui(s,"heard_rowena")}]},rumor:{t:()=>ts(),o:[{t:"Back.",n:"hub"}]}}};re.haldor={start:s=>se(s,"sq_iron")==="back"||Wi(s,"sq_iron")&&ke(s,"iron_ore",4)?"ore":"hub",nodes:{hub:{t:"Haldor. I make things sharp. You buying, or are you selling that rust?",o:[{t:"Show me your wares.",n:"shop"},{t:"Need anything done?",c:s=>!se(s,"sq_iron"),n:"iron"},{t:"Farewell.",n:"end"}]},iron:{t:"Ore. The Ironhollow carts stopped too \u2014 brigands, I hear. Bring me four lumps of iron ore and I'll forge you something worth carrying.",o:[{t:"Four ore. I'll find them.",n:"end",d:s=>s.quests.start("sq_iron")},{t:"Maybe later.",n:"hub"}]},ore:{t:"Now that's honest rock. Give me an hour\u2026 there. Pick one: a proper sword, or a shield that won't splinter.",o:[{t:"The sword.",n:"end",d:s=>{s.inventory.remove("iron_ore",4),s.inventory.add("sword_militia",1),s.quests.complete("sq_iron"),ui(s,"haldor_discount")}},{t:"The shield.",n:"end",d:s=>{s.inventory.remove("iron_ore",4),s.inventory.add("shield_iron",1),s.quests.complete("sq_iron"),ui(s,"haldor_discount")}}]}},shop:"smith"};re.mirela={start:()=>"hub",shop:"general",nodes:{hub:{t:"Welcome, welcome. Linen, bread, a lamp for the dark nights. What'll it be?",o:[{t:"Let me see your goods.",n:"shop"},{t:"Any news?",n:"news"},{t:"Farewell.",n:"end"}]},news:{t:()=>ts(),o:[{t:"Back.",n:"hub"}]}}};re.godric={start:()=>"hub",shop:"inn",nodes:{hub:{t:"Welcome to the Weary Lantern. No cider \u2014 the apples went grey. But the stew's hot and the beds are dry.",o:[{t:"I'll eat.",n:"shop"},{t:"Rent a bed (5 crowns).",c:s=>s.player.gold>=5,n:"end",d:s=>{s.player.gold-=5,s.rest(8,"The Weary Lantern")}},{t:"Heard anything?",n:"news"},{t:"Farewell.",n:"end"}]},news:{t:()=>ts(),o:[{t:"Back.",n:"hub"}]}}};re.aldwin={start:()=>"hub",shop:"inn",nodes:{hub:{t:"The Gilded Hart. Gilded once, anyway. Food, bed, gossip \u2014 pick two.",o:[{t:"Food.",n:"shop"},{t:"A bed (10 crowns).",c:s=>s.player.gold>=10,n:"end",d:s=>{s.player.gold-=10,s.rest(8,"The Gilded Hart")}},{t:"Gossip.",n:"news"},{t:"Farewell.",n:"end"}]},news:{t:()=>ts(),o:[{t:"Back.",n:"hub"}]}}};re.hilde={start:()=>"hub",shop:"castle",nodes:{hub:{t:"Remedies are dear these days. The Steward's men buy up every tonic that comes through the gate. Still \u2014 I keep a few back for honest customers.",o:[{t:"Show me.",n:"shop"},{t:"Farewell.",n:"end"}]}}};re.brom={start:()=>"hub",shop:"armorer",nodes:{hub:{t:"Castle steel. If it breaks, bring me the pieces and I'll laugh at you.",o:[{t:"Let's see it.",n:"shop"},{t:"Farewell.",n:"end"}]}}};re.lio={start:()=>"hub",shop:"fen",nodes:{hub:{t:"Fen goods. Filters for your mask, stew for your belly. Fair prices, for the end of the world.",o:[{t:"Trade.",n:"shop"},{t:"Farewell.",n:"end"}]}}};re.fenn={start:()=>"hub",shop:"peddler",nodes:{hub:{t:"Fenn the Peddler, at your service! Pitch pots, knives, herbs, lamp-wick. Three villages' worth of wares. Well \u2014 two.",o:[{t:"Show me.",n:"shop"},{t:"Seen any herb-carts pass?",c:s=>Wi(s,"mq_greywater"),n:"cart"},{t:"Rumours?",n:"news"},{t:"Farewell.",n:"end"}]},cart:{t:"Carts? Not for weeks. But I saw torchlight on the Kingsway one night, south of here, and heard wheels going west \u2014 into the Weald. Nobody takes a cart into the Weald for honest reasons.",o:[{t:"Thanks.",n:"hub"}]},news:{t:()=>ts(),o:[{t:"Back.",n:"hub"}]}}};re.tamsin={start:s=>se(s,"sq_ring")==="back"?"back":Qn(s,"sq_ring")?"after":Wi(s,"sq_ring")?"waiting":"hub",nodes:{hub:{t:"Oh! You're the castaway. Um. You haven't seen a ring, have you? Gold, with a little blue stone. It was my mother's.",o:[{t:"Where did you lose it?",n:"where"},{t:"Sorry, no.",n:"end"}]},where:{t:"Down by the jetty on the mere. I was skipping stones. It slipped right off. Father will be furious.",o:[{t:"I'll look for it.",n:"end",d:s=>s.quests.start("sq_ring")},{t:"I hope you find it.",n:"end"}]},waiting:{t:"The jetty, on the mere \u2014 east of the village. Please hurry before the herons swallow it.",o:[{t:"I'm looking.",n:"end"}]},back:{t:"You found it?!",o:[{t:"Here. Your mother's ring.",n:"end",d:s=>{s.inventory.remove("lost_ring",1),s.inventory.add("gold",30),s.inventory.add("poultice",2),s.quests.complete("sq_ring"),s.ui.toast("Tamsin hugs the ring to her chest.",3)}},{t:"Finders keepers.",n:"keep"}]},keep:{t:"What? But\u2026 it's all I have of her. You \u2014 you're as bad as the Steward's men.",o:[{t:"(Keep it.)",n:"end",d:s=>{s.quests.complete("sq_ring"),ui(s,"kept_ring")}},{t:"I'm joking. Here.",n:"end",d:s=>{s.inventory.remove("lost_ring",1),s.inventory.add("gold",30),s.inventory.add("poultice",2),s.quests.complete("sq_ring")}}]},after:{t:s=>ra(s,"kept_ring")?"\u2026":"I wear it on a string now. Around my neck. Thank you again.",o:[{t:"Farewell.",n:"end"}]}}};re.rowena={start:s=>se(s,"sq_pip")==="back"?"back":Qn(s,"sq_pip")?"after":Wi(s,"sq_pip")?"waiting":"hub",nodes:{hub:{t:"Please \u2014 you go out on the roads, don't you? My son, Pip. Eight years old. He chased a red fox past the farm two days ago and never came back. The men say the Weald is too dangerous.",o:[{t:"Where would he go?",n:"where"},{t:"I'm sorry.",n:"end"}]},where:{t:"He always talks about the Hollow Oak Cave \u2014 the hunters' children dare each other to touch the back wall. It's west, past Garrick's lodge. Please.",o:[{t:"I'll bring him home.",n:"end",d:s=>s.quests.start("sq_pip")}]},waiting:{t:"The Hollow Oak Cave. West of the lodge. Please, hurry.",o:[{t:"I'm going.",n:"end"}]},back:{t:"He came running into the square an hour ago, filthy and grinning like nothing happened! I don't have much. This was my husband's satchel \u2014 he was the best herbalist in the Hollow. Take it.",o:[{t:"Keep him close.",n:"end",d:s=>s.quests.complete("sq_pip")}]},after:{t:"He's grounded until he's forty.",o:[{t:"Fair.",n:"end"}]}}};re.pip={start:s=>se(s,"sq_pip")==="talk"||Wi(s,"sq_pip")&&!ra(s,"pip_saved")?"cave":"hub",nodes:{cave:{t:"Are the wolves gone? I wasn't scared. I was\u2026 hiding strategically. The fox lives back there, did you see it? It has three kits!",o:[{t:"Your mother is worried sick. Go home, now.",n:"cave2"}]},cave2:{t:"Aw. Fine. Don't tell her I cried. I didn't cry.",o:[{t:"Run along. Stay on the path.",n:"end",d:s=>{ui(s,"pip_saved"),s.quests.setStage("sq_pip","back")}}]},hub:{t:"Want to see me throw a stone across the whole mere? I almost did it once.",o:[{t:"Another time.",n:"end"}]}}};re.edda={start:s=>se(s,"sq_wolves")==="back"?"back":Qn(s,"sq_wolves")?"after":Wi(s,"sq_wolves")?"waiting":"hub",nodes:{hub:{t:"If you're here to buy wool, there's precious little left. Wolves have taken five ewes. They den at the old watchtower up the Kingsway \u2014 I hear them howling every night.",o:[{t:"I'll deal with them.",n:"end",d:s=>s.quests.start("sq_wolves")},{t:"Rough times.",n:"end"}]},waiting:{t:"The watchtower, north up the Kingsway. Three of the beasts, maybe more.",o:[{t:"On it.",n:"end"}]},back:{t:"Truly? You've a stronger stomach than our watchmen. Here \u2014 my husband's axe, and some bread. And come by any time; there'll always be a crust for you here.",o:[{t:"Thank you, Edda.",n:"end",d:s=>s.quests.complete("sq_wolves")}]},after:{t:"Not a howl since. The sheep are grazing again.",o:[{t:"Good.",n:"end"}]}}};re.garrick={start:s=>se(s,"mq_greywater")==="tracks"?"tracks":"hub",shop:"hunter",nodes:{tracks:{t:"You followed those cart ruts, did you? So did I. A dozen men in red rags, hauling crates up to Osric's Hollow \u2014 the old bandit camp north-east of here. Red Osric pays in silver these days. Where's a cut-throat get silver?",o:[{t:"Who is Red Osric?",n:"osric"},{t:"I'm going there.",n:"warn"}]},osric:{t:"A deserter from the old king's guard. Quick with a sabre, quicker with his mouth. He'll want to talk before he fights. They always do. Use that.",o:[{t:"Anything else?",n:"warn"}]},warn:{t:"Take the trail north from the Weald Path. Archers on the walls. And if you want a better bow than that stick, bring me three wolf pelts sometime.",o:[{t:"Thanks, Garrick.",n:"end",d:s=>{ui(s,"garrick_told"),s.quests.setStage("mq_greywater","osric"),s.quests.stageOf("sq_pelts")||s.quests.start("sq_pelts")}}]},hub:{t:"Hunter's Lodge. Mind the traps.",o:[{t:"Trade.",n:"shop"},{t:"I have the wolf pelts.",c:s=>Wi(s,"sq_pelts")&&ke(s,"wolf_pelt",3),n:"pelts"},{t:"Need any help?",c:s=>!s.quests.stageOf("sq_pelts"),n:"peltq"},{t:"Teach me about hunting.",n:"teach"},{t:"Farewell.",n:"end"}]},peltq:{t:"Wolf pelts. Three. Wolves are thick in the Weald this year. Bring them and I'll give you something better than that.",o:[{t:"Deal.",n:"end",d:s=>s.quests.start("sq_pelts")}]},pelts:{t:"Clean kills, too. Here \u2014 my old hunting spear, and arrows. Long reach keeps wolves honest.",o:[{t:"Thank you.",n:"end",d:s=>{s.inventory.remove("wolf_pelt",3),s.quests.complete("sq_pelts")}}]},teach:{t:"Crouch [C] and the beasts hear less. Hit an unaware foe from hiding and you'll hit twice as hard \u2014 harder. Deer bolt; wolves circle; boars charge in a straight line, so step aside. And cook meat at a fire before you eat it.",o:[{t:"Good advice.",n:"hub"}]}}};re.osric={start:()=>"parley",nodes:{parley:{t:"Well, well. A lantern in the woods. You walked through my front gate like you were invited. Speak quick, castaway \u2014 my lads are bored and I'm curious.",o:[{t:"You've been stealing Greywater's medicine. Hand it back.",n:"demand"},{t:"Who pays you to rob herb-carts?",n:"who"},{t:"Garrick sends his regards.",c:s=>ra(s,"garrick_told"),n:"garrick"}]},demand:{t:"Back? It's gone, friend. Sold. Delivered. Paid for. You're a few weeks too late and a few dozen men too few.",o:[{t:"Then who bought it?",n:"who"},{t:"Then you'll pay in blood.",n:"fight"}]},garrick:{t:"Ha! That old badger still breathing? He's watched us for weeks. Never had the spine to come in. You, though\u2026 you might.",o:[{t:"Who pays you?",n:"who"},{t:"Draw your sabre.",n:"fight"}]},who:{t:"Now that is a valuable question. I've a letter in my coat that would answer it. Tell you what \u2014 a hundred and twenty crowns, and the letter's yours. Then I take my lads and sail for the mainland. Everyone lives.",o:[{t:"(Pay 120 crowns.)",c:s=>s.player.gold>=120,n:"paid",d:s=>{s.player.gold-=120}},{t:'[Might 4] "Or I take it off your corpse."',check:{attr:"might",min:4},n:"cowed"},{t:"I'll take it off your corpse.",n:"fight"}]},paid:{t:"A pleasure doing business. Here. Read it somewhere I can't see your face. Lads! Pack it up \u2014 we're done with this soggy rock.",o:[{t:"(Take the letter.)",n:"end",d:s=>{s.inventory.add("osric_letter",1),s.osricLeaves()}}]},cowed:{t:"\u2026You mean it, don't you. I've seen that look on men who don't lose. Fine. FINE. Take the cursed letter. My boys and I will find a softer kingdom.",o:[{t:"(Take the letter.)",n:"end",d:s=>{s.inventory.add("osric_letter",1),s.player.gainXp(60,"Intimidation"),s.osricLeaves()}}]},fight:{t:"Pity. I liked you. LADS! Bleed the lantern-bearer!",o:[{t:"(Fight.)",n:"end",d:s=>s.osricFight()}]}}};re.ysolde={start:s=>se(s,"mq_gates")==="travel"?"meet":se(s,"mq_gates")==="deserters"?"waiting":se(s,"mq_gates")==="ysolde"?"pass":se(s,"mq_draught")==="choice"?"choice":se(s,"mq_draught")==="confront"?"confront":"hub",nodes:{meet:{t:"Halt. Caer Dawn is closed to outsiders by order of the Steward \u2014 quarantine. I'm sorry, traveller, but you'll have to turn back.",o:[{t:"I carry proof the Steward is starving the villages.",c:s=>ke(s,"osric_letter"),n:"letter"},{t:"I need to speak with the Steward.",n:"no"}]},no:{t:"Everyone needs to speak with the Steward. The Steward needs to speak with no one. Turn back.",o:[{t:"Wait \u2014 read this letter.",c:s=>ke(s,"osric_letter"),n:"letter"},{t:"Fine.",n:"end"}]},letter:{t:`\u2026"The Steward pays in silver. \u2014 H." Keep your voice down. I've suspected for months. Half my Watch deserted when he cut their pay; the other half are his creatures. I can't move against him on one bandit's scrawl.`,o:[{t:"Then what can you do?",n:"deal"}]},deal:{t:"I can let you in, with a writ of passage \u2014 if you earn it in front of my men. A band of deserters is camped on the East Road, robbing everyone who passes. Clear them out and no one will question your writ.",o:[{t:"Consider it done.",n:"end",d:s=>s.quests.setStage("mq_gates","deserters")}]},waiting:{t:"The deserters' camp, west along the East Road, near the river bridge. Come back when it's quiet.",o:[{t:"Understood.",n:"end"}]},pass:{t:"My scouts say the camp's a graveyard. Well done. Here is your writ. Go to the great hall and present yourself to the Steward \u2014 he'll want to see the castaway everyone's whispering about. And whatever he tells you\u2026 come to me after.",o:[{t:"I will, Captain.",n:"end",d:s=>{s.inventory.add("gate_pass",1),ui(s,"cd_pass"),s.quests.setStage("mq_gates","steward")}}]},hub:{t:"Lantern-Bearer. The Watch has eyes on you \u2014 the good kind, mostly.",o:[{t:"What do you know of the Steward?",n:"steward"},{t:"Any news?",n:"news"},{t:"Farewell.",n:"end"}]},steward:{t:"Harlan was the king's treasurer before he was Steward. He counts everything. Coin, grain, men\u2026 and now medicine. Every poultice in the castle is under his seal. I'd give a great deal to know why.",o:[{t:"Back.",n:"hub"}]},news:{t:()=>ts(),o:[{t:"Back.",n:"hub"}]},choice:{t:"Is that\u2026 the cure? Maeve's Draught? By the dawn. With this, and the letter, and Corvin's journal, I can stand in front of the whole Watch and the Steward's own clerks and tell them what he did.",o:[{t:"Then let's end his rule. Together.",c:s=>ke(s,"osric_letter")&&ke(s,"journal"),n:"together"},{t:"I need the letter and the journal first.",c:s=>!(ke(s,"osric_letter")&&ke(s,"journal")),n:"end"},{t:"I haven't decided yet.",n:"end"}]},together:{t:"Meet me in the great hall. I'll bring every honest sword I have left. Bring the evidence \u2014 and keep your blade sheathed until I say otherwise.",o:[{t:"I'll be there.",n:"end",d:s=>{ui(s,"side_ysolde"),s.quests.setStage("mq_draught","confront")}}]},confront:{t:"The Watch is ready. Speak to the Steward. When he lies, I'll be the one holding the shackles.",o:[{t:"Let's go.",n:"end"}]}}};re.harlan={start:s=>se(s,"mq_gates")==="steward"?"meet":se(s,"mq_draught")==="choice"?"offer":se(s,"mq_draught")==="confront"?"confront":Qn(s,"mq_draught")?"after":"hub",nodes:{meet:{t:"The famous castaway. Forgive the quarantine \u2014 rules protect the many from the careless few. You've made yourself useful, I hear. Bandits, deserters. Avalon needs useful people.",o:[{t:"Why have the medicine carts stopped reaching the villages?",n:"carts"},{t:"What can be done about the Withering?",n:"cure"}]},carts:{t:"Bandits, as you have seen. We send what we can. The castle's needs come first \u2014 if Caer Dawn falls, Avalon falls. Surely you understand that.",o:[{t:"What of a cure?",n:"cure"}]},cure:{t:"There is no cure. Physician Corvin believed otherwise. He went digging in the ruins of Kingsfall, chasing old scrolls, and never returned. If you truly wish to help\u2026 find him. Or what remains of his research.",o:[{t:"I'll go to Kingsfall.",n:"end",d:s=>s.quests.complete("mq_gates")}]},hub:{t:"Order, castaway. Order is everything. Do you have business with the Steward?",o:[{t:"No, my lord.",n:"end"}]},offer:{t:"I hear Maeve of Greywater has brewed something remarkable. And that you carry it. Let me be plain: a cure belongs in the hands of the state, distributed with care, at a fair price. Give it to me, and you'll have five hundred crowns and a seat at my table.",o:[{t:"(Sell the Draught to Harlan.)",n:"sold",d:s=>{s.inventory.remove("grey_draught",1),s.inventory.add("gold",500),ui(s,"side_harlan")}},{t:"Not a chance.",n:"end"}]},sold:{t:"A sensible soul, at last. Rest assured, the villages will receive the Draught \u2014 in due course. Once the treasury is restored. Off you go.",o:[{t:"\u2026",n:"end",d:s=>s.quests.complete("mq_draught")}]},confront:{t:"Captain Ysolde. And the castaway. What is the meaning of this?",o:[{t:"You paid bandits to steal medicine, and jailed Corvin to hide the cure.",n:"accuse"}]},accuse:{t:"Lies. Forgeries. Who will believe a drowned nobody and a captain with an empty barracks? \u2026Ysolde. Put that sword down. I am the Steward of Avalon.",o:[{t:`Here is your letter, "H." And Corvin's own journal.`,n:"proof"}]},proof:{t:"(The clerks lean in. The guards shift their feet. One by one, the Steward's men lower their halberds.) \u2026You don't understand. Without control, there would be riots. Hoarding. I kept order. I KEPT ORDER!",o:[{t:"Captain, he's yours.",n:"arrest"},{t:"Let him leave Avalon. Exile is punishment enough.",n:"exile"}]},arrest:{t:'(Ysolde snaps the shackles shut.) "Harlan, Steward of Avalon, you are under arrest in the name of the people you starved." (The hall erupts.)',o:[{t:"(It is done.)",n:"end",d:s=>{ui(s,"harlan_arrested"),s.quests.complete("mq_draught")}}]},exile:{t:'(Ysolde hesitates, then nods.) "Take him to Saltby. Put him on the first boat west. If he returns, he hangs." (Harlan says nothing as they lead him out.)',o:[{t:"(It is done.)",n:"end",d:s=>{ui(s,"harlan_exiled"),s.quests.complete("mq_draught")}}]},after:{t:s=>ra(s,"side_harlan")?"Ah, my friend. The treasury thanks you. The villages\u2026 will wait.":"\u2026",o:[{t:"Farewell.",n:"end"}]}}};re.corvin={start:s=>se(s,"mq_kingsfall")==="corvin"?"cell":se(s,"mq_kingsfall")==="journal"?"journal":se(s,"mq_kingsfall")==="report"?"report":"hub",nodes:{cell:{t:"Light! Real light! Who \u2014 no, it doesn't matter. Malric is dead? Then help me up. I am Corvin, physician to the late king, and I have been in this hole for four months because I found the answer the Steward didn't want found.",o:[{t:"What answer?",n:"answer"}]},answer:{t:"The Withering is not a curse, whatever the fen-folk whisper. It is a fungus. Its spores ride the fog out of the Mire's heart. They root in lungs, in wheat, in wool. And fungus can be killed.",o:[{t:"How?",n:"how"}]},how:{t:"Two plants the spores cannot abide: Sunpetal, which grows only above the snowline on Highcrag, and Bitterroot, which grows in the very heart of the Mire. Brewed together, they make a draught that kills the threads in the blood. My notes are in the archive desk, through the west passage. Take them.",o:[{t:"And the Steward imprisoned you for this?",n:"why"}]},why:{t:"Harlan hoards every poultice in Avalon and sells relief to whoever bows lowest. A cure that anyone can brew would end that. So: Malric, chains, darkness. I'll make my own way to Greywater \u2014 Maeve and I trained together. Get the journal, and meet me there.",o:[{t:"Go safely.",n:"end",d:s=>{ui(s,"corvin_freed"),s.quests.setStage("mq_kingsfall","journal")}}]},journal:{t:"The archive is through the west passage. The desk, with the candle stubs. Go!",o:[{t:"Going.",n:"end"}]},report:{t:"You have the journal \u2014 good. Maeve has already boiled half her kitchen. Now listen: Sunpetal blooms on a high meadow past Ironhollow, above the snow. Bitterroot grows only at the Heart of the Mire, where the fog is thickest. You'll need a fen-mask for that \u2014 the folk of Stillwater make them.",o:[{t:"Sunpetal and Bitterroot. I'll bring both.",n:"end",d:s=>s.quests.complete("mq_kingsfall")}]},hub:{t:"Wash your hands. Then we can talk about spores.",o:[{t:"Tell me about the Mire.",n:"mire"},{t:"Farewell.",n:"end"}]},mire:{t:"Something at the Heart breathes out the fog. A rot in the deep peat, perhaps \u2014 I've theories. The Draught will save the sick. But to end the Withering for good, someone will have to go deeper than the Heart. Not this year, I think.",o:[{t:"Back.",n:"hub"}]}}};re.elowen={start:s=>se(s,"sq_pages")==="back"?"all":"hub",nodes:{hub:{t:"The Chronicle of Avalon. Eight hundred years of kings, in one book \u2014 and some vandal tore out the last eight pages and scattered them. If you find any, bring them to me.",o:[{t:"I'll keep an eye out.",c:s=>!s.quests.stageOf("sq_pages"),n:"end",d:s=>s.quests.start("sq_pages")},{t:"What's in the missing pages?",n:"what"},{t:"Farewell.",n:"end"}]},what:{t:"The last years of King Aldric, mostly. Including \u2014 so the index claims \u2014 the line of succession. Who his heir is. You can imagine why someone might want those pages lost.",o:[{t:"Back.",n:"hub"}]},all:{t:'All eight! Let me see\u2026 "\u2026and the king, knowing his illness, sent his only child across the sea for safety, bearing the royal lantern\u2026" The royal lantern. Lantern-Bearer. Where did you say you washed ashore?',o:[{t:"\u2026I don't remember.",n:"all2"}]},all2:{t:"Hm. Perhaps a coincidence. Perhaps not. Here \u2014 payment, as promised. And come back when you remember more. I'd very much like to talk to you again.",o:[{t:"I will.",n:"end",d:s=>{for(let t=1;t<=8;t++)s.inventory.remove("page"+t,1);s.quests.complete("sq_pages"),ui(s,"heir_hint")}}]}}};re.pell={start:s=>se(s,"sq_bounty")==="back"?"claim":"hub",nodes:{hub:{t:"Bounty board's mostly empty. Folk can't afford to pay for heroes. Except one \u2014 the Watch'll pay a hundred and fifty crowns for the hide of Grimtooth, the great bear on the High Pass.",o:[{t:"I'll take the bounty.",c:s=>!s.quests.stageOf("sq_bounty"),n:"end",d:s=>s.quests.start("sq_bounty")},{t:"Farewell.",n:"end"}]},claim:{t:"Grimtooth? Dead? The lads didn't believe me when I said you'd do it. Here's your bounty.",o:[{t:"Pleasure.",n:"end",d:s=>s.quests.complete("sq_bounty")}]}}};re.odran={start:()=>"hub",nodes:{hub:{t:"Welcome to Stillwater, dry-foot. We live on the boards because the ground here eats boots, and sometimes men. What brings you into the fen?",o:[{t:"I need to reach the Heart of the Mire.",n:"heart"},{t:"Tell me about the fog.",n:"fog"},{t:"Farewell.",n:"end"}]},heart:{t:"Then you need Nessa's mask, and a strong arm. A brute calls himself king of the Heart now \u2014 Gorm. Taller than a door, and he takes our catch as tribute. Kill him and the fen will sing your name.",o:[{t:"Back.",n:"hub"}]},fog:{t:"Our grandmothers called it the Wyrd-breath, and said the drowned were angry. Your physician says spores. I say: it kills either way. We burn comfrey in the masks and keep living.",o:[{t:"Back.",n:"hub"}]}}};re.nessa={start:s=>se(s,"mq_mire")==="stillwater"?"meet":se(s,"mq_mire")==="mask"?"mask":"hub",shop:"fen",nodes:{meet:{t:"A mask for the Heart? Ha. I've made forty masks. Thirty-one came back. Comfrey filters keep the spores out of your lungs, but only for a few minutes each.",o:[{t:"What do you need to make one?",n:"need"}]},need:{t:"Three comfrey \u2014 purple flowers, grows on the moors \u2014 and two clean linen. Or eighty crowns, and I use my own.",o:[{t:"I'll gather the materials.",n:"end",d:s=>s.quests.setStage("mq_mire","mask")}]},mask:{t:"Got my comfrey? Or my crowns?",o:[{t:"Here: 3 comfrey and 2 linen.",c:s=>ke(s,"comfrey",3)&&ke(s,"linen",2),n:"made",d:s=>{s.inventory.remove("comfrey",3),s.inventory.remove("linen",2)}},{t:"(Pay 80 crowns.)",c:s=>s.player.gold>=80,n:"made",d:s=>{s.player.gold-=80}},{t:"Not yet.",n:"end"}]},made:{t:"There. Fen-mask, and three filters. Use a filter [X] when you smell the rot \u2014 it lasts about two minutes. Buy more from Lio or brew them: two comfrey, one linen, at a fire. Don't die.",o:[{t:"Thank you, Nessa.",n:"end",d:s=>{s.inventory.add("fog_mask",1),s.inventory.add("mask_filter",3),s.quests.setStage("mq_mire","heart")}}]},hub:{t:"Need filters? I've a few.",o:[{t:"Trade.",n:"shop"},{t:"Farewell.",n:"end"}]}}};re.aldo={start:s=>se(s,"sq_net")==="back"?"back":Wi(s,"sq_net")?"waiting":Qn(s,"sq_net")?"after":"hub",nodes:{hub:{t:"Storm took my best net. Saw it tangled on the wreck of the Merrow, west along the beach \u2014 but I'm too old to climb wet timber, and the tide's cruel there.",o:[{t:"I'll fetch it.",n:"end",d:s=>s.quests.start("sq_net")},{t:"A hard loss.",n:"end"}]},waiting:{t:"West along the shore. The Merrow. Mind the gulls; they bite.",o:[{t:"Right.",n:"end"}]},back:{t:"My net! Barely a tear. Here \u2014 fresh grilled trout, and coin. You've a fisherman's heart.",o:[{t:"Good fishing, Aldo.",n:"end",d:s=>{s.inventory.remove("net",1),s.quests.complete("sq_net")}}]},after:{t:"Caught a pike this morning. Ugly beast. Delicious.",o:[{t:"Farewell.",n:"end"}]}}};re.ines={start:()=>"hub",shop:"coast",nodes:{hub:{t:"Salt, oil, twine. What do you need?",o:[{t:"Trade.",n:"shop"},{t:"Morwen needs lamp oil for the lighthouse.",c:s=>se(s,"sq_light")==="oil"&&!ke(s,"lamp_oil"),n:"oil"},{t:"Farewell.",n:"end"}]},oil:{t:"For the light? Take it \u2014 no charge. My brother's boat was the second one lost on Gull Point rocks.",o:[{t:"Thank you.",n:"end",d:s=>s.inventory.add("lamp_oil",1)}]}}};re.morwen={start:s=>se(s,"sq_light")==="back"?"back":Wi(s,"sq_light")?"waiting":Qn(s,"sq_light")?"after":"hub",nodes:{hub:{t:"The light at Gull Point has burned for two hundred years. It went dark the week the Steward stopped sending oil. Three ships have broken on the rocks since. Will you fetch oil from Ines in Saltby?",o:[{t:"I will.",n:"end",d:s=>s.quests.start("sq_light")},{t:"Not now.",n:"end"}]},waiting:{t:s=>ke(s,"lamp_oil")?"Pour it into the reservoir at the foot of the tower \u2014 the old wick-pump carries it up to the great lamp. My knees won't take the stair any more.":"Ines, in Saltby. She'll have oil.",o:[{t:"Right.",n:"end"}]},back:{t:"I saw it from the cottage. Burning again. Take my old brass lantern \u2014 it was my father's. It's right that a lantern-bearer should have it.",o:[{t:"Thank you, Morwen.",n:"end",d:s=>s.quests.complete("sq_light")}]},after:{t:"No ships lost this week.",o:[{t:"Good.",n:"end"}]}}};re.durk={start:s=>se(s,"sq_mine")==="back"?"back":"hub",shop:"miner",nodes:{hub:{t:"Ironhollow. Best ore on the isle. Brigands squatting in the deep tunnels though \u2014 my lads won't go down. Can't sell ore I can't dig.",o:[{t:"I'll clear the tunnels.",c:s=>!s.quests.stageOf("sq_mine"),n:"end",d:s=>s.quests.start("sq_mine")},{t:"Sell me some ore.",n:"shop"},{t:"Farewell.",n:"end"}]},back:{t:"Clear? Truly? Then the forges of Avalon owe you. Take this, and some ore besides.",o:[{t:"Glad to help.",n:"end",d:s=>s.quests.complete("sq_mine")}]}}};re.villager={start:()=>"hub",nodes:{hub:{t:(s,t)=>t.npc&&t.npc.line||"Hm? Oh \u2014 you're the castaway.",o:[{t:"Heard any rumours?",n:"rumor"},{t:"Farewell.",n:"end"}]},rumor:{t:()=>ts(),o:[{t:"Thanks.",n:"end"}]}}};var Ef=[14725272,14198920,13145196,12093024,10517080,9069640],Af=[1710618,2759184,4861984,6965802,9067050,11037226,12101768,10132122],aa=[6969914,5925450,4872810,8014394,6974042,5917274,9075290,3820090,8022602],Yo=class{constructor(t){this.gam
