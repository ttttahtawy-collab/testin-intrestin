<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clinical Case Bank</title>
<style>
  @page { size: A4; margin: 16mm 15mm; }
  * { box-sizing: border-box; }
  body { font-family: "DejaVu Sans", Arial, sans-serif; font-size: 10.5pt; line-height: 1.42; color: #1a1a1a; margin: 0; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  h1 { font-size: 22pt; color: #1f3a5f; margin: 0 0 2mm; }
  .sub { font-size: 12pt; color: #1f3a5f; margin-top: 0; }
  h2 { font-size: 14pt; color: #fff; background: #1f3a5f; padding: 6px 10px; margin: 0 0 8px; border-radius: 3px; }
  h2.ans { background: #2e6b3f; }
  .tag { float: right; font-size: 9pt; font-weight: normal; opacity: .9; margin-top: 3px; }
  .stem { background: #f2f5f9; border-left: 4px solid #1f3a5f; padding: 8px 12px; margin-bottom: 10px; }
  ol.q { padding-left: 20px; margin: 0; }
  ol.q li { margin-bottom: 9px; }
  .m { font-weight: bold; color: #1f3a5f; white-space: nowrap; }
  .total { text-align: right; font-weight: bold; margin-top: 6px; color: #1f3a5f; }
  .lines { border-bottom: 1px dotted #aaa; height: 16px; }
  table { border-collapse: collapse; width: 100%; margin: 0 0 8px; font-size: 9.8pt; }
  td, th { border: 1px solid #c9d3df; padding: 4px 7px; vertical-align: top; text-align: left; }
  th { background: #e8eef5; }
  td.mk { width: 46px; text-align: center; font-weight: bold; color: #2e6b3f; }
  .pearl { background: #fff7e0; border-left: 4px solid #d9a400; padding: 6px 10px; font-size: 9.6pt; }
  .small { font-size: 9pt; color: #555; }
  ul { margin: 2px 0; padding-left: 18px; }
  .cover p { max-width: 150mm; }
  .toc td { border: none; border-bottom: 1px solid #e3e8ee; padding: 2px 6px; font-size: 9.5pt; }
  .toc tr.part td { background: #1f3a5f; color: #fff; font-weight: bold; padding: 4px 6px; }
  .toc tr.part .small { color: #dbe4ef; }
</style>
</head>
