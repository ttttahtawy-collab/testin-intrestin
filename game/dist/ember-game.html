  color: #ffd6d0; font: 600 22px Fredoka, 'Trebuchet MS', sans-serif; letter-spacing: 2px;
  pointer-events: none; transition: opacity .4s;
}

<!-- Core engine -->
<script>
// Core utilities: math, easing, colour helpers, seeded random, canvas helpers.
// Everything in the game hangs off the global namespace `G` so the game runs
// from file:// without a bundler or module loader.
window.G = window.G || {};
(function (G) {
  'use strict';
  const U = (G.U = {});

  U.TAU = Math.PI * 2;
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.invLerp = (a, b, v) => (v - a) / (b - a);
  U.approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
  U.sign = (v) => (v > 0 ? 1 : v < 0 ? -1 : 0);
  U.rand = (a, b) => a + Math.random() * (b - a);
  U.randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  U.dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
  U.overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  U.damp = (a, b, lambda, dt) => U.lerp(a, b, 1 - Math.exp(-lambda * dt));

  // Deterministic PRNG (mulberry32) so procedural art is identical every run.
  U.rng = function (seed) {
    let s = seed >>> 0;
    return function () {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  U.hash2 = function (x, y, seed) {
    let h = (x * 374761393 + y * 668265263 + (seed || 0) * 2246822519) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
  U.strHash = function (str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  };

  // Easing
  U.ease = {
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
    outElastic: (t) => (t === 0 || t === 1 ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (U.TAU / 3)) + 1),
  };

  // Colour helpers (hex strings in, hex/rgba strings out). Results are cached
  // because tile/background pre-rendering calls them thousands of times.
  const rgbCache = new Map();
  U.hexToRgb = function (hex) {
    let c = rgbCache.get(hex);
    if (c) return c;
    let h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    const n = parseInt(h, 16);
    c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    rgbCache.set(hex, c);
    return c;
  };
  U.rgbToHex = (r, g, b) =>
    '#' + ((1 << 24) | (U.clamp(Math.round(r), 0, 255) << 16) | (U.clamp(Math.round(g), 0, 255) << 8) | U.clamp(Math.round(b), 0, 255)).toString(16).slice(1);
  U.mix = function (a, b, t) {
    const A = U.hexToRgb(a), B = U.hexToRgb(b);
    return U.rgbToHex(U.lerp(A[0], B[0], t), U.lerp(A[1], B[1], t), U.lerp(A[2], B[2], t));
  };
  // amt > 0 lightens toward white, amt < 0 darkens toward black.
  U.shade = (hex, amt) => (amt >= 0 ? U.mix(hex, '#ffffff', amt) : U.mix(hex, '#000000', -amt));
  U.rgba = function (hex, a) {
    const c = U.hexToRgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  };
  U.hsl = (h, s, l) => 'hsl(' + h + ',' + s + '%,' + l + '%)';

  // Canvas helpers
  U.roundRect = function (ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
  U.poly = function (ctx, pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath();
  };
  // Tapered limb: a capsule from (x1,y1) radius r1 to (x2,y2) radius r2.
  U.limb = function (ctx, x1, y1, r1, x2, y2, r2) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.arc(x1, y1, r1, a + Math.PI / 2, a - Math.PI / 2, false);
    ctx.arc(x2, y2, r2, a - Math.PI / 2, a + Math.PI / 2, false);
    ctx.closePath();
  };
  U.makeCanvas = function (w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  };
  U.formatTime = function (t) {
    if (t == null || !isFinite(t)) return '--:--';
    const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
    return m + ':' + String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
  };
})(window.G);

</script>
<script>
// Unified input: keyboard, gamepad and touch/mouse (pointer events) mapped to
// abstract actions. Edge states (pressed/released) are latched between fixed
// update steps so no tap is ever lost, regardless of frame rate.
(function (G) {
  'use strict';
  const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'attack', 'dash', 'pause', 'confirm', 'back'];

  const KEYMAP = {
    ArrowLeft: ['left'], KeyA: ['left'],
    ArrowRight: ['right'], KeyD: ['right'],
    ArrowUp: ['up', 'jump'], KeyW: ['up', 'jump'],
    ArrowDown: ['down'], KeyS: ['down'],
    Space: ['jump', 'confirm'], KeyZ: ['jump', 'confirm'], KeyK: ['jump'],
    KeyX: ['attack', 'back'], KeyJ: ['attack'],
    KeyC: ['dash'], KeyL: ['dash'], ShiftLeft: ['dash'], ShiftRight: ['dash'],
    Escape: ['pause', 'back'], KeyP: ['pause'], Backspace: ['back'],
    Enter: ['confirm', 'pause'], NumpadEnter: ['confirm'],
  };

  const I = (G.Input = {
    down: {}, pressed: {}, released: {},
    _q: {}, _qr: {}, _keys: {}, _pad: {}, _touch: {},
    lastDevice: 'keyboard',
    usingTouch: false,
    // Pointer (for menus): logical coords, click latch
    pointer: { x: -1, y: -1, active: false, clicked: false, _clickQ: false, moved: false },
    touchButtons: [],
    _ptrButtons: new Map(),
    anyPressed: false,
  });
  ACTIONS.forEach((a) => { I.down[a] = false; I.pressed[a] = false; I.released[a] = false; });

  function setSource(src, action, isDown) {
    const prev = I.down[action];
    src[action] = isDown;
    const now = !!(I._keys[action] || I._pad[action] || I._touch[action]);
    if (now && !prev) I._q[action] = true;
    if (!now && prev) I._qr[action] = true;
    I.down[action] = now;
  }
  // Each action may be held by multiple keys: track key counts.
  const keyHeld = {};
  function keyAction(action) {
    let held = false;
    for (const k in keyHeld) if (keyHeld[k] && KEYMAP[k] && KEYMAP[k].indexOf(action) >= 0) { held = true; break; }
    return held;
  }

  I.init = function (canvas) {
    window.addEventListener('keydown', (e) => {
      const acts = KEYMAP[e.code];
      if (G.Audio) G.Audio.unlock();
      I.lastDevice = 'keyboard';
      if (!acts) return;
      e.preventDefault();
      if (e.repeat) return;
      keyHeld[e.code] = true;
      acts.forEach((a) => setSource(I._keys, a, true));
    });
    window.addEventListener('keyup', (e) => {
      const acts = KEYMAP[e.code];
      if (!acts) return;
      e.preventDefault();
      keyHeld[e.code] = false;
      acts.forEach((a) => setSource(I._keys, a, keyAction(a)));
    });
    window.addEventListener('blur', () => {
      for (const k in keyHeld) keyHeld[k] = false;
      ACTIONS.forEach((a) => { setSource(I._keys, a, false); setSource(I._touch, a, false); });
      I._ptrButtons.clear();
    });

    const ptr = I.pointer;
    function updatePtr(e) {
      const p = G.R.toLogical(e.clientX, e.clientY);
      ptr.x = p.x; ptr.y = p.y; ptr.moved = true;
    }
    canvas.addEventListener('pointerdown', (e) => {
      if (G.Audio) G.Audio.unlock();
      updatePtr(e);
      if (e.pointerType === 'touch') { I.usingTouch = true; I.lastDevice = 'touch'; }
      else I.lastDevice = 'mouse';
      // Virtual buttons get first claim on the pointer.
      const btn = I.touchVisible() ? hitButton(ptr.x, ptr.y) : null;
      if (btn) {
        I._ptrButtons.set(e.pointerId, btn);
        refreshTouch();
      } else {
        ptr.active = true;
        ptr._clickQ = true;
        ptr.downX = ptr.x; ptr.downY = ptr.y;
      }
      try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => {
      updatePtr(e);
      if (I._ptrButtons.has(e.pointerId)) {
        const btn = hitButton(ptr.x, ptr.y);
        // Allow sliding between the d-pad buttons, keep others latched.
        const cur = I._ptrButtons.get(e.pointerId);
        if (btn && btn !== cur && (btn.slide && cur.slide)) { I._ptrButtons.set(e.pointerId, btn); refreshTouch(); }
      }
    });
    const end = (e) => {
      if (I._ptrButtons.has(e.pointerId)) { I._ptrButtons.delete(e.pointerId); refreshTouch(); }
      else ptr.active = false;
    };
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('gamepadconnected', () => { I.lastDevice = 'gamepad'; });
  };

  function hitButton(x, y) {
    for (const b of I.touchButtons) {
      if (b.hidden) continue;
      const dx = x - b.x, dy = y - b.y;
      if (dx * dx + dy * dy <= (b.r * 1.25) * (b.r * 1.25)) return b;
    }
    return null;
  }
  function refreshTouch() {
    const held = {};
    I._ptrButtons.forEach((b) => b.actions.forEach((a) => (held[a] = true)));
    ACTIONS.forEach((a) => setSource(I._touch, a, !!held[a]));
  }

  I.touchVisible = function () {
    const mode = (G.Save && G.Save.options.touch) || 'auto';
    if (mode === 'on') return true;
    if (mode === 'off') return false;
    return I.usingTouch;
  };
  // Called by the renderer whenever the logical view size changes.
  I.layoutTouch = function (W, H) {
    const s = 1;
    I.touchButtons = [
      { id: 'left', x: 78, y: H - 86, r: 46 * s, actions: ['left'], label: '◀', slide: true },
      { id: 'right', x: 186, y: H - 86, r: 46 * s, actions: ['right'], label: '▶', slide: true },
      { id: 'down', x: 132, y: H - 176, r: 34 * s, actions: ['down'], label: '▼', slide: true },
      { id: 'jump', x: W - 82, y: H - 92, r: 52 * s, actions: ['jump', 'confirm'], label: 'JUMP' },
      { id: 'attack', x: W - 194, y: H - 70, r: 42 * s, actions: ['attack'], label: 'HIT' },
      { id: 'dash', x: W - 112, y: H - 210, r: 34 * s, actions: ['dash'], label: 'DASH' },
      { id: 'pause', x: W - 36, y: 36, r: 24, actions: ['pause'], label: 'II' },
    ];
  };
  I.isTouchHeld = function (id) {
    for (const b of I._ptrButtons.values()) if (b.id === id) return true;
    return false;
  };

  function pollGamepad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let gp = null;
    for (const p of pads) if (p && p.connected) { gp = p; break; }
    const st = {};
    if (gp) {
      const b = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      st.left = b(14) || ax < -0.4;
      st.right = b(15) || ax > 0.4;
      st.up = b(12) || ay < -0.5;
      st.down = b(13) || ay > 0.5;
      st.jump = b(0);
      st.confirm = b(0);
      st.attack = b(2);
      st.back = b(1);
      st.dash = b(1) || b(5) || b(7);
      st.pause = b(9);
      let any = false;
      for (const k in st) if (st[k]) any = true;
      if (any) I.lastDevice = 'gamepad';
    }
    ACTIONS.forEach((a) => {
      if (!!st[a] !== !!I._pad[a]) setSource(I._pad, a, !!st[a]);
    });
  }

  // Called once per fixed update step.
  I.update = function () {
    pollGamepad();
    I.anyPressed = false;
    ACTIONS.forEach((a) => {
      I.pressed[a] = !!I._q[a];
      I.released[a] = !!I._qr[a];
      if (I.pressed[a]) I.anyPressed = true;
    });
    I._q = {}; I._qr = {};
    I.pointer.clicked = I.pointer._clickQ;
    I.pointer._clickQ = false;
    if (I.pointer.clicked) I.anyPressed = true;
  };
  // Swallow all pending edges (used on scene switches so a confirm press
  // doesn't carry over into the next screen).
  I.flush = function () {
    I._q = {}; I._qr = {};
    ACTIONS.forEach((a) => { I.pressed[a] = false; I.released[a] = false; });
    I.pointer._clickQ = false; I.pointer.clicked = false;
  };
})(window.G);

</script>
<script>
// Procedural sound effects via the Web Audio API. No audio files needed:
// every effect is synthesised from oscillators, envelopes and noise.
(function (G) {
  'use strict';
  const A = (G.Audio = {
    ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null,
    unlocked: false, _lastPlay: {},
  });

  A.init = function () {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      A.ctx = new AC();
    } catch (e) { A.ctx = null; return; }
    const c = A.ctx;
    A.master = c.createGain();
    A.master.gain.value = 0.9;
    // Gentle limiter so stacked effects never clip harshly.
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 12; comp.ratio.value = 6;
    comp.attack.value = 0.003; comp.release.value = 0.2;
    A.master.connect(comp); comp.connect(c.destination);
    A.sfxBus = c.createGain(); A.sfxBus.connect(A.master);
    A.musicBus = c.createGain(); A.musicBus.connect(A.master);
    // 1 second of white noise, reused by every noisy effect.
    const len = c.sampleRate;
    A.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = A.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.applyVolumes();
    document.addEventListener('visibilitychange', () => {
      if (!A.ctx) return;
      if (document.hidden) A.ctx.suspend();
      else if (A.unlocked) A.ctx.resume();
    });
  };

  A.unlock = function () {
    if (!A.ctx) return;
    if (A.ctx.state !== 'running') A.ctx.resume();
    A.unlocked = true;
  };

  A.applyVolumes = function () {
    if (!A.ctx) return;
    const o = G.Save ? G.Save.options : { music: 0.6, sfx: 0.8 };
    A.sfxBus.gain.value = o.sfx * 0.9;
    A.musicBus.gain.value = o.music * 0.55;
  };

  // --- building blocks -------------------------------------------------
  function env(g, t, a, peak, d, sustain, r) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, sustain), t + a + d);
    if (r) g.gain.exponentialRampToValueAtTime(0.0001, t + a + d + r);
  }
  // Tone with pitch sweep.
  function tone(opts) {
    const c = A.ctx, t = (opts.at || c.currentTime) + (opts.delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = opts.type || 'square';
    o.frequency.setValueAtTime(opts.f0, t);
    if (opts.f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, opts.f1), t + (opts.sweep || opts.dur));
    if (opts.vib) {
      const l = c.createOscillator(), lg = c.createGain();
      l.frequency.value = opts.vib; lg.gain.value = opts.vibDepth || 20;
      l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + opts.dur + 0.05);
    }
    let node = o;
    if (opts.lp) {
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = opts.lp;
      o.connect(f); node = f;
    }
    node.connect(g);
    g.connect(opts.bus || A.sfxBus);
    env(g, t, opts.a || 0.005, opts.vol || 0.2, opts.dur, 0.0001, 0);
    o.start(t);
    o.stop(t + opts.dur + 0.05);
  }
  function noise(opts) {
    const c = A.ctx, t = (opts.at || c.currentTime) + (opts.delay || 0);
    const s = c.createBufferSource(); s.buffer = A.noiseBuf;
    s.playbackRate.value = opts.rate || 1;
    const f = c.createBiquadFilter();
    f.type = opts.filter || 'lowpass';
    f.frequency.setValueAtTime(opts.f0 || 1000, t);
    if (opts.f1) f.frequency.exponentialRampToValueAtTime(opts.f1, t + opts.dur);
    f.Q.value = opts.q || 1;
    const g = c.createGain();
    s.connect(f); f.connect(g); g.connect(opts.bus || A.sfxBus);
    env(g, t, opts.a || 0.002, opts.vol || 0.2, opts.dur, 0.0001, 0);
    s.start(t, Math.random() * 0.5);
    s.stop(t + opts.dur + 0.05);
  }
  A.tone = tone; A.noise = noise;

  const N = (semi) => 440 * Math.pow(2, (semi - 9) / 12); // semitone from C4

  const SFX = {
    jump: () => tone({ type: 'square', f0: 280, f1: 620, dur: 0.13, vol: 0.09, lp: 2600 }),
    djump: () => {
      tone({ type: 'triangle', f0: 520, f1: 1150, dur: 0.16, vol: 0.16 });
      tone({ type: 'sine', f0: 1500, f1: 2300, dur: 0.12, vol: 0.05, delay: 0.04 });
    },
    walljump: () => {
      tone({ type: 'square', f0: 360, f1: 760, dur: 0.12, vol: 0.08, lp: 2400 });
      noise({ f0: 3000, filter: 'bandpass', dur: 0.06, vol: 0.08 });
    },
    land: () => noise({ f0: 500, f1: 120, dur: 0.08, vol: 0.18 }),
    step: () => noise({ f0: 900, filter: 'bandpass', q: 2, dur: 0.03, vol: 0.035 }),
    slide: () => noise({ f0: 2500, filter: 'bandpass', q: 3, dur: 0.06, vol: 0.025 }),
    gem: () => {
      const p = 1 + Math.random() * 0.06;
      tone({ type: 'sine', f0: 1318 * p, dur: 0.07, vol: 0.12 });
      tone({ type: 'sine', f0: 1976 * p, dur: 0.16, vol: 0.12, delay: 0.06 });
    },
    shard: () => {
      [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => tone({ type: 'triangle', f0: N(s + 12), dur: 0.22, vol: 0.12, delay: i * 0.055 }));
      tone({ type: 'sine', f0: N(36), dur: 0.6, vol: 0.05, delay: 0.35, vib: 6, vibDepth: 15 });
    },
    heart: () => [0, 4, 7, 12].forEach((s, i) => tone({ type: 'sine', f0: N(s + 7), dur: 0.15, vol: 0.14, delay: i * 0.06 })),
    punch: () => {
      noise({ f0: 1800, f1: 400, filter: 'bandpass', q: 0.8, dur: 0.09, vol: 0.16 });
      tone({ type: 'sine', f0: 240, f1: 90, dur: 0.08, vol: 0.12 });
    },
    whiff: () => noise({ f0: 1200, f1: 3000, filter: 'bandpass', q: 1.5, dur: 0.08, vol: 0.06 }),
    hit: () => {
      tone({ type: 'square', f0: 320, f1: 120, dur: 0.1, vol: 0.12, lp: 1800 });
      noise({ f0: 2000, f1: 300, dur: 0.1, vol: 0.14 });
    },
    stomp: () => {
      tone({ type: 'sine', f0: 420, f1: 140, dur: 0.14, vol: 0.2 });
      noise({ f0: 900, f1: 200, dur: 0.07, vol: 0.12 });
    },
    pop: () => {

    },
    unlock: () => [0, 5, 9, 12, 17].forEach((s, i) => tone({ type: 'triangle', f0: N(s + 12), dur: 0.2, vol: 0.1, delay: i * 0.07 })),
    respawn: () => [0, 7, 12].forEach((s, i) => tone({ type: 'sine', f0: N(s + 12), dur: 0.15, vol: 0.1, delay: i * 0.06 })),
  };

  // Rate-limited play so 20 gems collected on the same frame don't explode.
  A.play = function (name) {
    if (!A.ctx || !A.unlocked || A.ctx.state !== 'running') return;
    const f = SFX[name];
    if (!f) return;
    const now = A.ctx.currentTime;
    if (A._lastPlay[name] && now - A._lastPlay[name] < 0.03) return;
    A._lastPlay[name] = now;
    try { f(); } catch (e) { /* audio failures must never break the game */ }
  };
  A.has = (name) => !!SFX[name];
})(window.G);

<script>
// Procedural chiptune-ish music sequencer. Each track is a small description
// (tempo, key, mode, chord progressions, instrumentation); melodies are
// composed deterministically from a seed so every track always sounds the same.
(function (G) {
  'use strict';
  const U = G.U;
  const SCALES = {
    major: [0, 2, 4, 5, 7, 9, 11],
    minor: [0, 2, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10],
    harmonic: [0, 2, 3, 5, 7, 8, 11],
    lydian: [0, 2, 4, 6, 7, 9, 11],
  };
  const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  const RHYTHMS = [
    [[0, 2], [2, 2], [4, 4], [8, 2], [10, 2], [12, 4]],
    [[0, 3], [3, 3], [6, 2], [8, 4], [12, 2], [14, 2]],
    [[0, 4], [4, 2], [6, 2], [8, 6], [14, 2]],
    [[0, 2], [2, 1], [3, 1], [4, 2], [6, 2], [8, 2], [10, 2], [12, 2], [14, 2]],
    [[0, 6], [6, 2], [8, 8]],
    [[2, 2], [4, 2], [6, 2], [8, 4], [12, 4]],
    [[0, 2], [4, 2], [6, 2], [8, 2], [10, 4], [14, 2]],
  ];

  const TRACKS = {
    title: { bpm: 92, key: 0, mode: 'major', A: [0, 4, 5, 3], B: [5, 3, 0, 4], lead: 'triangle', drums: 'soft', bass: 'pulse', arp: true, pad: 0.05, seed: 11, density: 0.5 },
    overworld: { bpm: 112, key: 7, mode: 'major', A: [0, 5, 3, 4], B: [3, 4, 2, 5], lead: 'square', drums: 'pop', bass: 'bounce', arp: true, pad: 0.035, seed: 23 },
    w1: { bpm: 128, key: 5, mode: 'major', A: [0, 3, 4, 0], B: [5, 3, 1, 4], lead: 'square', drums: 'pop', bass: 'bounce', arp: false, pad: 0.035, seed: 101 },
    w2: { bpm: 104, key: 9, mode: 'minor', A: [0, 5, 2, 6], B: [3, 0, 4, 4], lead: 'triangle', drums: 'sparse', bass: 'pulse', arp: true, pad: 0.06, seed: 202, echo: true },
    w3: { bpm: 138, key: 2, mode: 'dorian', A: [0, 3, 0, 6], B: [5, 6, 0, 0], lead: 'square', drums: 'drive', bass: 'drive', arp: true, pad: 0.03, seed: 303 },
    w4: { bpm: 146, key: 4, mode: 'harmonic', A: [0, 5, 3, 4], B: [0, 6, 5, 4], lead: 'sawtooth', drums: 'drive', bass: 'drive', arp: true, pad: 0.04, seed: 404 },
    boss: { bpm: 158, key: 9, mode: 'harmonic', A: [0, 0, 5, 4], B: [3, 4, 0, 4], lead: 'sawtooth', drums: 'heavy', bass: 'drive', arp: true, pad: 0.03, seed: 505 },
    final: { bpm: 166, key: 11, mode: 'harmonic', A: [0, 5, 1, 4], B: [3, 5, 4, 4], lead: 'sawtooth', drums: 'heavy', bass: 'drive', arp: true, pad: 0.045, seed: 606 },
    ending: { bpm: 84, key: 0, mode: 'lydian', A: [0, 1, 0, 1], B: [5, 3, 4, 0], lead: 'triangle', drums: 'soft', bass: 'pulse', arp: true, pad: 0.07, seed: 707, echo: true },
    story: { bpm: 76, key: 2, mode: 'minor', A: [0, 5, 3, 4], B: [5, 6, 0, 4], lead: 'triangle', drums: 'none', bass: 'pulse', arp: true, pad: 0.07, seed: 808, echo: true },
  };

  const DRUMS = {
    none: { k: '', s: '', h: '' },
    soft: { k: 'x.......x.......', s: '........x.......', h: '..x...x...x...x.' },
    pop: { k: 'x.....x.x.......', s: '....x.......x...', h: 'x.x.x.x.x.x.x.xo' },
    sparse: { k: 'x.........x.....', s: '........x.......', h: '....x.......x..x' },
    drive: { k: 'x...x...x...x...', s: '....x.......x..x', h: '.xx..xx..xx..xxo' },
    heavy: { k: 'x.x...x.x.x...x.', s: '....x.......x.xx', h: 'xxxxxxxxxxxxxxxx' },
  };

  function compose(def) {
    const rng = U.rng(def.seed);
    const scale = SCALES[def.mode];
    const chordTones = (deg) => [deg, deg + 2, deg + 4];
    let prev = 9; // scale index for melody (approx 1.5 octaves above key)
    const lo = 5, hi = 15;
    function bar(deg, cadence) {
      const notes = [];
      const r = cadence ? [[0, 4], [4, 4], [8, 8]] : RHYTHMS[Math.floor(rng() * RHYTHMS.length)];
      r.forEach(([st, len], i) => {
        let p;
        const last = cadence && i === r.length - 1;
        if (st % 4 === 0 || last) {
          // land on a chord tone close to the previous pitch
          const cands = [];
          chordTones(deg).forEach((t) => { for (let o = -7; o <= 14; o += 7) cands.push(t + o + 7); });
          cands.sort((a, b) => Math.abs(a - prev) - Math.abs(b - prev));
          p = last ? cands.find((c) => ((c % 7) + 7) % 7 === ((deg % 7) + 7) % 7) || cands[0] : cands[Math.floor(rng() * 2)];
        } else {
          const stepv = [-2, -1, -1, 1, 1, 2][Math.floor(rng() * 6)];
          p = prev + stepv;
        }
        p = U.clamp(p, lo, hi);
        prev = p;
        notes.push({ st, len, p });
      });
      return notes;
    }
    const secA = def.A.map((d, i) => bar(d, false));
    const secB = def.B.map((d, i) => bar(d, i === 3 && false));
    const secA2 = def.A.map((d, i) => (i === 3 ? bar(d, true) : secA[i]));
    const melody = secA.concat(secB, secA2, secB);
    const chords = def.A.concat(def.B, def.A, def.B);
    return { melody, chords, scale };
  }

  const M = (G.Music = { current: null, currentName: null, _timer: null });

  function semi(scale, idx) {
    const o = Math.floor(idx / 7), i = ((idx % 7) + 7) % 7;
    return scale[i] + 12 * o;
  }

  M.play = function (name) {
    const A = G.Audio;
    if (M.currentName === name) return;
    M.stop();
    M.currentName = name;
    const def = TRACKS[name];
    if (!def || !A.ctx) return;
    const song = compose(def);
    const gain = A.ctx.createGain();
    gain.gain.value = 0;
    gain.connect(A.musicBus);
    gain.gain.setTargetAtTime(1, A.ctx.currentTime, 0.4);
    const tr = { def, song, gain, step: 0, next: A.ctx.currentTime + 0.1, stepDur: 60 / def.bpm / 4 };
    M.current = tr;
    M._timer = setInterval(() => tick(tr), 25);
  };

  M.stop = function () {
    const A = G.Audio;
    if (M._timer) clearInterval(M._timer);
    M._timer = null;
    if (M.current && A.ctx) {
      const g = M.current.gain;
      g.gain.cancelScheduledValues(A.ctx.currentTime);
      g.gain.setTargetAtTime(0, A.ctx.currentTime, 0.12);
      setTimeout(() => { try { g.disconnect(); } catch (e) { /* noop */ } }, 1500);
    }
    M.current = null;
    M.currentName = null;
  };

  function tick(tr) {
    const A = G.Audio;
    if (!A.ctx || A.ctx.state !== 'running') { tr.next = A.ctx ? A.ctx.currentTime + 0.05 : 0; return; }
    if (tr.next < A.ctx.currentTime - 0.2) tr.next = A.ctx.currentTime + 0.05; // recovered from suspension
    while (tr.next < A.ctx.currentTime + 0.12) {
      schedule(tr, tr.step, tr.next);
      tr.next += tr.stepDur;
      tr.step = (tr.step + 1) % (16 * tr.song.chords.length);
    }
  }

  function pad(tr, freqs, t, dur, vol) {
    const c = G.Audio.ctx;
    const g = c.createGain();
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = 0.5;
    f.connect(g); g.connect(tr.gain);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.25);
    g.gain.setValueAtTime(vol, t + dur - 0.2);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    freqs.forEach((fr) => {
      [-6, 6].forEach((det) => {
        const o = c.createOscillator(); o.type = 'sawtooth';
        o.frequency.value = fr; o.detune.value = det;
        o.connect(f); o.start(t); o.stop(t + dur + 0.05);
      });
    });
  }

  function schedule(tr, step, t) {
    const A = G.Audio, d = tr.def, song = tr.song, bus = tr.gain;
    const barIdx = Math.floor(step / 16), s = step % 16;
    const deg = song.chords[barIdx];
    const sc = song.scale;
    const root = 48 + d.key; // C3 + key
    const chordMidi = [0, 2, 4].map((k) => root + semi(sc, deg + k));
    const sd = tr.stepDur;

    // Drums
    const dr = DRUMS[d.drums] || DRUMS.none;
    if (dr.k[s] === 'x') A.tone({ at: t, type: 'sine', f0: 150, f1: 42, sweep: 0.12, dur: 0.16, vol: 0.55, bus });
    if (dr.s[s] === 'x') {
      A.noise({ at: t, f0: 1900, filter: 'bandpass', q: 0.8, dur: 0.13, vol: 0.22, bus });
      A.tone({ at: t, type: 'triangle', f0: 210, f1: 140, dur: 0.07, vol: 0.12, bus });
    }
    if (dr.h[s] === 'x') A.noise({ at: t, f0: 7500, filter: 'highpass', dur: 0.03, vol: 0.06, bus });
    if (dr.h[s] === 'o') A.noise({ at: t, f0: 7000, filter: 'highpass', dur: 0.14, vol: 0.06, bus });

    // Bass
    const bRoot = chordMidi[0] - 12;
    let bn = null;
    if (d.bass === 'drive' && s % 2 === 0) bn = s % 8 === 6 ? bRoot + 12 : bRoot;
    else if (d.bass === 'bounce' && (s === 0 || s === 6 || s === 8 || s === 14)) bn = s === 8 ? bRoot + 7 : s === 14 ? bRoot + 12 : bRoot;
    else if (d.bass === 'pulse' && (s === 0 || s === 8 || s === 11)) bn = s === 11 ? bRoot + 7 : bRoot;
    if (bn !== null) A.tone({ at: t, type: 'triangle', f0: midiHz(bn), dur: sd * (d.bass === 'pulse' ? 4 : 1.8), vol: 0.32, bus });

    // Pad
    if (s === 0 && d.pad) pad(tr, chordMidi.map((m) => midiHz(m + 12)), t, sd * 16, d.pad);

    // Arpeggio
    if (d.arp && s % 2 === 1) {
      const n = chordMidi[(Math.floor(s / 2)) % 3] + 24;
      A.tone({ at: t, type: 'sine', f0: midiHz(n), dur: sd * 1.5, vol: 0.045, bus });
    }

    // Lead melody
    const bar = song.melody[barIdx];
    for (const n of bar) {
      if (n.st !== s) continue;
      const m = root + 12 + semi(sc, n.p);
      const dur = sd * n.len * 0.95;
      const vol = d.lead === 'sawtooth' ? 0.07 : d.lead === 'square' ? 0.075 : 0.14;
      A.tone({ at: t, type: d.lead, f0: midiHz(m), dur, vol, bus, lp: 3200, a: 0.01 });
      if (d.echo) A.tone({ at: t + sd * 3, type: d.lead, f0: midiHz(m), dur, vol: vol * 0.35, bus, lp: 2000 });
    }
  }
})(window.G);

<script>
// Persistent progress: three save slots + global options in localStorage.
// All storage access is wrapped so private-mode / blocked storage never
// crashes the game (progress simply won't persist).
(function (G) {
  'use strict';
  const SLOT_KEY = 'ember_prism_slots_v1';
  const OPT_KEY = 'ember_prism_options_v1';
  const SLOT_COUNT = 3;

  const S = (G.Save = {
    slots: [],
    slot: -1, // active slot index
    data: null, // active slot data
    options: { music: 0.6, sfx: 0.8, shake: true, touch: 'auto', timer: false, assist: false },
    storageOk: true,
  });

  function read(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { S.storageOk = false; return null; }
  }
  function write(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { S.storageOk = false; return false; }
  }

  S.fresh = function () {
    return {
      version: 1,
      created: Date.now(),
      updated: Date.now(),
      playTime: 0,
      gems: 0, // wallet
      gemsTotal: 0, // lifetime
      deaths: 0,
      levels: {}, // id -> { done, shards:[b,b,b], bestGems, bestTime }
      unlocked: ['1-1'],
      upgrades: { heart: 0, power: 0, magnet: 0, dash: false },
      story: {},
      node: '1-1',
      complete: false,
    };
  };

  S.load = function () {
    const raw = read(SLOT_KEY);
    S.slots = [];
    for (let i = 0; i < SLOT_COUNT; i++) S.slots.push(raw && raw[i] ? migrate(raw[i]) : null);
    const o = read(OPT_KEY);
    if (o) Object.assign(S.options, o);
  };
  function migrate(d) {
    const f = S.fresh();
    const out = Object.assign(f, d);
    out.upgrades = Object.assign(S.fresh().upgrades, d.upgrades || {});
    return out;
  }

  S.persist = function () {
    if (S.slot >= 0 && S.data) {
      S.data.updated = Date.now();
      S.slots[S.slot] = S.data;
    }
    write(SLOT_KEY, S.slots);
  };
  S.saveOptions = function () { write(OPT_KEY, S.options); };

  S.newGame = function (i) {
    S.slot = i;
    S.data = S.fresh();
    S.slots[i] = S.data;
    S.persist();
  };
  S.loadSlot = function (i) {
    if (!S.slots[i]) return false;
    S.slot = i;
    S.data = S.slots[i];
    return true;
  };
  S.deleteSlot = function (i) {
    S.slots[i] = null;
    if (S.slot === i) { S.slot = -1; S.data = null; }
    write(SLOT_KEY, S.slots);
  };
  S.hasAnySave = () => S.slots.some((s) => !!s);
  S.mostRecentSlot = function () {
    let best = -1, t = -1;
    S.slots.forEach((s, i) => { if (s && s.updated > t) { t = s.updated; best = i; } });
    return best;
  };

  // --- progress helpers ---------------------------------------------------
  S.levelRec = function (id) {
    const d = S.data;
    if (!d.levels[id]) d.levels[id] = { done: false, shards: [false, false, false], bestGems: 0, bestTime: null };
    return d.levels[id];
  };
  S.isUnlocked = (id) => !!S.data && S.data.unlocked.indexOf(id) >= 0;
  S.unlock = function (id) {
    if (id && S.data.unlocked.indexOf(id) < 0) { S.data.unlocked.push(id); return true; }
    return false;
  };
  S.shardCount = function (worldIdx) {
    let n = 0;
    const d = S.data;
    if (!d) return 0;
    for (const id in d.levels) {
      if (worldIdx != null && !id.startsWith(worldIdx + '-')) continue;
      n += d.levels[id].shards.filter(Boolean).length;
    }
    return n;
  };
  S.maxHp = function () { return 3 + (S.data ? S.data.upgrades.heart : 0); };
  S.slotSummary = function (s) {
    if (!s) return null;
    const done = Object.values(s.levels).filter((l) => l.done).length;
    let shards = 0;
    Object.values(s.levels).forEach((l) => (shards += l.shards.filter(Boolean).length));
    return { done, shards, gems: s.gems, time: s.playTime, complete: s.complete, updated: s.updated };
  };
})(window.G);

<script>
// Canvas sizing. The game uses a logical view that is always 540 units tall;
// its width adapts to the screen's aspect ratio (clamped between 4:3 and
// ~21:9) so phones in landscape and ultrawide monitors both fill nicely.
// The backing store is rendered at device-pixel resolution for crisp vectors.
(function (G) {
  'use strict';
  const U = G.U;
  const R = (G.R = {
    canvas: null, ctx: null,
    H: 540, W: 960,
    scale: 1, dpr: 1, ox: 0, oy: 0,
    rf: 1, // resolution factor for cached bitmaps (logical px -> device px)
    rfVersion: 0,
    shakeT: 0, shakeMag: 0, shakeX: 0, shakeY: 0,
  });

  R.init = function (canvas) {
    R.canvas = canvas;
    R.ctx = canvas.getContext('2d', { alpha: false });
    window.addEventListener('resize', R.resize);
    window.addEventListener('orientationchange', () => setTimeout(R.resize, 120));
    R.resize();
  };

  R.resize = function () {
    const cw = window.innerWidth, ch = window.innerHeight;
    R.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const aspect = cw / ch;
    R.W = Math.round(U.clamp(R.H * aspect, 720, 1260));
    R.scale = Math.min(cw / R.W, ch / R.H);
    R.canvas.style.width = cw + 'px';
    R.canvas.style.height = ch + 'px';
    R.canvas.width = Math.round(cw * R.dpr);
    R.canvas.height = Math.round(ch * R.dpr);
    R.ox = Math.round(((cw - R.W * R.scale) / 2) * R.dpr);
    R.oy = Math.round(((ch - R.H * R.scale) / 2) * R.dpr);
    const rf = U.clamp(Math.round(R.scale * R.dpr * 4) / 4, 1, 2);
    if (rf !== R.rf) { R.rf = rf; R.rfVersion++; }
    if (G.Input) G.Input.layoutTouch(R.W, R.H);
    if (G.Scenes && G.Scenes.current && G.Scenes.current.onResize) G.Scenes.current.onResize();
  };

  R.toLogical = function (clientX, clientY) {
    return {
      x: (clientX * R.dpr - R.ox) / (R.scale * R.dpr),
      y: (clientY * R.dpr - R.oy) / (R.scale * R.dpr),
    };
  };

  R.begin = function () {
    const ctx = R.ctx;

// Scene manager with a faceted "shard" wipe transition between scenes.
(function (G) {
  'use strict';
  const U = G.U;
  const S = (G.Scenes = {
    list: {}, current: null, currentName: null,
    trans: null, // { phase:'out'|'in', t, dur, target, params }
  });

  S.register = function (name, scene) { S.list[name] = scene; scene.name = name; };

  S.go = function (name, params, opts) {
    opts = opts || {};
    if (S.trans && S.trans.phase === 'out') return; // already switching
    if (opts.instant || !S.current) { swap(name, params); return; }
    S.trans = { phase: 'out', t: 0, dur: opts.dur || 0.32, target: name, params, color: opts.color || '#0b0d18' };
  };

  function swap(name, params) {
    if (S.current && S.current.exit) S.current.exit();
    S.current = S.list[name];
    S.currentName = name;
    if (!S.current) throw new Error('Unknown scene ' + name);
    G.Input.flush();
    if (S.current.enter) S.current.enter(params || {});
  }

  S.update = function (dt) {
    if (S.trans) {
      S.trans.t += dt;
      if (S.trans.t >= S.trans.dur) {
        if (S.trans.phase === 'out') {
          swap(S.trans.target, S.trans.params);
          S.trans.phase = 'in';
          S.trans.t = 0;
        } else S.trans = null;
      }
      if (S.trans && S.trans.phase === 'out') return; // freeze input while covering
    }
    if (S.current && S.current.update) S.current.update(dt);
  };

  S.render = function (ctx) {
    if (S.current && S.current.render) S.current.render(ctx);
    if (S.trans) drawWipe(ctx, S.trans);
  };

  // Diagonal band of triangles sweeping across the screen.
  function drawWipe(ctx, tr) {
    const W = G.R.W, H = G.R.H;
    let k = U.clamp(tr.t / tr.dur, 0, 1);
    k = U.ease.inOutSine(k);
    const cover = tr.phase === 'out' ? k : 1 - k;
    if (cover <= 0) return;
    const cols = 12, rows = 7;
    const cw = W / cols, rh = H / rows;
    ctx.save();
    for (let i = 0; i <= cols; i++) {
      for (let j = 0; j <= rows; j++) {
        const order = (i + j) / (cols + rows);
        let local = tr.phase === 'out' ? U.clamp(cover * 1.6 - order * 0.6, 0, 1) : U.clamp(cover * 1.6 - (1 - order) * 0.6, 0, 1);
        if (local <= 0) continue;
        const cx = i * cw, cy = j * rh;
        const sz = local * 1.05;
        ctx.fillStyle = (i + j) % 2 ? tr.color : U.shade(tr.color, 0.06);
        ctx.beginPath();
        ctx.moveTo(cx, cy - rh * sz);
        ctx.lineTo(cx + cw * sz, cy);
        ctx.lineTo(cx, cy + rh * sz);
        ctx.lineTo(cx - cw * sz, cy);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }

// Lightweight pooled particle system (faceted shards, sparkles, dust, text).
(function (G) {
  'use strict';
  const U = G.U;
  const MAX = 900;

  class Particles {
    constructor() {
      this.pool = [];
      for (let i = 0; i < MAX; i++) this.pool.push({ alive: false });
      this.idx = 0;
    }
    clear() { this.pool.forEach((p) => (p.alive = false)); }
    spawn(o) {
      // round-robin; overwrite oldest when full
      const p = this.pool[this.idx];
      this.idx = (this.idx + 1) % MAX;
      p.alive = true;
      p.x = o.x; p.y = o.y;
      p.vx = o.vx || 0; p.vy = o.vy || 0;
      p.g = o.g != null ? o.g : 0;
      p.drag = o.drag != null ? o.drag : 0;
      p.life = p.max = o.life || 0.6;
      p.size = o.size || 4; p.size1 = o.size1 != null ? o.size1 : 0;
      p.color = o.color || '#fff';
      p.shape = o.shape || 'tri';
      p.rot = o.rot != null ? o.rot : Math.random() * U.TAU;
      p.vr = o.vr != null ? o.vr : U.rand(-8, 8);
      p.text = o.text;
      p.glow = !!o.glow;
      p.front = !!o.front;
      p.alpha = o.alpha != null ? o.alpha : 1;
      return p;
    }
    burst(x, y, n, o) {
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + U.rand(-(o.spread || Math.PI), o.spread || Math.PI) : Math.random() * U.TAU;
        const sp = U.rand(o.speedMin != null ? o.speedMin : 60, o.speed || 240);
        this.spawn({
          x: x + U.rand(-(o.jitter || 0), o.jitter || 0), y: y + U.rand(-(o.jitter || 0), o.jitter || 0),
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
          g: o.g, drag: o.drag, life: U.rand((o.life || 0.6) * 0.6, o.life || 0.6),
          size: U.rand((o.size || 5) * 0.6, o.size || 5), size1: o.size1,
          color: Array.isArray(o.color) ? U.pick(o.color) : o.color, shape: o.shape, glow: o.glow, front: o.front,
        });
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.alive) continue;
        p.life -= dt;
        if (p.life <= 0) { p.alive = false; continue; }
        p.vy += p.g * dt;
        if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
      }
    }
    draw(ctx, front, view) {
      for (const p of this.pool) {
        if (!p.alive || p.front !== !!front) continue;
        if (view && (p.x < view.x - 60 || p.x > view.x + view.w + 60 || p.y < view.y - 60 || p.y > view.y + view.h + 60)) continue;
        const k = p.life / p.max;
        const s = U.lerp(p.size1, p.size, k);
        ctx.globalAlpha = Math.min(1, k * 2.5) * p.alpha;
        if (p.shape === 'text') {
          ctx.fillStyle = p.color;
          ctx.font = '700 ' + Math.round(p.size) + 'px Fredoka, sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
          ctx.strokeText(p.text, p.x, p.y);
          ctx.fillText(p.text, p.x, p.y);
          continue;
        }
        ctx.fillStyle = p.color;
        if (p.glow) ctx.globalCompositeOperation = 'lighter';
        if (p.shape === 'circle') {
          ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, U.TAU); ctx.fill();
        } else if (p.shape === 'spark') {
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.beginPath();
          ctx.moveTo(0, -s * 1.6); ctx.lineTo(s * 0.35, 0); ctx.lineTo(0, s * 1.6); ctx.lineTo(-s * 0.35, 0);
          ctx.moveTo(-s * 1.6, 0); ctx.lineTo(0, s * 0.35); ctx.lineTo(s * 1.6, 0); ctx.lineTo(0, -s * 0.35);
          ctx.fill(); ctx.restore();
        } else if (p.shape === 'ring') {
          ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1, 6 * k);
          ctx.beginPath(); ctx.arc(p.x, p.y, U.lerp(p.size, p.size1, k), 0, U.TAU); ctx.stroke();
        } else {
          // faceted triangle shard
          const c = Math.cos(p.rot), sn = Math.sin(p.rot);
          ctx.beginPath();
          ctx.moveTo(p.x + c * s, p.y + sn * s);
          ctx.lineTo(p.x + (-c * 0.5 - sn * 0.87) * s, p.y + (-sn * 0.5 + c * 0.87) * s);
          ctx.lineTo(p.x + (-c * 0.5 + sn * 0.87) * s, p.y + (-sn * 0.5 - c * 0.87) * s);
          ctx.closePath(); ctx.fill();
        }
        if (p.glow) ctx.globalCompositeOperation = 'source-over';
      }
      ctx.globalAlpha = 1;
    }

// UI toolkit: text, faceted panels, keyboard/mouse/touch menus and the

    if (o.shadow) {
      ctx.fillStyle = o.shadow;
      ctx.fillText(str, x, y + (o.shadowOff || 3));
    }
    if (o.stroke) {
      ctx.lineJoin = 'round';
      ctx.lineWidth = o.stroke;
      ctx.strokeStyle = o.strokeColor || '#1a0f1e';
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = o.color || '#fff';
    ctx.fillText(str, x, y);

  };

    ctx.font = (weight || 600) + ' ' + size + 'px ' + UI.FONT;
    return ctx.measureText(str).width;
  };

    ctx.font = (weight || 600) + ' ' + size + 'px ' + UI.FONT;

    str.split('\n').forEach((para) => {
      const words = para.split(' ');
      let line = '';
      words.forEach((w) => {
        const t = line ? line + ' ' + w : w;

      });

        } else {

<script>
// EMBER — the hero. Drawn procedurally every frame from a pose description so
// all animation (squash/stretch, run cycle, flips, punches) stays perfectly
// crisp at any resolution. Design follows the reference model: glossy red,
// big round head with subtle low-poly facets, two tall white oval eyes,
// raised brow bars, a wide open smile, stubby arms and tapered pointed legs.
//
// Local space: origin at the feet (bottom centre), +x = facing direction,

    light: '#ff4a3a',
    hi: '#ff7563',
    mid: '#cf1f18',
    dark: '#a8130f',
    deep: '#7c0b09',
    brow: '#c2160f',
    browHi: '#ff4a3a',
    mouth: '#5f0809',
    tongue: '#e0454b',
    eye: '#ffffff',
    eyeShade: '#dfe5f2',
    rim: '#ffd2c8',
  });

  // ---- precomputed low-poly head geometry (unit circle) ----------------

    const a = (i / OUT_N) * U.TAU - Math.PI / 2 + 0.11;

    const ii = Math.floor(((i + 0.5) / OUT_N) * IN_N) % IN_N;
    tris.push([o0, o1, inner[ii]]);
  }
  for (let j = 0; j < IN_N; j++) {
    const i0 = inner[j], i1 = inner[(j + 1) % IN_N];
    // stitch triangle between inner edge and the outer vertex between them

    tris.push([i0, i1, center]);

    tg.addColorStop(0.36, col(C.base)); tg.addColorStop(0.7, col(C.base));

<script>
// Faceted parallax backgrounds. Each layer is generated once into a
// horizontally tileable offscreen canvas and then scrolled cheaply.
(function (G) {
  'use strict';
  const U = G.U;
  const LW = 1280; // logical width of one tile of a layer
  const LH = 540;

  // Periodic 1D noise: sum of sines with integer frequencies over LW.
  function pnoise(rng) {
    const comps = [];
    for (let i = 0; i < 5; i++) comps.push({ f: 1 + Math.floor(rng() * (2 + i * 3)), p: rng() * U.TAU, a: 1 / (i + 1.2) });
    const norm = comps.reduce((s, c) => s + c.a, 0);
    return (x) => comps.reduce((s, c) => s + Math.sin((x / LW) * U.TAU * c.f + c.p) * c.a, 0) / norm;
  }

  function buildLayer(L, rf) {
    const cv = U.makeCanvas(LW * rf, LH * rf);
    const ctx = cv.getContext('2d');
    ctx.scale(rf, rf);
    const rng = U.rng(L.seed * 977 + 13);
    const n = pnoise(rng);
    const baseY = L.base * LH, amp = L.amp * LH;
    const [c0, c1] = L.colors;
    const fillBelow = (pts) => {
      ctx.beginPath();
      ctx.moveTo(0, LH);
      pts.forEach((p) => ctx.lineTo(p[0], p[1]));
      ctx.lineTo(LW, LH);
      ctx.closePath();
      ctx.fill();
    };

    if (L.kind === 'mountains' || L.kind === 'hills' || L.kind === 'rocks') {
      const step = L.kind === 'hills' ? 80 : L.kind === 'rocks' ? 48 : 96;
      const pts = [];
      for (let x = 0; x <= LW; x += step) {
        let y = baseY - (n(x) * 0.5 + 0.5) * amp;
        if (L.kind !== 'hills' && x % (step * 2) === step) y -= amp * 0.25 * rng(); // peaks
        if (x === LW) y = pts[0][1];
        pts.push([x, y]);
      }
      ctx.fillStyle = c0;
      fillBelow(pts);
      // facets: each ridge vertex drops a triangle to a valley point lower down
      for (let i = 0; i < pts.length - 1; i++) {
        const a = pts[i], b = pts[i + 1];
        const midX = (a[0] + b[0]) / 2, low = Math.max(a[1], b[1]) + (LH - Math.max(a[1], b[1])) * 0.35;
        const peak = a[1] < b[1] ? a : b;
        ctx.fillStyle = a[1] < b[1] ? U.shade(c1, -0.06) : c1; // slope facing light
        U.poly(ctx, [a[0], a[1], b[0], b[1], midX, low]);
        ctx.fill();
        ctx.fillStyle = U.shade(c0, -0.05 - rng() * 0.05);
        U.poly(ctx, [a[0], a[1], midX, low, a[0] - step * 0.3, LH]);
        ctx.fill();

          ctx.fillStyle = L.snow;
          const s = 0.28;
          const other = peak === a ? b : a;

          ctx.fill();
          ctx.fillStyle = U.shade(L.snow, -0.1);
          U.poly(ctx, [peak[0], peak[1], U.lerp(peak[0], midX, s * 0.8), U.lerp(peak[1], low, s * 0.5), peak[0] - step * 0.12, peak[1] + 22]);
          ctx.fill();

    } else if (L.kind === 'trees' || L.kind === 'pines') {
      // base strip
      const pts = [];
      for (let x = 0; x <= LW; x += 64) pts.push([x, baseY - (n(x) * 0.5 + 0.5) * amp * 0.5]);
      pts[pts.length - 1][1] = pts[0][1];
      ctx.fillStyle = c0;
      fillBelow(pts);
      const count = L.kind === 'pines' ? 34 : 22;
      for (let i = 0; i < count; i++) {
        const x = (i / count) * LW + rng() * 30;
        const gy = baseY - (n(x) * 0.5 + 0.5) * amp * 0.5 + 6;
        const h = (L.kind === 'pines' ? 90 : 70) + rng() * 60;
        const w = L.kind === 'pines' ? h * 0.36 : h * 0.55;
        for (const ox of [0, -LW, LW]) drawTree(ctx, x + ox, gy, w, h, L, rng);
      }
    } else if (L.kind === 'crystals') {
      ctx.fillStyle = c0;
      const pts = [];
      for (let x = 0; x <= LW; x += 80) pts.push([x, baseY + (n(x) * 0.5 + 0.5) * amp * 0.2]);
      pts[pts.length - 1][1] = pts[0][1];
      fillBelow(pts);
      const count = 16;
      for (let i = 0; i < count; i++) {
        const x = (i / count) * LW + rng() * 50;
        const h = amp * (0.5 + rng());
        const w = 18 + rng() * 26;
        const tilt = (rng() - 0.5) * 0.5;
        for (const ox of [0, -LW, LW]) drawCrystal(ctx, x + ox, baseY + 20, w, h, tilt, c0, c1, L.glow);
      }
    } else if (L.kind === 'stalag') {
      ctx.fillStyle = c0;
      // ceiling stalactites
      for (let i = 0; i < 26; i++) {
        const x = (i / 26) * LW + rng() * 20, w = 20 + rng() * 40, h = 40 + rng() * 140;
        for (const ox of [0, -LW, LW]) {
          ctx.fillStyle = c0;
          U.poly(ctx, [x + ox - w / 2, -2, x + ox + w / 2, -2, x + ox + w * 0.1, h]);
          ctx.fill();
          ctx.fillStyle = c1;
          U.poly(ctx, [x + ox - w / 2, -2, x + ox, -2, x + ox + w * 0.1, h]);
          ctx.fill();
        }
      }
      const pts = [];
      for (let x = 0; x <= LW; x += 40) pts.push([x, baseY - Math.abs(n(x)) * amp]);
      pts[pts.length - 1][1] = pts[0][1];
      ctx.fillStyle = c0;
      fillBelow(pts);

      ctx.fillStyle = col;
      U.poly(ctx, [x - 5, y + 2, x - 4, y - 12 - r * 8, x, y - 18 - r * 8, x, y + 2]); ctx.fill();
      ctx.fillStyle = U.shade(col, -0.1);

        ctx.lineTo(px, y + 10 + Math.sin(px * 0.06 + t * 3) * 3);

      ctx.fillStyle = U.rgba(liq.light, 0.9);
      ctx.beginPath();

        const px = x + (k / 6) * T;

        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }

        const px = x + (k / 6) * T;

      }

    const T = G.TILE;
    const st = L.crumbleT[ty * L.w + tx];
    if (st < 0) {

      if (st > -0.6) {
        ctx.globalAlpha = 0.3;
      } else return;
    }
    let x = tx * T, y = ty * T;
    if (st > 0) { x += (Math.random() - 0.5) * 3; y += (Math.random() - 0.5) * 2; }

    ctx.fillRect(x, y, T, T * 0.55);
    ctx.fillStyle = c;
    U.poly(ctx, [x + 1, y + 1, x + T - 1, y + 1, x + T - 5, y + 8, x + 5, y + 8]); ctx.fill();
    ctx.fillStyle = U.shade(c, -0.2);
    ctx.fillRect(x + 5, y + 8, T - 10, T * 0.55 - 12);
    ctx.strokeStyle = U.shade(c, -0.5);
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x + 14, y + 8); ctx.lineTo(x + 20, y + 18); ctx.lineTo(x + 18, y + 26);
    ctx.moveTo(x + 32, y + 8); ctx.lineTo(x + 28, y + 16);
    ctx.stroke();
    // little triangular teeth under the slab
    ctx.fillStyle = U.shade(c, -0.45);
    for (let k = 0; k < 4; k++) { U.poly(ctx, [x + k * 12, y + T * 0.55 - 1, x + k * 12 + 12, y + T * 0.55 - 1, x + k * 12 + 6, y + T * 0.55 + 6]); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
})(window.G);

<script>
// Tile constants and axis-separated AABB collision against the tile map and
// moving platforms. Shared by the player, enemies and the headless level
// validator (tools/validate-levels.js), so it must not touch the DOM.
(function (G) {
  'use strict';
  G.TILE = 48;
  G.T = { EMPTY: 0, SOLID: 1, ONEWAY: 2, SPIKE_UP: 3, SPIKE_DOWN: 4, CRUMBLE: 5, BREAK: 6, LIQUID: 7, STONE: 8 };
  const T = G.TILE;
  const P = (G.Phys = {});

  P.solid = function (L, tx, ty) {
    const t = L.get(tx, ty);
    return t === 1 || t === 8 || t === 6;
  };
  // Surfaces you can land on from above but pass through from below.
  P.oneway = function (L, tx, ty) {
    const t = L.get(tx, ty);
    if (t === 2) return true;
    if (t === 5) return L.crumbleT[ty * L.w + tx] >= 0;
    return false;
  };

  P.moveX = function (L, b, dx) {
    if (dx === 0) return 0;
    b.x += dx;
    const top = Math.floor(b.y / T), bot = Math.floor((b.y + b.h - 0.01) / T);
    if (dx > 0) {
      const tx = Math.floor((b.x + b.w - 0.01) / T);
      for (let ty = top; ty <= bot; ty++) if (P.solid(L, tx, ty)) { b.x = tx * T - b.w; return 1; }
    } else {
      const tx = Math.floor(b.x / T);
      for (let ty = top; ty <= bot; ty++) if (P.solid(L, tx, ty)) { b.x = (tx + 1) * T; return -1; }
    }
    return 0;
  };

  // Returns {hit: -1 ceiling | 1 floor | 0, platform, tx, ty}
  const res = { hit: 0, platform: null, tx: 0, ty: 0, oneway: false };
  P.moveY = function (L, b, dy, drop, platforms) {
    res.hit = 0; res.platform = null; res.oneway = false;
    if (dy === 0) return res;
    const prevBottom = b.y + b.h;
    b.y += dy;
    const left = Math.floor(b.x / T), right = Math.floor((b.x + b.w - 0.01) / T);
    if (dy > 0) {
      const ty = Math.floor((b.y + b.h - 0.01) / T);
      for (let tx = left; tx <= right; tx++)
        if (P.solid(L, tx, ty)) { b.y = ty * T - b.h; res.hit = 1; res.tx = tx; res.ty = ty; return res; }
      if (!drop) {
        for (let tx = left; tx <= right; tx++)
          if (P.oneway(L, tx, ty) && prevBottom <= ty * T + 0.5) {
            b.y = ty * T - b.h; res.hit = 1; res.oneway = true; res.tx = tx; res.ty = ty; return res;
          }
      }
      if (platforms && !drop) {
        for (const p of platforms) {
          if (b.x + b.w <= p.x + 2 || b.x >= p.x + p.w - 2) continue;
          if (prevBottom <= p.prevY + 1 && b.y + b.h >= p.y) {
            b.y = p.y - b.h; res.hit = 1; res.platform = p; return res;
          }
        }
      }
    } else {
      const ty = Math.floor(b.y / T);
      for (let tx = left; tx <= right; tx++)
        if (P.solid(L, tx, ty)) { b.y = (ty + 1) * T; res.hit = -1; res.tx = tx; res.ty = ty; return res; }
    }
    return res;
  };

  // Is there a solid wall directly beside the body? dir = -1 left, 1 right.
  P.wallAt = function (L, b, dir) {
    const tx = dir > 0 ? Math.floor((b.x + b.w + 1) / T) : Math.floor((b.x - 1) / T);
    // sample the upper-middle of the body so you can't cling by your toes
    const y0 = Math.floor((b.y + 6) / T), y1 = Math.floor((b.y + b.h - 14) / T);
    for (let ty = y0; ty <= y1; ty++) if (P.solid(L, tx, ty)) return true;
    return false;
  };

  P.solidRect = function (L, x, y, w, h) {
    const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.01) / T);
    const y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.01) / T);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (P.solid(L, tx, ty)) return true;
    return false;
  };

  // Hazard test: spikes (partial tile hitboxes) and liquids.
  P.hazard = function (L, b) {
    const x0 = Math.floor(b.x / T), x1 = Math.floor((b.x + b.w - 0.01) / T);
    const y0 = Math.floor(b.y / T), y1 = Math.floor((b.y + b.h - 0.01) / T);
    let out = null;
    for (let ty = y0; ty <= y1; ty++)
      for (let tx = x0; tx <= x1; tx++) {
        const t = L.get(tx, ty);
        if (t === 3) {
          if (b.y + b.h > ty * T + 22 && b.x + b.w > tx * T + 5 && b.x < tx * T + T - 5) out = out || 'spike';
        } else if (t === 4) {
          if (b.y < ty * T + T - 22 && b.x + b.w > tx * T + 5 && b.x < tx * T + T - 5) out = out || 'spike';
        } else if (t === 7) {
          const surf = L.get(tx, ty - 1) !== 7;
          if (!surf || b.y + b.h > ty * T + 26) return 'liquid';
        }
      }
    return out;

          if (stepPh !== this._lastStep) { this._lastStep = stepPh; this.emit('step'); }
        } else {
          const b = Math.sin(t * 2.6);
          p.bob = b * 0.9;
          p.sx *= 1 - b * 0.012; p.sy *= 1 + b * 0.012;
          p.armN = 0.5 + b * 0.06; p.armF = -0.45 - b * 0.06;
          p.legN = 0.08; p.legF = -0.1;
        }
      } else if (this.wallSliding) {
        p.armF = -2.5; p.armN = 0.9; p.legN = 0.45; p.legF = 0.15; p.lean = 0.1; p.mouth = 'grit'; p.brow = -0.6;
        p.headTilt = 0.1;
      } else if (this.spinT > 0) {
        const k = 1 - this.spinT / 0.34;
        p.spin = U.ease.outCubic(k) * U.TAU;
        p.legN = 1.0; p.legF = 0.7; p.armN = 1.8; p.armF = 1.3; p.mouth = 'open';
      } else if (this.vy < 0) {
        p.legN = 0.55; p.legF = -0.35; p.armN = 2.5; p.armF = -2.3; p.mouth = 'open'; p.brow = 0.6;
      } else {
        const f = U.clamp(this.vy / C.MAXFALL, 0, 1);
        const w = Math.sin(t * 22) * 0.25 * f;
        p.legN = 0.25 + w; p.legF = -0.2 - w; p.armN = 1.9 + f * 0.7 + w; p.armF = -1.7 - f * 0.7 - w;
        p.mouth = f > 0.75 ? 'o' : 'smile';
      }

      // punch overlay
      if (this.punchT > 0) {
        const el = C.PUNCH_T - this.punchT;
        const ext = el < 0.05 ? el / 0.05 : U.clamp(1 - (el - 0.12) / 0.1, 0, 1);
        if (this.punchArm === 0) { p.armN = U.lerp(p.armN, 1.57, ext); p.reachN = 1 + 0.65 * ext; }
        else { p.armF = U.lerp(p.armF, 1.5, ext); p.reachF = 1 + 0.75 * ext; p.armN = -0.6; }
        p.lean = Math.max(p.lean, 0.18 * ext);
        p.brow = -1; p.mouth = 'grit';
      }
    }

    draw(ctx) {
      if (this.invuln > 0 && !this.dead && Math.floor(this.invuln * 14) % 2 === 0) ctx.globalAlpha = 0.45;
      this.pose.flash = this.hurtT > 0.22 ? 1 : 0;
      G.Hero.draw(ctx, this.cx, this.y + this.h + 1, this.facing, this.pose, 0.86);
      ctx.globalAlpha = 1;
    }
  }
  Player.C = C;
  const BASE_POSE = { sx: 1, sy: 1, lean: 0, bob: 0, legN: 0.08, legF: -0.1, armN: 0.5, armF: -0.45, reachN: 1, reachF: 1, headTilt: 0, blink: 0, mouth: 'smile', brow: 0, spin: 0, flash: 0, eyesX: 0, squint: false };
  const NO_INPUT = { left: false, right: false, up: false, down: false, jump: false, jumpPressed: false, attackPressed: false, dashPressed: false, downPressed: false };
  G.Player = Player;
})(window.G);

</script>
<script>
// World objects. Each spawn character in a level maps to a factory in
// G.EntityTypes; enemies register themselves via G.Enemies.register.
//
// Entities talk to the gameplay scene (`play`) through a small API:
// play.player, play.level, play.parts, play.sfx(), play.spawn(),
// play.addGems(), play.collectShard(), play.heal(), play.setCheckpoint(),
// play.complete(), play.shake(), play.hitstop(), play.popText().
(function (G) {
  'use strict';
  const U = G.U;
  const TS = () => G.TILE;

  class Entity {
    constructor(x, y, w, h) {
      this.x = x; this.y = y; this.w = w; this.h = h;
      this.dead = false;
      this.t = Math.random() * 10;
      this.layer = 0; // 0 behind player, 1 in front
    }
    get cx() { return this.x + this.w / 2; }
    get cy() { return this.y + this.h / 2; }
    update(dt, play) { this.t += dt; }
    draw(ctx, play) {}
    // Entities whose box is far outside the view may skip work.
    near(play, margin) {
      const v = play.view;
      return this.x + this.w > v.x - margin && this.x < v.x + v.w + margin && this.y + this.h > v.y - margin && this.y < v.y + v.h + margin;
    }
  }
  G.Entity = Entity;

  // ---- Gem -------------------------------------------------------------
  class Gem extends Entity {
    constructor(x, y, loose) {
      super(x - 10, y - 12, 20, 24);
      this.baseY = this.y;
      this.loose = !!loose;
      this.vx = 0; this.vy = 0;
      this.age = 0;
      this.life = loose ? 9 : Infinity;
      this.color = '#3fe0ff';
    }
    update(dt, play) {
      this.t += dt; this.age += dt;
      const p = play.player;
      if (this.loose) {
        this.life -= dt;
        if (this.life <= 0) { this.dead = true; return; }
        this.vy = Math.min(700, this.vy + 1600 * dt);
        const hx = G.Phys.moveX(play.level, this, this.vx * dt);
        if (hx) this.vx = -this.vx * 0.5;
        const r = G.Phys.moveY(play.level, this, this.vy * dt, false, null);
        if (r.hit === 1) { this.vy = this.vy > 150 ? -this.vy * 0.45 : 0; this.vx *= 0.8; }
        else if (r.hit === -1) this.vy = 0;
      }
      if (p.dead || this.age < (this.loose ? 0.3 : 0)) return;
      const magnet = play.magnetRange;
      const dx = p.cx - this.cx, dy = p.cy - this.cy;
      const d = Math.hypot(dx, dy);
      if (magnet && d < magnet) {
        const sp = 520 * (1 - d / magnet) + 160;
        this.x += (dx / d) * sp * dt; this.y += (dy / d) * sp * dt;
        this.baseY = this.y;
      }
      if (U.overlap(this, p)) {
        this.dead = true;
        play.addGems(1, this.cx, this.cy);
      }
    }
    draw(ctx) {
      if (this.loose && this.life < 2 && Math.floor(this.life * 10) % 2 === 0) return;
      const bob = this.loose ? 0 : Math.sin(this.t * 3) * 3;
      G.Icons.gem(ctx, this.cx, this.cy + bob, 1, this.t * 2.4, this.color);
    }
  }
  G.Gem = Gem;

  // ---- Prism shard -------------------------------------------------------
  class Shard extends Entity {
    constructor(sp, idx) {
      super(sp.x + 6, sp.y + 2, 36, 44);
      this.idx = idx;
    }
    update(dt, play) {
      this.t += dt;
      this.ghost = play.shardOwned(this.idx);
      if (!play.player.dead && U.overlap(this, play.player)) {
        this.dead = true;
        play.collectShard(this.idx, this.cx, this.cy);
      }
      if (!this.ghost && Math.random() < dt * 8) {
        play.parts.spawn({ x: this.cx + U.rand(-16, 16), y: this.cy + U.rand(-20, 20), vy: -30, life: 0.7, size: 3, shape: 'spark', color: U.pick(G.Icons.PRISM), glow: true });
      }
    }
    draw(ctx) {
      G.Icons.shard(ctx, this.cx, this.cy + Math.sin(this.t * 2.2) * 4, 1.05, this.t, this.ghost);
    }
  }

  // ---- Heart -----------------------------------------------------------
  class Heart extends Entity {
    constructor(sp) { super(sp.x + 10, sp.y + 10, 28, 26); }
    update(dt, play) {
      this.t += dt;
      if (!play.player.dead && U.overlap(this, play.player)) { this.dead = true; play.heal(1, this.cx, this.cy); }
    }
    draw(ctx) {
      const s = 1 + Math.sin(this.t * 5) * 0.08;
      G.Icons.heart(ctx, this.cx, this.cy + Math.sin(this.t * 2.5) * 3, s, true);
    }
  }

  // ---- Checkpoint ------------------------------------------------------
  class Checkpoint extends Entity {
    constructor(sp) {
      super(sp.x + 8, sp.y - TS() * 1, 32, TS() * 2);
      this.on = false;
      this.raise = 0;
    }
    update(dt, play) {
      this.t += dt;
      if (this.on) this.raise = Math.min(1, this.raise + dt * 2.5);
      if (!this.on && !play.player.dead && U.overlap(this, play.player)) {
        this.on = true;
        play.setCheckpoint(this);
      }
    }
    draw(ctx) {
      const x = this.cx, by = this.y + this.h;
      // base
      ctx.fillStyle = '#4b4f6b';
      U.poly(ctx, [x - 14, by, x - 10, by - 8, x + 10, by - 8, x + 14, by]);
      ctx.fill();
      ctx.fillStyle = '#6c7192';
      U.poly(ctx, [x - 14, by, x - 10, by - 8, x, by - 8, x, by]);
      ctx.fill();
      // pole
      ctx.fillStyle = '#c9cde0';
      ctx.fillRect(x - 2.5, by - 88, 5, 82);
      ctx.fillStyle = '#9095b0';
      ctx.fillRect(x, by - 88, 2.5, 82);
      // flag
      const fy = by - 30 - this.raise * 52;
      const wave = Math.sin(this.t * 6);
      if (this.on) {
        for (let i = 0; i < 3; i++) {
          ctx.fillStyle = G.Icons.PRISM[(i * 2 + Math.floor(this.t * 2)) % 6];
          U.poly(ctx, [x + 2, fy + i * 7, x + 30 + wave * 3, fy + 5 + i * 7 + wave * 2, x + 2, fy + 7 + i * 7]);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = '#7a7d90';
        U.poly(ctx, [x + 2, fy, x + 26 + wave * 2, fy + 10, x + 2, fy + 20]);
        ctx.fill();
      }
      // crystal cap
      const glow = this.on ? 0.6 + Math.sin(this.t * 4) * 0.2 : 0;
      if (glow) {
        const g = ctx.createRadialGradient(x, by - 96, 2, x, by - 96, 30);
        g.addColorStop(0, 'rgba(255,255,255,' + glow + ')');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, by - 96, 30, 0, U.TAU); ctx.fill();
      }
      ctx.fillStyle = this.on ? '#ffffff' : '#a5a9bf';
      U.poly(ctx, [x, by - 108, x + 7, by - 96, x, by - 86, x - 7, by - 96]);
      ctx.fill();
      ctx.fillStyle = this.on ? G.Icons.PRISM[Math.floor(this.t * 3) % 6] : '#7d8199';
      U.poly(ctx, [x, by - 108, x + 7, by - 96, x, by - 96]);
      ctx.fill();
    }
  }

  // ---- Spring ----------------------------------------------------------
  class Spring extends Entity {
    constructor(sp) { super(sp.x + 6, sp.y + TS() - 22, 36, 22); this.squish = 0; }
    update(dt, play) {
      this.t += dt;
      this.squish = Math.max(0, this.squish - dt * 4);
      const p = play.player;
      if (!p.dead && p.vy >= 0 && U.overlap(this, p) && (p.bottom - p.vy * dt <= this.y + 10 || p.onGround)) {
        p.y = this.y - p.h;
        p.bounce(G.Player.C.SPRING, false);
        p.spinT = 0.34;
        this.squish = 1;
        play.sfx('spring');
        play.parts.burst(this.cx, this.y, 8, { color: ['#ffe14a', '#fff'], speed: 200, angle: -Math.PI / 2, spread: 1, life: 0.4, size: 4 });
      }
    }
    draw(ctx) {
      const x = this.x, by = this.y + this.h;
      const top = by - 22 + this.squish * 10;
      ctx.fillStyle = '#5d6178';
      ctx.fillRect(x + 2, by - 6, this.w - 4, 6);
      ctx.strokeStyle = '#c9cde0';
      ctx.lineWidth = 3;
      ctx.beginPath();
      const segs = 3;
      for (let i = 0; i <= segs * 2; i++) {
        const yy = by - 6 - ((by - 6 - top - 6) * i) / (segs * 2);
        ctx.lineTo(this.cx + (i % 2 ? 9 : -9), yy);
      }
      ctx.stroke();
      ctx.fillStyle = '#ff3b4f';
      U.poly(ctx, [x, top + 6, x + 4, top, x + this.w - 4, top, x + this.w, top + 6]);
      ctx.fill();
      ctx.fillStyle = '#ff8a95';
      U.poly(ctx, [x + 4, top, x + this.w / 2, top, x + this.w / 2 - 4, top + 3, x + 2, top + 4]);
      ctx.fill();
    }
  }

  // ---- Moving platform -------------------------------------------------
  class Platform extends Entity {
    constructor(sp) {
      super(sp.x, sp.y + (sp.axis === 'y' ? 0 : 0), TS() * 2, 18);
      this.x0 = this.x; this.y0 = this.y;
      this.axis = sp.axis; this.travel = sp.travel;
      this.phase = 0;
      this.period = (this.travel * 2) / 140 + 0.6;
      this.prevX = this.x; this.prevY = this.y; this.dx = 0; this.dy = 0; this.vy = 0;
      this.isPlatform = true;
    }
    update(dt, play) {
      this.t += dt;
      this.phase += dt / this.period;
      const k = 0.5 - 0.5 * Math.cos(this.phase * U.TAU);
      this.prevX = this.x; this.prevY = this.y;
      if (this.axis === 'x') this.x = this.x0 + this.travel * k;
      else this.y = this.y0 + this.travel * k;
      this.dx = this.x - this.prevX; this.dy = this.y - this.prevY;
      this.vy = this.dy / dt;
    }
    draw(ctx, play) {
      const c = play.theme.platform;
      const x = this.x, y = this.y, w = this.w;
      ctx.fillStyle = U.shade(c, -0.4);
      U.poly(ctx, [x, y + 8, x + w, y + 8, x + w - 10, y + 22, x + 10, y + 22]);
      ctx.fill();
      ctx.fillStyle = c;
      ctx.fillRect(x, y, w, 9);
      ctx.fillStyle = U.shade(c, 0.3);
      U.poly(ctx, [x, y, x + w * 0.6, y, x + w * 0.5, y + 4, x, y + 4]);
      ctx.fill();
      // glowing gem core
      const gc = G.Icons.PRISM[Math.floor(this.t * 2) % 6];
      ctx.fillStyle = gc;
      U.poly(ctx, [x + w / 2, y + 10, x + w / 2 + 7, y + 15, x + w / 2, y + 21, x + w / 2 - 7, y + 15]);
      ctx.fill();
    }
  }

  // ---- Goal: Prism Gate ------------------------------------------------
  class Goal extends Entity {
    constructor(sp, locked) {
      super(sp.x - 12, sp.y - TS() * 2, 72, TS() * 3);
      this.locked = !!locked;
      this.appear = locked ? 0 : 1;
    }
    unlock() { this.locked = false; }
    update(dt, play) {
      this.t += dt;
      if (!this.locked) this.appear = Math.min(1, this.appear + dt * 1.5);
      const p = play.player;
      if (!this.locked && this.appear > 0.8 && !p.dead && U.overlap({ x: this.x + 16, y: this.y + 20, w: this.w - 32, h: this.h - 20 }, p)) play.complete();
      if (!this.locked && Math.random() < dt * 10) {
        play.parts.spawn({ x: this.cx + U.rand(-20, 20), y: this.y + this.h - 10, vy: U.rand(-90, -40), vx: U.rand(-10, 10), life: 1.2, size: 3, shape: 'spark', color: U.pick(G.Icons.PRISM), glow: true });
      }
    }
    draw(ctx) {
      const x = this.cx, by = this.y + this.h;
      const a = this.appear;
      if (a <= 0) {
        // faint outline when locked
        ctx.globalAlpha = 0.25;
      }
      // pillars
      const pc = '#e9ecff', pd = '#a9aecb';
      [-1, 1].forEach((s) => {
        ctx.fillStyle = pd;
        U.poly(ctx, [x + s * 34, by, x + s * 26, by, x + s * 24, by - 118, x + s * 36, by - 112]);
        ctx.fill();
        ctx.fillStyle = pc;
        U.poly(ctx, [x + s * 30, by, x + s * 26, by, x + s * 24, by - 118, x + s * 30, by - 115]);
        ctx.fill();
      });
      // arch crystal
      ctx.fillStyle = pc;
      U.poly(ctx, [x - 38, by - 112, x, by - 146, x + 38, by - 112, x + 24, by - 118, x, by - 132, x - 24, by - 118]);
      ctx.fill();
      ctx.fillStyle = G.Icons.PRISM[Math.floor(this.t * 2) % 6];
      U.poly(ctx, [x, by - 158, x + 9, by - 144, x, by - 130, x - 9, by - 144]);
      ctx.fill();
      // swirling portal
      if (a > 0) {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.ellipse(x, by - 58, 22 * a, 56 * a, 0, 0, U.TAU);
        ctx.clip();
        for (let i = 0; i < 6; i++) {
          const ang = this.t * 1.8 + (i / 6) * U.TAU;
          ctx.fillStyle = G.Icons.PRISM[i];
          U.poly(ctx, [x, by - 58, x + Math.cos(ang) * 80, by - 58 + Math.sin(ang) * 80, x + Math.cos(ang + 1.05) * 80, by - 58 + Math.sin(ang + 1.05) * 80]);
          ctx.fill();
        }
        const g = ctx.createRadialGradient(x, by - 58, 2, x, by - 58, 40);
        g.addColorStop(0, 'rgba(255,255,255,0.95)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - 40, by - 120, 80, 120);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
  }

  // ---- Lumi hint ("?") --------------------------------------------------
  class Hint extends Entity {
    constructor(sp) {
      super(sp.x, sp.y, TS(), TS());
      this.text = sp.text;
      this.show = 0;
      this.layer = 1;
    }
    update(dt, play) {
      this.t += dt;
      const p = play.player;
      const near = Math.abs(p.cx - this.cx) < 90 && Math.abs(p.cy - this.cy) < 110;
      this.show = U.clamp(this.show + (near ? dt * 6 : -dt * 6), 0, 1);
    }
    draw(ctx, play) {
      G.Icons.lumi(ctx, this.cx, this.cy - 4, 0.75, this.t);
      if (this.show <= 0) return;
      const lines = G.UI.wrap(ctx, this.text, 300, 16, 600);
      const bw = Math.min(330, Math.max(...lines.map((l) => G.UI.measure(ctx, l, 16, 600))) + 28);
      const bh = lines.length * 21 + 18;
      let bx = this.cx - bw / 2;
      bx = U.clamp(bx, play.view.x + 8, play.view.x + play.view.w - bw - 8);
      const by = this.y - bh - 18 - (1 - this.show) * 10;
      ctx.globalAlpha = this.show;
      G.UI.panel(ctx, bx, by, bw, bh, { color: '#20244a', alpha: 0.93, r: 12 });
      ctx.fillStyle = 'rgba(32,36,74,0.93)';
      U.poly(ctx, [this.cx - 8, by + bh - 1, this.cx + 8, by + bh - 1, this.cx, by + bh + 9]);
      ctx.fill();
      lines.forEach((l, i) => G.UI.text(ctx, l, bx + 14, by + 19 + i * 21, { size: 16, color: '#f3f1ff', weight: 600 }));
      ctx.globalAlpha = 1;
    }
  }

  // ---- Projectile ------------------------------------------------------
  class Projectile extends Entity {
    constructor(x, y, vx, vy, o) {
      o = o || {};
      const r = o.r || 9;
      super(x - r, y - r, r * 2, r * 2);
      this.r = r;
      this.vx = vx; this.vy = vy;
      this.g = o.g || 0;
      this.life = o.life || 5;
      this.color = o.color || '#b9b6c9';
      this.reflectable = o.reflectable !== false;
      this.friendly = false;
      this.dmg = o.dmg || 1;
      this.homing = o.homing || 0;
      this.ignoreTiles = !!o.ignoreTiles;
      this.layer = 1;
      this.isProjectile = true;
      this.kind = o.kind || 'orb';
    }
    update(dt, play) {
      this.t += dt;
      this.life -= dt;
      if (this.life <= 0) { this.pop(play); return; }
      if (this.homing && !this.friendly) {
        const p = play.player;
        const a = Math.atan2(p.cy - this.cy, p.cx - this.cx);
        const sp = Math.hypot(this.vx, this.vy);
        const cur = Math.atan2(this.vy, this.vx);
        let d = a - cur;
        while (d > Math.PI) d -= U.TAU;
        while (d < -Math.PI) d += U.TAU;
        const n = cur + U.clamp(d, -this.homing * dt, this.homing * dt);
        this.vx = Math.cos(n) * sp; this.vy = Math.sin(n) * sp;
      }
      this.vy += this.g * dt;
      this.x += this.vx * dt; this.y += this.vy * dt;
      if (!this.ignoreTiles && G.Phys.solidRect(play.level, this.x + 3, this.y + 3, this.w - 6, this.h - 6)) { this.pop(play); return; }
      if (this.y > play.level.ph + 100) this.dead = true;
      if (Math.random() < dt * 30) play.parts.spawn({ x: this.cx, y: this.cy, life: 0.3, size: this.r * 0.5, color: this.friendly ? '#ffd36a' : this.color, shape: 'circle', alpha: 0.6 });
    }
    reflect(play, dir) {
      this.friendly = true;
      this.homing = 0;
      const sp = Math.max(420, Math.hypot(this.vx, this.vy) * 1.4);
      // aim at the nearest enemy/boss in the direction punched, else straight
      let target = null, best = 1e9;
      for (const e of play.entities) {
        if (!(e.isEnemy || e.isBoss) || e.dead) continue;
        if (U.sign(e.cx - this.cx) !== dir) continue;
        const d = U.dist(e.cx, e.cy, this.cx, this.cy);
        if (d < best && d < 900) { best = d; target = e; }
      }
      if (target) {
        const a = Math.atan2(target.cy - this.cy, target.cx - this.cx);
        this.vx = Math.cos(a) * sp; this.vy = Math.sin(a) * sp;
      } else { this.vx = dir * sp; this.vy = -60; }
      this.g = 0;
      this.life = 3;
      play.sfx('punch');
      play.parts.burst(this.cx, this.cy, 10, { color: ['#ffd36a', '#fff'], speed: 260, life: 0.35, size: 4, shape: 'spark', glow: true });
    }
    pop(play) {
      this.dead = true;
      play.parts.burst(this.cx, this.cy, 8, { color: [this.color, '#fff'], speed: 160, life: 0.35, size: 4 });
    }
    draw(ctx) {
      const c = this.friendly ? '#ffd36a' : this.color;
      ctx.save();
      ctx.translate(this.cx, this.cy);
      ctx.rotate(this.t * 6);
      const r = this.r;
      ctx.fillStyle = U.shade(c, -0.3);
      U.poly(ctx, [0, -r, r, 0, 0, r, -r, 0]);
      ctx.fill();
      ctx.fillStyle = c;
      U.poly(ctx, [0, -r, r, 0, 0, 0]);
      ctx.fill();
      U.poly(ctx, [0, r, -r, 0, 0, 0]);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      U.poly(ctx, [0, -r * 0.6, r * 0.35, -r * 0.1, 0, -r * 0.1]);
      ctx.fill();
      ctx.restore();
    }
  }
  G.Projectile = Projectile;

  // ---- Ground shockwave (boss attack) --------------------------------------
  class Shockwave extends Entity {

  // ---- spawn table -----------------------------------------------------
  G.EntityTypes = {
    o: (sp) => new Gem(sp.x + TS() / 2, sp.y + TS() / 2),
    '1': (sp) => new Shard(sp, 0),
    '2': (sp) => new Shard(sp, 1),
    '3': (sp) => new Shard(sp, 2),
    H: (sp) => new Heart(sp),
    C: (sp) => new Checkpoint(sp),
    J: (sp) => new Spring(sp),
    M: (sp) => new Platform(sp),
    N: (sp) => new Platform(sp),
    G: (sp, level) => new Goal(sp, !!level.def.boss),

})(window.G);
