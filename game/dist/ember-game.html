<script>
// Enemies: the "Glooms", colourless creatures created by King Monochrome.
// Defeating one bursts it back into colour. New enemy types plug in with
// G.Enemies.register(char, Class) and can then be placed in any level map.
(function (G) {
  'use strict';
  const U = G.U;
  const Phys = G.Phys;
  const TS = () => G.TILE;

  const E = (G.Enemies = { types: {} });
  E.register = function (ch, cls) { E.types[ch] = cls; G.EntityTypes[ch] = (sp, level) => new cls(sp, level); };

  class Enemy extends G.Entity {
    constructor(sp, w, h, hp) {
      super(sp.x + (TS() - w) / 2, sp.y + TS() - h, w, h);
      this.isEnemy = true;
      this.hp = this.maxHp = hp || 1;
      this.vx = 0; this.vy = 0;
      this.facing = -1;
      this.onGround = false;
      this.gravity = true;
      this.stompable = true;
      this.contactDamage = 1;
      this.flashT = 0;
      this.stunT = 0;
      this.lastHitId = -1;
      this.gems = 1;
      this.asleep = true; // only simulate once near the camera
      this.tint = '#8d8aa3';
      this.accent = '#ff5d73';
    }
    physics(dt, play) {
      if (this.gravity) this.vy = Math.min(900, this.vy + 2300 * dt);
      this.hitX = Phys.moveX(play.level, this, this.vx * dt);
      const r = Phys.moveY(play.level, this, this.vy * dt, false, play.platforms);
      this.onGround = r.hit === 1;
      if (r.hit) this.vy = 0;
      if (this.y > play.level.ph + 200) this.dead = true;
    }
    ledgeAhead(play, dir) {
      const fx = dir > 0 ? this.x + this.w + 2 : this.x - 2;
      const L = play.level;
      const tx = Math.floor(fx / TS()), ty = Math.floor((this.y + this.h + 4) / TS());
      return !(Phys.solid(L, tx, ty) || Phys.oneway(L, tx, ty)) || Phys.hazard(L, { x: fx - 1, y: this.y + this.h - 6, w: 2, h: 10 });
    }
    update(dt, play) {
      this.t += dt;
      if (this.asleep) {
        if (!this.near(play, 220)) return;
        this.asleep = false;
        this.tint = play.theme.enemyTint || this.tint;
      }
      if (!this.near(play, 900)) return; // freeze far-away enemies
      this.flashT = Math.max(0, this.flashT - dt);
      this.stunT = Math.max(0, this.stunT - dt);
      this.behave(dt, play);
      this.physics(dt, play);
      if (Phys.hazard(play.level, this) === 'liquid') this.die(play, true);
    }
    behave(dt, play) {}
    // returns true if the hit landed
    hit(dmg, kind, fromX, play) {
      if (this.dead) return false;
      this.hp -= dmg;
      this.flashT = 0.14;
      const dir = U.sign(this.cx - fromX) || 1;
      if (kind !== 'stomp') { this.vx = dir * 260; this.vy = Math.min(this.vy, -260); }
      this.onHit(kind, play);
      if (this.hp <= 0) this.die(play);
      else play.sfx('hit');
      return true;
    }
    onHit(kind, play) {}
    die(play, silent) {
      if (this.dead) return;
      this.dead = true;
      play.onEnemyDefeated(this, silent);
    }
    // shared faceted blob body used by several Glooms
    drawBlob(ctx, x, by, w, h, squash, o) {
      o = o || {};
      const f = this.flashT > 0;
      const base = f ? '#ffffff' : o.color || this.tint;
      const hw = (w / 2) * (1 + squash * 0.15), hh = h * (1 - squash * 0.15);
      const pts = [];
      const n = 9;
      for (let i = 0; i <= n; i++) {
        const a = Math.PI + (i / n) * Math.PI;
        pts.push([x + Math.cos(a) * hw, by - 4 + Math.sin(a) * hh]);
      }
      ctx.fillStyle = f ? base : U.shade(base, -0.28);
      ctx.beginPath();
      ctx.moveTo(x - hw, by);
      pts.forEach((p) => ctx.lineTo(p[0], p[1]));
      ctx.lineTo(x + hw, by);
      ctx.closePath();
      ctx.fill();
      if (!f) {
        // facets: lit on the upper-left
        for (let i = 0; i < n; i++) {
          const a = pts[i], b = pts[i + 1];
          const lit = i < n * 0.45;
          ctx.fillStyle = lit ? U.shade(base, 0.08 + (i % 2) * 0.06) : U.shade(base, -0.08 - (i % 2) * 0.06);
          U.poly(ctx, [x - hw * 0.15, by - hh * 0.45, a[0], a[1], b[0], b[1]]);
          ctx.fill();
        }
      }
    }
    drawFace(ctx, x, y, s, facing, mood) {
      if (this.flashT > 0) return;
      const ex = x + facing * 5 * s;
      // eyes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(ex - 5 * s, y, 3.2 * s, 4.4 * s, 0, 0, U.TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(ex + 5 * s, y, 3.2 * s, 4.4 * s, 0, 0, U.TAU); ctx.fill();
      ctx.fillStyle = '#1b1726';
      ctx.beginPath(); ctx.arc(ex - 5 * s + facing * 1.2 * s, y + 1 * s, 1.7 * s, 0, U.TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + 5 * s + facing * 1.2 * s, y + 1 * s, 1.7 * s, 0, U.TAU); ctx.fill();
      // angry brows
      ctx.strokeStyle = '#2a2433';
      ctx.lineWidth = 2.4 * s;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ex - 9 * s, y - 6 * s); ctx.lineTo(ex - 2 * s, y - 4 * s);
      ctx.moveTo(ex + 9 * s, y - 6 * s); ctx.lineTo(ex + 2 * s, y - 4 * s);
      ctx.stroke();
      if (mood === 'stun') {
        ctx.fillStyle = '#ffe14a';
        for (let i = 0; i < 3; i++) {
          const a = this.t * 5 + (i / 3) * U.TAU;
          G.Icons.star(ctx, x + Math.cos(a) * 14 * s, y - 14 * s + Math.sin(a) * 4 * s, 4 * s, '#ffe14a');
        }
      }
    }
  }
  G.Enemy = Enemy;

  // ---- Glumble: basic patrol walker ------------------------------------------
  class Walker extends Enemy {
    constructor(sp) { super(sp, 36, 30, 1); this.speed = 62; }
    behave(dt, play) {
      if (this.onGround) {
        if (this.hitX || this.ledgeAhead(play, this.facing)) this.facing *= -1;
        this.vx = U.approach(this.vx, this.facing * this.speed, 900 * dt);
      }
    }
    draw(ctx) {
      const sq = Math.abs(Math.sin(this.t * 7)) * 0.4;
      this.drawBlob(ctx, this.cx, this.y + this.h, this.w, this.h, sq);
      this.drawFace(ctx, this.cx, this.y + this.h * 0.45 + sq * 2, 1, this.facing);
      // little feet
      if (this.flashT <= 0) {
        ctx.fillStyle = U.shade(this.tint, -0.4);
        const ph = Math.sin(this.t * 14);
        ctx.fillRect(this.cx - 12 + ph * 3, this.y + this.h - 4, 8, 4);
        ctx.fillRect(this.cx + 4 - ph * 3, this.y + this.h - 4, 8, 4);
      }
    }
  }
  E.register('w', Walker);

  // ---- Hopsy: hops toward the player ---------------------------------------
  class Hopper extends Enemy {
    constructor(sp) { super(sp, 34, 30, 1); this.wait = 0.6 + Math.random(); this.accent = '#7cf0a0'; }
    behave(dt, play) {
      const p = play.player;
      if (this.onGround) {
        this.vx = U.approach(this.vx, 0, 1600 * dt);
        this.wait -= dt;
        if (this.wait <= 0 && Math.abs(p.cx - this.cx) < 460) {
          this.facing = U.sign(p.cx - this.cx) || this.facing;
          this.vx = this.facing * 150;
          this.vy = -640;
          this.wait = 1.1 + Math.random() * 0.5;
        }
      }
    }
    draw(ctx) {
      const air = !this.onGround;
      const crouch = this.onGround && this.wait < 0.25 ? 0.6 : 0;
      this.drawBlob(ctx, this.cx, this.y + this.h, this.w, this.h * (air ? 1.1 : 1), crouch, { color: U.mix(this.tint, '#5aa070', 0.25) });
      this.drawFace(ctx, this.cx, this.y + this.h * 0.4 + crouch * 4, 1, this.facing);
      if (this.flashT <= 0) {
        // frog legs
        ctx.fillStyle = U.shade(this.tint, -0.35);
        const ly = this.y + this.h;
        const spread = air ? 8 : 0;
        U.poly(ctx, [this.cx - 16 - spread, ly, this.cx - 8, ly - 10, this.cx - 4, ly]); ctx.fill();
        U.poly(ctx, [this.cx + 16 + spread, ly, this.cx + 8, ly - 10, this.cx + 4, ly]); ctx.fill();
      }
    }
  }
  E.register('h', Hopper);

  // ---- Spikeback: can't be stomped, punch or pound it -------------------------
  class Spiker extends Enemy {
    constructor(sp) { super(sp, 40, 30, 2); this.stompable = false; this.speed = 48; this.gems = 2; }
    behave(dt, play) {
      if (this.onGround) {
        if (this.hitX || this.ledgeAhead(play, this.facing)) this.facing *= -1;
        this.vx = U.approach(this.vx, this.facing * this.speed, 900 * dt);
      }
    }
    draw(ctx) {
      const x = this.cx, by = this.y + this.h;
      // spikes
      if (this.flashT <= 0) {
        for (let i = 0; i < 5; i++) {
          const a = Math.PI + 0.35 + (i / 4) * (Math.PI - 0.7);
          const bx = x + Math.cos(a) * 16, byy = by - 6 + Math.sin(a) * 22;
          const tx = x + Math.cos(a) * 30, ty = by - 6 + Math.sin(a) * 36;
          ctx.fillStyle = '#e6e9f5';
          U.poly(ctx, [bx - 5, byy + 2, tx, ty, bx + 5, byy + 2]);
          ctx.fill();
          ctx.fillStyle = '#9ba0b8';
          U.poly(ctx, [bx, byy + 2, tx, ty, bx + 5, byy + 2]);
          ctx.fill();
        }
      }
      this.drawBlob(ctx, x, by, this.w, this.h, Math.abs(Math.sin(this.t * 6)) * 0.3, { color: U.mix(this.tint, '#6b5a7a', 0.4) });
      this.drawFace(ctx, x, by - 15, 1, this.facing);
    }
  }
  E.register('k', Spiker);

  // ---- Buzzwing: flying patrol --------------------------------------------
  class Flyer extends Enemy {
    constructor(sp) {
      super(sp, 34, 28, 1);
      this.gravity = false;
      this.x0 = this.x; this.y0 = sp.y + 8;
      this.y = this.y0;
      this.range = 130;
      this.ph = Math.random() * U.TAU;
    }
    physics(dt, play) {
      this.x += this.vx * dt; this.y += this.vy * dt;
    }
    behave(dt, play) {
      this.ph += dt;
      if (this.knock) {
        this.knock -= dt;
        this.vx *= 0.9; this.vy *= 0.9;
        if (this.knock <= 0) this.knock = 0;
        return;
      }
      const tx = this.x0 + Math.sin(this.ph * 0.9) * this.range;
      const ty = this.y0 + Math.sin(this.ph * 2.6) * 22;
      this.vx = (tx - this.x) * 4; this.vy = (ty - this.y) * 4;
      this.facing = Math.cos(this.ph * 0.9) >= 0 ? 1 : -1;
    }
    onHit() { this.knock = 0.3; }
    draw(ctx) {
      const x = this.cx, y = this.cy;
      const flap = Math.sin(this.t * 30);
      if (this.flashT <= 0) {
        ctx.fillStyle = 'rgba(220,225,245,0.8)';
        U.poly(ctx, [x - 4, y - 6, x - 22, y - 16 - flap * 8, x - 14, y]); ctx.fill();
        U.poly(ctx, [x + 4, y - 6, x + 22, y - 16 - flap * 8, x + 14, y]); ctx.fill();
      }
      ctx.save();
      ctx.translate(0, 14);
      this.drawBlob(ctx, x, y, this.w, this.h * 0.95, 0, { color: U.mix(this.tint, '#7a6aa0', 0.3) });
      ctx.restore();
      this.drawFace(ctx, x, y - 2, 0.9, this.facing);
      if (this.flashT <= 0) {
        ctx.fillStyle = '#ffd36a';
        U.poly(ctx, [x - 3, y + 12, x + 3, y + 12, x, y + 19]); ctx.fill();
      }
    }
  }
  E.register('f', Flyer);

  // ---- Grumpkin turret: fires orbs at Ember ------------------------------------
  class Turret extends Enemy {
    constructor(sp) { super(sp, 40, 40, 2); this.cool = 1.5 + Math.random(); this.gems = 2; this.charge = 0; }
    behave(dt, play) {
      const p = play.player;
      this.vx = 0;
      this.facing = p.cx < this.cx ? -1 : 1;
      const dx = Math.abs(p.cx - this.cx), dy = Math.abs(p.cy - this.cy);
      if (dx < 560 && dy < 260 && !p.dead) {
        this.cool -= dt;
        this.charge = U.clamp(1 - this.cool / 0.5, 0, 1);
        if (this.cool <= 0) {
          this.cool = 2.3;
          const sx = this.cx + this.facing * 22, sy = this.y + 14;
          const a = Math.atan2(p.cy - sy, p.cx - sx);
          // limit the aim to a cone in front of the barrel
          const aa = this.facing > 0 ? U.clamp(a, -0.5, 0.5) : (Math.abs(a) > Math.PI - 0.5 ? a : U.sign(a || 1) * (Math.PI - 0.5));
          play.spawn(new G.Projectile(sx, sy, Math.cos(aa) * 250, Math.sin(aa) * 250, { color: '#c3b9e8', life: 4 }));
          play.sfx('shoot');
        }
      } else this.charge = 0;
    }
    draw(ctx) {
      const x = this.cx, by = this.y + this.h;
      const f = this.flashT > 0;
      const c = f ? '#fff' : U.mix(this.tint, '#5e6a8a', 0.3);
      // base
      ctx.fillStyle = f ? '#fff' : U.shade(c, -0.35);
      U.poly(ctx, [x - 20, by, x - 16, by - 14, x + 16, by - 14, x + 20, by]);
      ctx.fill();
      // head dome
      this.drawBlob(ctx, x, by - 10, 38, 28, -this.charge * 0.3, { color: c });
      // barrel
      ctx.fillStyle = f ? '#fff' : U.shade(c, -0.45);
      const bx = x + this.facing * 14;
      ctx.fillRect(Math.min(bx, bx + this.facing * 16), by - 32, 16, 12);
      ctx.fillStyle = this.charge > 0 ? U.rgba('#ffd36a', this.charge) : U.shade(c, -0.6);
      ctx.beginPath(); ctx.arc(bx + this.facing * 16, by - 26, 5, 0, U.TAU); ctx.fill();
      this.drawFace(ctx, x - this.facing * 3, by - 24, 0.8, this.facing);
    }
  }
  E.register('t', Turret);

  // ---- Rambler: charges when it sees Ember, gets dizzy on walls ---------------
  class Charger extends Enemy {
    constructor(sp) { super(sp, 50, 38, 3); this.state = 'walk'; this.st = 0; this.gems = 4; }
    behave(dt, play) {
      const p = play.player;
      this.st += dt;
      if (this.state === 'walk') {
        if (this.onGround && (this.hitX || this.ledgeAhead(play, this.facing))) this.facing *= -1;
        this.vx = U.approach(this.vx, this.facing * 40, 600 * dt);
        const dx = p.cx - this.cx;
        if (!p.dead && Math.abs(dx) < 380 && Math.abs(p.cy - this.cy) < 50 && U.sign(dx) === this.facing) { this.state = 'wind'; this.st = 0; play.sfx('warn'); }
      } else if (this.state === 'wind') {
        this.vx = U.approach(this.vx, 0, 2000 * dt);
        if (this.st > 0.45) { this.state = 'charge'; this.st = 0; }
      } else if (this.state === 'charge') {
        this.vx = this.facing * 400;
        if (this.hitX) { this.state = 'stun'; this.st = 0; this.vx = -this.facing * 120; this.vy = -300; play.shake(4, 0.2); play.sfx('stomp'); }
        else if (this.onGround && this.ledgeAhead(play, this.facing)) { this.state = 'walk'; this.vx = 0; this.facing *= -1; }
        else if (this.st > 2) { this.state = 'walk'; }
      } else if (this.state === 'stun') {
        if (this.onGround) this.vx = U.approach(this.vx, 0, 900 * dt);
        if (this.st > 1.4) { this.state = 'walk'; this.facing *= -1; }
      }
    }
    get harmless() { return this.state === 'stun'; }
    onHit(kind) { if (this.state === 'charge') { this.state = 'stun'; this.st = 0.6; } }
    draw(ctx) {
      const x = this.cx, by = this.y + this.h, f = this.facing;
      const c = U.mix(this.tint, '#8a6f6a', 0.35);
      const shake = this.state === 'wind' ? (Math.random() - 0.5) * 3 : 0;
      ctx.save();
      ctx.translate(shake, 0);
      // horn
      if (this.flashT <= 0) {
        ctx.fillStyle = '#eceff8';
        U.poly(ctx, [x + f * 18, by - 22, x + f * 36, by - 34, x + f * 22, by - 14]);
        ctx.fill();
      }
      this.drawBlob(ctx, x, by, this.w, this.h, this.state === 'charge' ? 0.2 : 0, { color: c });
      // legs
      if (this.flashT <= 0) {
        ctx.fillStyle = U.shade(c, -0.4);
        const ph = this.state === 'charge' ? Math.sin(this.t * 30) * 4 : Math.sin(this.t * 10) * 2;
        ctx.fillRect(x - 18 + ph, by - 6, 9, 6);
        ctx.fillRect(x + 9 - ph, by - 6, 9, 6);
      }
      this.drawFace(ctx, x + f * 4, by - 22, 1, f, this.state === 'stun' ? 'stun' : null);
      if (this.state === 'charge' && Math.random() < 0.5 && this.flashT <= 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fillRect(x - f * 34, by - 8 - Math.random() * 20, 14, 2);
      }
      ctx.restore();
    }
  }
  E.register('c', Charger);

  // ---- Cinderling: leaps out of liquid -------------------------------------------
  class Jumper extends Enemy {
    constructor(sp) {
      super(sp, 30, 30, 1);
      this.gravity = false;
      this.homeY = sp.y + TS() * 0.5;
      this.y = this.homeY;
      this.wait = Math.random() * 1.5 + 0.5;
      this.stompable = false;
      this.state = 'hide';
    }
    physics(dt) { this.x += this.vx * dt; this.y += this.vy * dt; }
    behave(dt, play) {
      this.vx = 0;
      if (this.state === 'hide') {
        this.vy = 0; this.y = this.homeY;
        this.wait -= dt;
        if (this.wait <= 0) { this.state = 'jump'; this.vy = -880; }
      } else {
        this.vy += 1500 * dt;
        if (this.vy > 0 && this.y >= this.homeY) { this.state = 'hide'; this.wait = 1.6; this.y = this.homeY; }
      }
    }
    update(dt, play) {
      super.update(dt, play);
      // never dies in its own liquid
    }
    die(play, silent) { if (silent) return; super.die(play, silent); }
    draw(ctx, play) {
      if (this.state === 'hide') return;
      const x = this.cx, y = this.cy;
      const liq = play.theme.liquid;
      ctx.save();
      ctx.translate(x, y);
      if (this.vy > 0) ctx.scale(1, -1);
      ctx.fillStyle = this.flashT > 0 ? '#fff' : liq.color;
      U.poly(ctx, [0, -17, 13, -2, 9, 14, -9, 14, -13, -2]);
      ctx.fill();
      ctx.fillStyle = this.flashT > 0 ? '#fff' : liq.light;
      U.poly(ctx, [0, -17, -13, -2, -4, 2]);
      ctx.fill();
      ctx.restore();
      this.drawFace(ctx, x, y + 2, 0.75, 1);
    }
  }
  E.register('j', Jumper);
})(window.G);

</script>
<script>
// Bosses. Each boss is a state machine with telegraphed attacks and a
// "vulnerable" window; reflected projectiles always hurt a boss.
// Register new bosses in G.Bosses and reference them from a level's `boss`.
(function (G) {
  'use strict';
  const U = G.U;
  const Phys = G.Phys;
  const TS = () => G.TILE;
  G.Bosses = {};
  G.BossArt = {};

  class Boss extends G.Entity {
    constructor(sp, w, h, hp) {
      super(sp.x + TS() / 2 - w / 2, sp.y + TS() - h, w, h);
      this.isBoss = true;
      this.hp = this.maxHp = hp;
      this.vx = 0; this.vy = 0;
      this.state = 'intro'; this.st = 0;
      this.active = false;
      this.vulnerable = false;
      this.flashT = 0;
      this.facing = -1;
      this.lastHitId = -1;
      this.dying = 0;
      this.layer = 0;
      this.contact = true;
      this.phase = 1;
      this.maxWindowHits = 3; // direct hits allowed per vulnerable window
      this.windowHits = 0;
      this._wasVul = false;
    }
    set(state) { this.state = state; this.st = 0; }
    get phase2() { return this.hp <= this.maxHp / 2; }
    physics(dt, play, grav) {
      if (grav !== false) this.vy = Math.min(1200, this.vy + 2300 * dt);
      this.hitX = Phys.moveX(play.level, this, this.vx * dt);
      const r = Phys.moveY(play.level, this, this.vy * dt, false, null);
      const was = this.onGround;
      this.onGround = r.hit === 1;
      if (r.hit) this.vy = 0;
      this.justLanded = this.onGround && !was;
    }
    update(dt, play) {
      this.t += dt;
      this.flashT = Math.max(0, this.flashT - dt);
      if (this.dying > 0) {
        this.dying += dt;
        this.vx = 0;
        if (Math.random() < dt * 14) {
          play.parts.burst(this.x + Math.random() * this.w, this.y + Math.random() * this.h, 10, { color: G.Icons.PRISM, speed: 260, life: 0.6, size: 7 });
          play.sfx('hit');
        }
        if (this.dying > 2.4) { this.dead = true; play.onBossDefeated(this); }
        return;
      }
      if (!this.active) { this.idleIntro(dt, play); return; }
      this.st += dt;
      this.behave(dt, play);
      if (this.vulnerable && !this._wasVul) this.windowHits = 0;
      this._wasVul = this.vulnerable;
    }
    idleIntro(dt, play) { if (this.gravityOn !== false) this.physics(dt, play); }
    behave(dt, play) {}
    // Called by the play scene. kind: punch|stomp|pound|dash|reflect
    hit(dmg, kind, fromX, play) {
      if (this.dying || !this.active) return false;
      if (!this.vulnerable && kind !== 'reflect') {
        play.sfx('deny');
        return false;
      }
      if (kind !== 'reflect' && this.windowHits >= this.maxWindowHits) { play.sfx('deny'); return false; }
      if (kind !== 'reflect') {
        this.windowHits++;
        // after the last allowed hit, shorten the window so the fight keeps moving
        if (this.windowHits >= this.maxWindowHits) this.st = Math.max(this.st, 99);
      }
      this.hp -= dmg;
      this.flashT = 0.18;
      play.sfx('bossHit');
      play.shake(6, 0.2);
      play.hitstop(0.07);
      play.parts.burst(this.cx, this.cy, 14, { color: G.Icons.PRISM, speed: 300, life: 0.5, size: 6 });
      this.onHurt(kind, play);
      if (this.hp <= 0) {
        this.hp = 0;
        this.dying = 0.001;
        this.vulnerable = false;
        play.onBossDying(this);
      }
      return true;
    }
    onHurt(kind, play) {}
    stompResult() { return this.vulnerable ? 'hit' : 'bounce'; }
    hurtBox() { return { x: this.x + 10, y: this.y + 10, w: this.w - 20, h: this.h - 14 }; }
  }
  G.Boss = Boss;

  // =====================================================================
  // 1) GLUMBO — King of the Glumbles (Sunny Meadows)
  // =====================================================================
  function drawGlumbo(ctx, x, by, w, h, t, o) {
    o = o || {};
    const f = o.flash;
    const base = f ? '#ffffff' : '#8f8ca6';
    const sq = o.squash || 0;
    const hw = (w / 2) * (1 + sq * 0.2), hh = h * (1 - sq * 0.2);
    const n = 12, pts = [];
    for (let i = 0; i <= n; i++) {
      const a = Math.PI + (i / n) * Math.PI;
      pts.push([x + Math.cos(a) * hw, by - 6 + Math.sin(a) * hh]);
    }
    ctx.fillStyle = f ? base : U.shade(base, -0.3);
    ctx.beginPath(); ctx.moveTo(x - hw, by);
    pts.forEach((p) => ctx.lineTo(p[0], p[1]));
    ctx.lineTo(x + hw, by); ctx.closePath(); ctx.fill();
    if (!f) {
      for (let i = 0; i < n; i++) {
        const a = pts[i], b = pts[i + 1];
        ctx.fillStyle = i < n * 0.45 ? U.shade(base, 0.06 + (i % 2) * 0.07) : U.shade(base, -0.06 - (i % 2) * 0.07);
        U.poly(ctx, [x - hw * 0.2, by - hh * 0.5, a[0], a[1], b[0], b[1]]);
        ctx.fill();
      }
    }
    // crown
    const cy = by - 6 - hh - 6;
    G.Icons.crown(ctx, x - 6, cy, 1.9, f ? '#fff' : '#c9b25a');
    if (f) return;
    // face
    const fx = x + (o.facing || -1) * 10;
    const ey = by - hh * 0.55;
    const tired = o.tired;
    ctx.fillStyle = '#fff';
    if (tired) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx - 22, ey); ctx.lineTo(fx - 8, ey + 3); ctx.moveTo(fx + 22, ey); ctx.lineTo(fx + 8, ey + 3); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(fx - 15, ey, 8, 11, 0, 0, U.TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(fx + 15, ey, 8, 11, 0, 0, U.TAU); ctx.fill();
      ctx.fillStyle = '#1b1726';
      ctx.beginPath(); ctx.arc(fx - 15 + (o.facing || -1) * 3, ey + 2, 4, 0, U.TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(fx + 15 + (o.facing || -1) * 3, ey + 2, 4, 0, U.TAU); ctx.fill();
      ctx.strokeStyle = '#2a2433'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx - 28, ey - 16); ctx.lineTo(fx - 6, ey - 10); ctx.moveTo(fx + 28, ey - 16); ctx.lineTo(fx + 6, ey - 10); ctx.stroke();
    }
    // mouth
    ctx.fillStyle = '#3a2033';
    ctx.beginPath();
    if (tired) ctx.ellipse(fx, ey + 26, 9, 7 + Math.sin(t * 8) * 2, 0, 0, U.TAU);
    else { ctx.moveTo(fx - 20, ey + 22); ctx.quadraticCurveTo(fx, ey + 14, fx + 20, ey + 22); ctx.quadraticCurveTo(fx, ey + 34, fx - 20, ey + 22); }
    ctx.fill();
    if (!tired) {
      ctx.fillStyle = '#fff';
      U.poly(ctx, [fx - 12, ey + 19, fx - 8, ey + 26, fx - 4, ey + 18]); ctx.fill();
      U.poly(ctx, [fx + 12, ey + 19, fx + 8, ey + 26, fx + 4, ey + 18]); ctx.fill();
    }
    if (tired) for (let i = 0; i < 3; i++) {
      const a = t * 4 + (i / 3) * U.TAU;
      G.Icons.star(ctx, x + Math.cos(a) * 40, by - hh - 30 + Math.sin(a) * 8, 7, '#ffe14a');
    }
  }
  G.BossArt.glumbo = (ctx, cx, cy, t) => drawGlumbo(ctx, cx + 8, cy + 70, 130, 100, t, { facing: -1 });

  class Glumbo extends Boss {
    constructor(sp) {

    behave(dt, play) {

      const s = this.state;
      const fast = this.phase2 ? 1.3 : 1;
      if (s === 'intro') this.set('idle');
      if (s === 'idle') {

        this.vx = 0;

          this.vy = -920;
          this.set('air');
          play.sfx('jump');
        }
      } else if (s === 'air') {
        if (this.justLanded) {

          this.hops++;

          else this.set('crouch');

      } else if (s === 'tired') {

      }

    summon(play) {

    draw(ctx, play) {
      const sq = this.state === 'crouch' ? 0.6 : this.state === 'air' ? -0.25 : this.state === 'tired' ? 0.25 + Math.sin(this.t * 6) * 0.06 : Math.sin(this.t * 4) * 0.06;
      drawGlumbo(ctx, this.cx, this.y + this.h, this.w, this.h, this.t, { flash: this.flashT > 0, squash: sq, tired: this.state === 'tired', facing: this.facing });

    // legs
    ctx.fillStyle = dark;
    U.poly(ctx, [x - 40, by, x - 34, by - 40, x - 12, by - 40, x - 14, by]); ctx.fill();
    U.poly(ctx, [x + 40, by, x + 34, by - 40, x + 12, by - 40, x + 14, by]); ctx.fill();
    // torso
    ctx.fillStyle = body;
    U.poly(ctx, [x - 52, by - 110, x + 52, by - 110, x + 40, by - 36, x - 40, by - 36]); ctx.fill();
    ctx.fillStyle = lite;
    U.poly(ctx, [x - 52, by - 110, x, by - 110, x - 6, by - 36, x - 40, by - 36]); ctx.fill();
    // crystal spikes on back
    const cc = f ? '#fff' : '#b48cff';
    for (let i = 0; i < 4; i++) {

    U.poly(ctx, [x, by - 92, x + 13, by - 75, x, by - 58, x - 13, by - 75]); ctx.fill();
    if (glow > 0 && !f) {

      g.addColorStop(0, U.rgba('#9dfff0', 0.8 * glow)); g.addColorStop(1, 'rgba(157,255,240,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, by - 75, 46, 0, U.TAU); ctx.fill();
    }
    // head
    ctx.fillStyle = body;
    U.poly(ctx, [x - 22, by - 108, x - 18, by - 132, x + 18, by - 132, x + 22, by - 108]); ctx.fill();
    ctx.fillStyle = f ? '#fff' : '#ffffff';
    if (o.dazed) {
      ctx.fillRect(x - 13, by - 121, 9, 3); ctx.fillRect(x + 4, by - 121, 9, 3);
    } else {
      U.poly(ctx, [x - 14, by - 124, x - 4, by - 121, x - 5, by - 116, x - 14, by - 118]); ctx.fill();
      U.poly(ctx, [x + 14, by - 124, x + 4, by - 121, x + 5, by - 116, x + 14, by - 118]); ctx.fill();

      ctx.fillStyle = dark;
      U.limb(ctx, sx, sy, 14, ex, ey, 12); ctx.fill();
      ctx.fillStyle = f ? '#fff' : U.shade(cc, -0.1);
      U.poly(ctx, [ex - 18, ey, ex, ey - 16, ex + 18, ey, ex, ey + 22]); ctx.fill();
      ctx.fillStyle = f ? '#fff' : cc;
      U.poly(ctx, [ex - 18, ey, ex, ey - 16, ex, ey + 22]); ctx.fill();
    });
  }
  G.BossArt.golem = (ctx, cx, cy, t) => { ctx.save(); ctx.translate(cx, cy + 55); ctx.scale(0.62, 0.62); drawGolem(ctx, 0, 0, t, {}); ctx.restore(); };

      const floorY = this.floorY || (this.floorY = this.findFloor(L));

      if (s === 'hover') {
        this.vulnerable = false;
        const tx = U.clamp(p.cx + (this.cx < p.cx ? -220 : 220), TS() * 3, L.pw - TS() * 3);
        this.x = U.damp(this.x, tx - this.w / 2, 2.2 * k, dt);
        this.y = U.damp(this.y, this.homeY + Math.sin(this.t * 2) * 20, 3, dt);
        this.facing = p.cx < this.cx ? -1 : 1;
        this.shotT = (this.shotT || 0) - dt;
        if (this.shotT <= 0) {
          this.shotT = 0.9 / k;
          const n = this.phase2 ? 5 : 3;
          const base = Math.atan2(p.cy - this.cy, p.cx - this.cx);
          for (let i = 0; i < n; i++) {
            const a = base + (i - (n - 1) / 2) * 0.22;
            play.spawn(new G.Projectile(this.cx, this.cy + 10, Math.cos(a) * 280, Math.sin(a) * 280, { color: '#dfe6ff', r: 9, life: 4, kind: 'feather' }));
          }
          play.sfx('shoot');
        }
        if (this.st > 3.2 / k) {
          this.cycle++;
          if (this.phase2 && this.cycle % 3 === 0) { this.set('gust'); play.sfx('wind'); }
          else { this.set('screech'); play.sfx('roar'); }
        }
      } else if (s === 'screech') {
        this.y = U.damp(this.y, this.homeY - 20, 4, dt);
        if (this.st > 0.6) {
          this.set('swoop');
          this.dir = p.cx < this.cx ? -1 : 1;
          this.facing = this.dir;
          this.vy = 0;
        }
      } else if (s === 'swoop') {
        // dive to the floor then skid along it
        const gy = floorY - this.h;
        if (this.y < gy) {
          this.vy = Math.min(900, this.vy + 3000 * dt);
          this.y = Math.min(gy, this.y + this.vy * dt);
        }
        this.x += this.dir * 520 * k * dt;
        const hitWall = this.x < TS() * 1 || this.x + this.w > L.pw - TS() * 1;
        if (hitWall) {
          this.x = U.clamp(this.x, TS() * 1, L.pw - TS() * 1 - this.w);
          this.y = gy;
          this.set('dazed');
          play.shake(10, 0.3);
          play.sfx('pound');
        }
      } else if (s === 'dazed') {
        this.vulnerable = true;
        this.y = floorY - this.h;
        if (this.st > 2.6) { this.vulnerable = false; this.set('rise'); }
      } else if (s === 'rise') {
        this.y = U.damp(this.y, this.homeY, 3, dt);
        if (this.st > 0.9) this.set('hover');
      } else if (s === 'gust') {
        this.y = U.damp(this.y, this.homeY, 3, dt);
        this.facing = p.cx < this.cx ? -1 : 1;
        const push = -this.facing * -1; // push away from hawk
        play.wind = U.sign(p.cx - this.cx) * 260;
        void push;
        if (Math.random() < dt * 4) {
          play.spawn(new G.Projectile(U.rand(TS() * 2, L.pw - TS() * 2), TS() * 0.5, U.rand(-30, 30), 120, { g: 300, color: '#dfe6ff', r: 8, life: 5, kind: 'feather' }));
        }
        if (Math.random() < dt * 30) play.parts.spawn({ x: this.cx < p.cx ? play.view.x : play.view.x + play.view.w, y: U.rand(play.view.y, play.view.y + play.view.h), vx: U.sign(p.cx - this.cx) * 700, life: 1.2, size: 2, shape: 'circle', color: 'rgba(255,255,255,0.6)' });
        if (this.st > 2.8) { play.wind = 0; this.set('screech'); play.sfx('roar'); }
      }
    }
    findFloor(L) {
      const tx = Math.floor(this.cx / TS());
      for (let ty = Math.floor(this.y / TS()); ty < L.h; ty++) if (Phys.solid(L, tx, ty)) return ty * TS();
      return L.ph - TS();
    }
    draw(ctx) {
      const s = this.state;
      drawHawk(ctx, this.cx, this.cy, this.t, {
        flash: this.flashT > 0, facing: this.facing, dazed: s === 'dazed',
        fast: s === 'gust' || s === 'screech', tilt: s === 'swoop' ? 0.25 : 0,
      });
      if (s === 'screech') {
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 - this.st) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(this.cx + this.facing * 50, this.cy - 20, 20 + this.st * 80, 0, U.TAU); ctx.stroke();
      }
    }
  }
  G.Bosses.hawk = Hawk;

  // =====================================================================
  // 4) KING MONOCHROME (Grey Citadel) — final boss
  // =====================================================================
  class Laser extends G.Entity {
    constructor(play, y, h) {
      super(0, y, play.level.pw, h);
      this.warn = 0.9; this.on = 0.55;
      this.layer = 1;
    }
    update(dt, play) {
      this.t += dt;
      if (this.warn > 0) { this.warn -= dt; if (this.warn <= 0) { play.sfx('laser'); play.shake(6, 0.4); } return; }
      this.on -= dt;
      if (this.on <= 0) { this.dead = true; return; }
      const p = play.player;
      if (!p.dead && U.overlap({ x: this.x, y: this.y + 6, w: this.w, h: this.h - 12 }, p)) p.hurt(1, p.cx - 10) && play.onPlayerHurt();
    }
    draw(ctx, play) {
      const v = play.view;
      if (this.warn > 0) {
        ctx.fillStyle = 'rgba(255,255,255,' + (0.12 + 0.12 * Math.sin(this.t * 30)) + ')';
        ctx.fillRect(v.x, this.y, v.w, this.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.setLineDash([12, 10]);
        ctx.strokeRect(v.x - 2, this.y, v.w + 4, this.h);
        ctx.setLineDash([]);
        return;
      }
      const g = ctx.createLinearGradient(0, this.y, 0, this.y + this.h);
      g.addColorStop(0, 'rgba(200,200,220,0)');
      g.addColorStop(0.3, 'rgba(240,240,255,0.95)');
      g.addColorStop(0.5, '#ffffff');
      g.addColorStop(0.7, 'rgba(240,240,255,0.95)');
      g.addColorStop(1, 'rgba(200,200,220,0)');
      ctx.fillStyle = g;
      ctx.fillRect(v.x, this.y, v.w, this.h);
    }
  }

  class King extends Boss {
    constructor(sp) {
      super(sp, 70, 120, 16);
      this.name = 'KING MONOCHROME';
      this.title = 'Lord of the Grey';
      this.gravityOn = false;
      this.homeY = sp.y - TS() * 2.2;
      this.y = this.homeY;
      this.cycle = 0;
      this.cast = 0;
      this.angry = false;
    }
    idleIntro(dt) { this.y = this.homeY + Math.sin(this.t * 1.8) * 6; }
    hurtBox() { return { x: this.x + 8, y: this.y + 20, w: this.w - 16, h: this.h - 20 }; }
    stompResult() { return this.vulnerable ? 'hit' : 'hurt'; }
    behave(dt, play) {
      const p = play.player;
      const L = play.level;
      const s = this.state;
      const p2 = this.phase2;
      this.floorY = this.floorY || this.findFloor(L);
      if (p2 && !this.angry) {
        this.angry = true;
        this.set('rage');
        play.sfx('roar');
        play.shake(14, 1.2);
        play.say([{ who: 'king', text: 'ENOUGH! If I cannot have colour, NO ONE WILL!' }]);
        return;
      }
      this.cast = Math.max(0, this.cast - dt * 2);
      if (s === 'intro') this.set('float');
      if (s === 'rage') {
        this.y = U.damp(this.y, this.homeY - 30, 3, dt);
        if (this.st > 1.2) this.set('float');
      } else if (s === 'float') {
        this.vulnerable = false;
        if (!this.target || this.st === 0 || Math.abs(this.cx - this.target) < 8) {
          const opts = [TS() * 4, L.pw / 2, L.pw - TS() * 4];
          this.target = U.pick(opts.filter((o) => Math.abs(o - this.cx) > 60)) || opts[1];
        }
        this.x = U.damp(this.x, this.target - this.w / 2, 2.5, dt);
        this.y = U.damp(this.y, this.homeY + Math.sin(this.t * 2) * 12, 3, dt);
        this.facing = p.cx < this.cx ? -1 : 1;
        if (this.st > (p2 ? 1.4 : 1.9)) {
          this.cycle++;
          const c = this.cycle % (p2 ? 4 : 3);
          if (c === 1) this.set('volley');
          else if (c === 2) this.set(p2 ? 'laser' : 'summon');
          else if (c === 3 && p2) this.set('volley');
          else this.set('slamUp');
        }
      } else if (s === 'volley') {
        this.cast = 1;
        const n = p2 ? 5 : 3;
        this.shotT = (this.shotT || 0) - dt;
        if (this.st > 0.4 && this.shotT <= 0 && (this.shots || 0) < n) {
          this.shotT = p2 ? 0.28 : 0.4;
          this.shots = (this.shots || 0) + 1;
          const a = Math.atan2(p.cy - this.cy, p.cx - this.cx) + U.rand(-0.3, 0.3);
          play.spawn(new G.Projectile(this.cx, this.cy - 20, Math.cos(a) * 200, Math.sin(a) * 200, { color: '#d9d6e2', r: 12, life: 5, homing: 1.4, ignoreTiles: true }));
          play.sfx('shoot');
        }
        if (this.st > 0.4 + n * 0.45 + 0.6) { this.shots = 0; this.set('float'); }
      } else if (s === 'summon') {
        this.cast = 1;
        if (this.st > 0.6 && !this.summoned) {
          this.summoned = true;
          const live = play.entities.filter((e) => e.isEnemy && !e.dead).length;
          if (live < 3) for (const d of [-1, 1]) {
            const kind = U.pick(['w', 'h', 'f']);
            const e = new G.Enemies.types[kind]({ x: U.clamp(p.cx + d * 220, TS() * 2, L.pw - TS() * 3), y: this.floorY - TS() * (kind === 'f' ? 3 : 1.5) });
            e.asleep = false; e.gems = 1; e.facing = -d;
            play.spawn(e);
            play.parts.burst(e.cx, e.cy, 16, { color: ['#d9d6e2', '#77748a'], speed: 200, life: 0.5 });
          }
          play.sfx('roar');
        }
        if (this.st > 1.3) { this.summoned = false; this.set('float'); }
      } else if (s === 'slamUp') {
        this.y = U.damp(this.y, this.homeY - 40, 5, dt);
        this.x = U.damp(this.x, p.cx - this.w / 2, 4, dt);
        if (this.st > 0.7) { this.set('slamDown'); this.vy = 0; play.sfx('warn'); }
      } else if (s === 'slamDown') {
        this.vy = Math.min(1500, this.vy + 4000 * dt);
        this.y += this.vy * dt;
        if (this.y + this.h >= this.floorY) {
          this.y = this.floorY - this.h;
          play.shake(14, 0.4);
          play.sfx('pound');
          play.spawn(new G.Shockwave(this.x, this.floorY, -1, { speed: p2 ? 420 : 340, color: '#d9d6e2' }));
          play.spawn(new G.Shockwave(this.x + this.w, this.floorY, 1, { speed: p2 ? 420 : 340, color: '#d9d6e2' }));
          this.set('tired');
        }
      } else if (s === 'tired') {
        this.vulnerable = this.st > 0.25;
        if (this.st > (p2 ? 2.0 : 2.6)) { this.vulnerable = false; this.set('float'); }
      } else if (s === 'laser') {
        this.cast = 1;
        this.y = U.damp(this.y, this.homeY - 20, 3, dt);
        if (!this.lasered) {
          this.lasered = true;
          const low = Math.random() < 0.5;
          const fy = this.floorY;
          // low beam: jump over it; high beam: stay on the ground
          if (low) play.spawn(new Laser(play, fy - 40, 40));
          else play.spawn(new Laser(play, fy - 200, 130));
          play.sfx('warn');
        }
        if (this.st > 1.8) { this.lasered = false; this.set('float'); }
      }
    }
    findFloor(L) {
      const tx = Math.floor(this.cx / TS());
      for (let ty = Math.floor(this.y / TS()) + 1; ty < L.h; ty++) if (Phys.solid(L, tx, ty)) return ty * TS();
      return L.ph - TS();
    }
    draw(ctx) {
      const s = this.state;
      const tired = s === 'tired';
      G.Icons.king(ctx, this.cx, this.y + this.h - 26, 1.45, this.t, {
        flash: this.flashT > 0, facing: this.facing, cast: this.cast, angry: this.angry,
        gemColor: tired ? G.Icons.PRISM[Math.floor(this.t * 6) % 6] : null,
      });
      if (tired) for (let i = 0; i < 3; i++) {
        const a = this.t * 5 + (i / 3) * U.TAU;
        G.Icons.star(ctx, this.cx + Math.cos(a) * 30, this.y - 6 + Math.sin(a) * 6, 6, '#ffe14a');
      }
    }
  }
  G.Bosses.king = King;
  G.BossArt.king = (ctx, cx, cy, t) => G.Icons.king(ctx, cx, cy + 92, 1.6, t, {});
})(window.G);

// World & level registry. To add a level: G.Worlds.addLevel({...}) in a
// data/levels/*.js file and list its id in the world's `levels` array.
(function (G) {
  'use strict';
  const W = (G.Worlds = {
    list: [
      { id: 1, name: 'Sunny Meadows', theme: 'meadow', music: 'w1', color: '#5fd04a', accent: '#ffd84a', levels: ['1-1', '1-2', '1-3', '1-B'] },
      { id: 2, name: 'Crystal Caverns', theme: 'caves', music: 'w2', color: '#8a6bff', accent: '#3ee0c8', levels: ['2-1', '2-2', '2-3', '2-B'] },
      { id: 3, name: 'Frostwind Peaks', theme: 'peaks', music: 'w3', color: '#6cc8ff', accent: '#ffffff', levels: ['3-1', '3-2', '3-3', '3-B'] },
      { id: 4, name: 'The Grey Citadel', theme: 'citadel', music: 'w4', color: '#ff6a2a', accent: '#b3a7c0', levels: ['4-1', '4-2', '4-3', '4-B'] },
    ],
    levels: {},
  });

  W.addLevel = function (def) {
    if (Array.isArray(def.segments)) def.map = W.join(def.segments);
    W.levels[def.id] = def;
  };
  // Concatenate map segments horizontally. Every segment must have the same
  // number of rows; each is padded to its own widest row.
  W.join = function (segs) {
    const rows = segs[0].length;
    const out = new Array(rows).fill('');
    segs.forEach((s, si) => {
      if (s.length !== rows) throw new Error('Segment ' + si + ' has ' + s.length + ' rows, expected ' + rows);
      const w = Math.max.apply(null, s.map((r) => r.length));
      for (let i = 0; i < rows; i++) out[i] += s[i].padEnd(w, '.');
    });
    return out;
  };
  W.order = function () {
    const o = [];
    W.list.forEach((w) => w.levels.forEach((id) => o.push(id)));
    return o;
  };
  W.next = function (id) {
    const o = W.order();
    const i = o.indexOf(id);
    return i >= 0 && i < o.length - 1 ? o[i + 1] : null;
  };
  W.worldOf = function (id) { return W.list[parseInt(id, 10) - 1]; };
  W.isBoss = (id) => /-B$/.test(id);
  W.label = (id) => (W.isBoss(id) ? id.replace('-B', '-★') : id);
})(window.G);

<script>
// Title screen: animated faceted meadow, the hero, the logo and main menu.
(function (G) {
  'use strict';
  const U = G.U;

  const Title = {
    enter() {
      this.t = 0;
      this.bg = this.bg || new G.Background(G.Themes.meadow);
      this.parts = new G.Particles();
      this.quit = false;
      const W = G.R.W;
      const has = G.Save.hasAnySave();
      this.menu = new G.UI.Menu([
        { label: 'New Game', onSelect: () => G.Scenes.go('slots', { mode: 'new' }) },
        { label: 'Load Game', disabled: !has, onSelect: () => G.Scenes.go('slots', { mode: 'load' }) },
        { label: 'Options', onSelect: () => G.Scenes.go('options', { back: 'title' }) },
        { label: 'Quit', onSelect: () => this.doQuit() },
      ], { x: W * 0.3, y: 270, w: 300, itemH: 50, gap: 12, size: 24 });
      if (has) this.menu.sel = 1;
      G.Music.play('title');
      this.jumpT = 0;
    },
    onResize() { this.menu.o.x = G.R.W * 0.3; },
    doQuit() {
      this.quit = true;
      G.Music.stop();
      // Browsers only allow closing windows opened by script; try anyway.
      try { window.close(); } catch (e) { /* ignore */ }
    },
    update(dt) {
      this.t += dt;
      this.bg.update(dt);
      this.parts.update(dt);
      if (this.quit) {
        if (G.Input.anyPressed) { this.quit = false; G.Music.play('title'); G.Input.flush(); }
        return;
      }
      this.menu.update(dt);
      // the hero hops now and then
      this.jumpT += dt;
      if (Math.random() < dt * 3) {
        const W = G.R.W;
        this.parts.spawn({ x: U.rand(0, W), y: G.R.H + 10, vy: U.rand(-90, -40), vx: U.rand(-10, 10), life: 6, size: U.rand(3, 7), color: U.pick(G.Icons.PRISM), alpha: 0.6 });
      }
    },
    render(ctx) {
      const W = G.R.W, H = G.R.H;
      this.bg.draw(ctx, this.t * 26, 0, W, H);
      this.bg.drawAmbient(ctx, this.t * 26, 0, W, H);
      // ground strip
      const gy = H - 70;
      const th = G.Themes.meadow.ground;
      ctx.fillStyle = th.body;
      ctx.fillRect(0, gy, W, 70);
      ctx.fillStyle = th.topDark;
      for (let x = -((this.t * 60) % 48); x < W + 48; x += 48) U.poly(ctx, [x, gy - 4, x + 48, gy - 4, x + 48, gy + 10, x + 36, gy + 14, x + 24, gy + 9, x + 12, gy + 15, x, gy + 10]), ctx.fill();
      ctx.fillStyle = th.top;
      ctx.fillRect(0, gy - 5, W, 9);
      this.parts.draw(ctx, false);

      // hero
      const hx = W * 0.72, hop = Math.max(0, Math.sin((this.t % 3.2) / 3.2 * Math.PI * 6)) * ((this.t % 3.2) < 0.55 ? 1 : 0);
      const p = hop > 0.05 ? Object.assign(G.Hero.pose(), { armN: 2.5, armF: -2.3, legN: 0.5, legF: -0.3, mouth: 'open', brow: 0.6 }) : G.Hero.walkPose(this.t, 9);
      // shadow
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(hx, gy, 46 - hop * 14, 10, 0, 0, U.TAU); ctx.fill();
      G.Hero.draw(ctx, hx, gy - hop * 70, 1, p, 3.0);
      G.Icons.lumi(ctx, hx + 130, gy - 230 + Math.sin(this.t * 1.7) * 14, 1.3, this.t);

      // logo
      this.drawLogo(ctx, W * 0.3, 120);
      if (this.quit) {
        ctx.fillStyle = 'rgba(8,8,20,0.82)';
        ctx.fillRect(0, 0, W, H);
        G.UI.text(ctx, 'Thanks for playing!', W / 2, H / 2 - 20, { size: 44, weight: 700, align: 'center', color: '#fff', stroke: 8, strokeColor: '#b3261e' });
        G.UI.text(ctx, 'You can close this tab now. Press any key to return.', W / 2, H / 2 + 30, { size: 18, align: 'center', color: 'rgba(255,255,255,0.75)' });
        return;
      }
      this.menu.draw(ctx);
      G.UI.hint(ctx, '↑↓ / mouse / tap to choose  ·  Enter to select', 18, H - 18);
      G.UI.hint(ctx, 'v1.0', W - 18, H - 18, 'right');
    },
    drawLogo(ctx, x, y) {
      const t = this.t;
      ctx.save();
      ctx.translate(x, y + Math.sin(t * 1.5) * 4);
      const letters = 'EMBER';
      ctx.font = '700 96px ' + G.UI.FONT;
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      const widths = letters.split('').map((l) => ctx.measureText(l).width);
      const total = widths.reduce((a, b) => a + b, 0) + 6 * (letters.length - 1);
      let lx = -total / 2;
      letters.split('').forEach((l, i) => {
        const wob = Math.sin(t * 3 + i * 0.7) * 4;
        ctx.save();
        ctx.translate(lx + widths[i] / 2, wob);
        ctx.rotate(Math.sin(t * 2 + i) * 0.03);
        ctx.lineJoin = 'round';
        ctx.lineWidth = 16;
        ctx.strokeStyle = '#3a0d12';
        ctx.strokeText(l, -widths[i] / 2, 6);
        ctx.strokeText(l, -widths[i] / 2, 0);
        const g = ctx.createLinearGradient(0, -40, 0, 40);
        g.addColorStop(0, '#ff8a6a'); g.addColorStop(0.48, '#ff3b2a'); g.addColorStop(0.52, '#e01f17'); g.addColorStop(1, '#a3120d');
        ctx.fillStyle = g;
        ctx.fillText(l, -widths[i] / 2, 0);
        ctx.restore();
        lx += widths[i] + 6;
      });
      ctx.restore();
      G.UI.text(ctx, 'and the Shattered Prism', x, y + 66, { size: 26, weight: 600, align: 'center', color: '#ffffff', stroke: 6, strokeColor: '#2b1a4a' });
      // little prism sparkle
      G.Icons.shard(ctx, x + 200, y - 48, 0.9, t);
    },
  };
  G.Scenes.register('title', Title);
})(window.G);

</script>
<script>
// Save-slot picker for New Game / Load Game (with overwrite confirm & delete).
(function (G) {
  'use strict';
  const U = G.U;

  const Slots = {
    enter(params) {
      this.mode = params.mode || 'load';
      this.t = 0;
      this.confirm = null;
      this.bg = this.bg || new G.Background(G.Themes.caves);
      this.build();
    },
    build() {
      const W = G.R.W;
      const items = [0, 1, 2].map((i) => {
        const s = G.Save.slots[i];
        return {
          slot: i,
          label: 'Slot ' + (i + 1),
          disabled: (this.mode === 'load' || this.mode === 'delete') && !s,
          onSelect: () => this.pick(i),
        };
      });
      if (this.mode === 'load' && G.Save.hasAnySave()) items.push({ label: 'Delete a Save…', onSelect: () => { this.mode = 'delete'; this.build(); } });
      items.push({ label: 'Back', onSelect: () => this.back() });
      this.menu = new G.UI.Menu(items, { x: W / 2, y: 150, w: Math.min(620, W - 60), itemH: 74, gap: 12, size: 22, onBack: () => this.back() });
      // custom drawing for slot rows
      this.menu.items.forEach((it) => { if (it.slot != null) it.valueText = () => ''; });
    },
    back() {
      if (this.mode === 'delete') { this.mode = 'load'; this.build(); return; }
      G.Scenes.go('title', {});
    },
    pick(i) {
      const s = G.Save.slots[i];
      if (this.mode === 'new') {
        if (s) { this.confirm = { text: 'Overwrite Slot ' + (i + 1) + '?', yes: () => this.startNew(i) }; this.mkConfirm(); return; }
        this.startNew(i);
      } else if (this.mode === 'delete') {
        this.confirm = { text: 'Delete Slot ' + (i + 1) + ' forever?', yes: () => { G.Save.deleteSlot(i); this.mode = G.Save.hasAnySave() ? 'load' : 'new'; this.build(); } };
        this.mkConfirm();
      } else {
        if (G.Save.loadSlot(i)) G.Scenes.go('overworld', {});
      }
    },
    mkConfirm() {
      const W = G.R.W;
      this.confirmMenu = new G.UI.Menu([
        { label: 'Yes', onSelect: () => { const c = this.confirm; this.confirm = null; c.yes(); } },
        { label: 'No', onSelect: () => { this.confirm = null; } },
      ], { x: W / 2, y: 280, w: 220, itemH: 48, onBack: () => { this.confirm = null; } });
      this.confirmMenu.sel = 1;
    },
    startNew(i) {
      G.Save.newGame(i);
      G.Scenes.go('cutscene', { script: 'intro', next: 'overworld', flag: 'intro' });
    },
    update(dt) {
      this.t += dt;
      this.bg.update(dt);
      if (this.confirm) { this.confirmMenu.update(dt); return; }
      this.menu.update(dt);
    },
    render(ctx) {
      const W = G.R.W, H = G.R.H;
      this.bg.draw(ctx, this.t * 15, 0, W, H);
      this.bg.drawAmbient(ctx, this.t * 15, 0, W, H);
      ctx.fillStyle = 'rgba(10,8,30,0.35)';
      ctx.fillRect(0, 0, W, H);
      const title = this.mode === 'new' ? 'NEW GAME — choose a slot' : this.mode === 'delete' ? 'DELETE — choose a slot' : 'LOAD GAME';
      G.UI.text(ctx, title, W / 2, 90, { size: 36, weight: 700, align: 'center', color: '#fff', stroke: 7, strokeColor: '#b3261e' });
      this.menu.draw(ctx);
      // slot details
      this.menu.items.forEach((it, i) => {
        if (it.slot == null) return;
        const r = this.menu.rectOf(i);
        const s = G.Save.slots[it.slot];
        const sum = G.Save.slotSummary(s);
        G.Hero.draw(ctx, r.x + 150, r.y + r.h - 8, 1, G.Hero.idlePose(this.t + i), s ? 0.85 : 0.6);
        if (!sum) {
          G.UI.text(ctx, 'Empty', r.x + 200, r.y + r.h / 2, { size: 18, color: 'rgba(255,255,255,0.55)' });
          return;
        }
        G.UI.text(ctx, (sum.complete ? '★ ' : '') + sum.done + ' levels cleared', r.x + 200, r.y + 24, { size: 18, weight: 700, color: '#fff' });
        G.Icons.shard(ctx, r.x + 210, r.y + 52, 0.55, this.t);
        G.UI.text(ctx, sum.shards + '/36', r.x + 224, r.y + 52, { size: 16, color: '#ffe9a8' });
        G.Icons.gem(ctx, r.x + 300, r.y + 52, 0.6, this.t);
        G.UI.text(ctx, String(sum.gems), r.x + 312, r.y + 52, { size: 16, color: '#bff6ff' });
        const mins = Math.floor(sum.time / 60);
        G.UI.text(ctx, Math.floor(mins / 60) + 'h ' + (mins % 60) + 'm', r.x + r.w - 20, r.y + 52, { size: 15, color: 'rgba(255,255,255,0.7)', align: 'right' });
      });
      if (this.confirm) {
        ctx.fillStyle = 'rgba(5,5,15,0.7)';
        ctx.fillRect(0, 0, W, H);
        G.UI.panel(ctx, W / 2 - 200, 180, 400, 240, { color: '#2a1d3a' });
        G.UI.text(ctx, this.confirm.text, W / 2, 230, { size: 24, weight: 700, align: 'center' });
        this.confirmMenu.draw(ctx);
      }
      if (!G.Save.storageOk) G.UI.hint(ctx, '⚠ Browser storage is unavailable — progress will not be saved.', W / 2, H - 20, 'center');
    },
  };
  G.Scenes.register('slots', Slots);
})(window.G);

</script>
<script>
// Options menu (used as its own scene from the title, and as an overlay in
// the pause menu and on the world map).
(function (G) {
  'use strict';
  const U = G.U;
  const O = (G.OptionsMenu = {});

  O.build = function (x, y, onBack) {
    const S = G.Save;
    const o = S.options;
    const save = () => { S.saveOptions(); G.Audio.applyVolumes(); };
    const vol = (key, label) => ({
      label,
      valueText: () => '▮'.repeat(Math.round(o[key] * 10)) + '▯'.repeat(10 - Math.round(o[key] * 10)),
      adjust: (d) => { o[key] = U.clamp(Math.round(o[key] * 10 + d) / 10, 0, 1); save(); G.Audio.play('menuMove'); },
    });
    const toggle = (key, label) => ({
      label, valueText: () => (o[key] ? 'ON' : 'OFF'),
      adjust: () => { o[key] = !o[key]; save(); G.Audio.play('menuMove'); },
    });
    const items = [
      vol('music', 'Music'),
      vol('sfx', 'Sound FX'),
      toggle('shake', 'Screen Shake'),
      {
        label: 'Touch Controls', valueText: () => ({ auto: 'AUTO', on: 'ON', off: 'OFF' })[o.touch],
        adjust: (d) => { const v = ['auto', 'on', 'off']; o.touch = v[(v.indexOf(o.touch) + (d > 0 ? 1 : 2)) % 3]; save(); G.Audio.play('menuMove'); },
      },
      toggle('timer', 'Speedrun Timer'),
      Object.assign(toggle('assist', 'Assist Mode (+2 hearts)'), {}),
      {
        label: 'Fullscreen', valueText: () => (document.fullscreenElement ? 'ON' : 'OFF'),
        adjust: () => {
          try {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen({ navigationUI: 'hide' });
          } catch (e) { /* not supported */ }
        },
      },
      { label: 'Back', onSelect: () => onBack && onBack() },
    ];
    const m = new G.UI.Menu(items, { x, y, w: Math.min(560, G.R.W - 60), itemH: 40, gap: 8, size: 22, onBack });
    m.isOptions = true;
    return m;
  };

  O.draw = function (ctx, menu) {
    const W = G.R.W, H = G.R.H;
    G.UI.panel(ctx, W / 2 - menu.o.w / 2 - 24, 70, menu.o.w + 48, H - 110, { color: '#1a1d3a', alpha: 0.95 });

    menu.draw(ctx);
    G.UI.hint(ctx, '← → to change  ·  Enter / click to toggle', W / 2, H - 54, 'center');
  };

  // Stand-alone scene version (from the title screen)

  }
  G.Scenes.register('options', Scene);
})(window.G);

<script>
// Story cutscenes: themed backdrop (optionally drained of colour), animated
// actors and typewriter dialogue. Skip with Esc / the SKIP button.
(function (G) {
  'use strict';
  const U = G.U;

  const Cut = {
    enter(params) {
      this.script = G.Story.scripts[params.script];
      this.params = params;
      this.shotIdx = -1;
      this.t = 0;
      this.bgs = {};
      G.Music.play(this.script.music || 'story');
      this.nextShot();
    },
    lineFilter(l) {
      if (!l.key) return true;
      const all = G.Save.data && G.Save.shardCount() >= 36;
      return l.key === 'allShards' ? all : !all;
    },
    nextShot() {
      this.shotIdx++;
      if (this.shotIdx >= this.script.shots.length) return this.finish();
      const shot = (this.shot = this.script.shots[this.shotIdx]);
      if (!this.bgs[shot.bg]) this.bgs[shot.bg] = new G.Background(G.Themes[shot.bg]);
      this.dialogue = new G.UI.Dialogue(shot.lines.filter((l) => this.lineFilter(l)));
      this.shotT = 0;
    },
    finish() {
      if (this.done) return;
      this.done = true;
      if (this.params.flag && G.Save.data) { G.Save.data.story[this.params.flag] = true; G.Save.persist(); }
      G.Scenes.go(this.params.next || 'overworld', this.params.nextParams || {});
    },
    update(dt) {
      this.t += dt;
      this.shotT += dt;
      if (this.done) return;
      const I = G.Input;
      const skip = { x: G.R.W - 110, y: 16, w: 94, h: 36 };
      if ((I.pressed.pause && !I.pressed.confirm) || (I.pressed.back && !I.pressed.attack) || G.UI.hit(skip)) { this.finish(); return; }
      this.bgs[this.shot.bg].update(dt);
      if (this.shotT > 0.4) this.dialogue.update(dt);
      if (this.dialogue.done) this.nextShot();
    },
    render(ctx) {
      const W = G.R.W, H = G.R.H;
      const shot = this.shot;
      const bg = this.bgs[shot.bg];
      bg.draw(ctx, this.t * 18, 0, W, H);
      bg.drawAmbient(ctx, this.t * 18, 0, W, H);
      const th = G.Themes[shot.bg];
      const gy = H - 170;
      ctx.fillStyle = th.ground.body;
      ctx.fillRect(0, gy, W, H - gy);
      ctx.fillStyle = th.ground.top;
      ctx.fillRect(0, gy - 6, W, 12);
      for (const a of shot.actors) {
        const x = a.x * W;
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.beginPath(); ctx.ellipse(x, gy, 40, 8, 0, 0, U.TAU); ctx.fill();
        const speaking = this.dialogue.cur && this.dialogue.cur.who === a.id;
        if (a.id === 'ember') {
          const p = G.Hero.idlePose(this.t, speaking ? { mouth: Math.floor(this.t * 8) % 2 ? 'open' : 'smile' } : {});
          if (shot.grey && this.shotIdx === 2 && this.dialogue.i <= 1) { p.mouth = 'o'; p.brow = 1; }
          G.Hero.draw(ctx, x, gy, a.facing, p, 2.6);
        } else if (a.id === 'lumi') {
          G.Icons.lumi(ctx, x, gy - 120, 1.6, this.t);
        } else if (a.id === 'king') {
          G.Icons.king(ctx, x, gy - 40, 2.0, this.t, { facing: a.facing, cast: speaking ? 0.5 + Math.sin(this.t * 6) * 0.5 : 0 });
        }
      }
      if (shot.grey) {
        // drain colour from everything drawn so far, except the hero
        ctx.save();
        ctx.globalCompositeOperation = 'saturation';
        ctx.fillStyle = 'hsl(0,0%,50%)';
        ctx.globalAlpha = 0.92;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
        for (const a of shot.actors) if (a.id === 'ember') {
          const p = G.Hero.idlePose(this.t);
          if (this.shotIdx === 2 && this.dialogue.i <= 1) { p.mouth = 'o'; p.brow = 1; }
          G.Hero.draw(ctx, a.x * W, gy, a.facing, p, 2.6);
        }
      }
      // letterbox
      ctx.fillStyle = '#05060c';
      ctx.fillRect(0, 0, W, 6);
      const k = U.clamp(this.shotT / 0.4, 0, 1);
      ctx.fillStyle = 'rgba(5,6,12,' + (1 - k) + ')';
      ctx.fillRect(0, 0, W, H);
      this.dialogue.draw(ctx);
      U.roundRect(ctx, W - 110, 16, 94, 36, 10);
      ctx.fillStyle = 'rgba(10,10,30,0.55)'; ctx.fill();
      G.UI.text(ctx, 'SKIP ▸▸', W - 63, 34, { size: 16, weight: 700, align: 'center', color: 'rgba(255,255,255,0.85)' });
    },
  };
  G.Scenes.register('cutscene', Cut);
})(window.G);

</script>
<script>
// World map: four faceted islands with level nodes. Islands are drained of
// colour until their boss is beaten. Walk between unlocked nodes and enter.
(function (G) {
  'use strict';
  const U = G.U;
  const ISLAND_W = 760, START_X = 200;
  const YOFF = [40, -40, 30, -10];

  const OW = {
    enter() {
      this.t = 0;
      this.order = G.Worlds.order();
      this.nodes = this.order.map((id, k) => {
        const wi = Math.floor(k / 4), j = k % 4;
        return { id, x: START_X + wi * ISLAND_W + j * 165, y: 290 + YOFF[j] + (wi % 2 ? -10 : 10), wi, boss: G.Worlds.isBoss(id) };
      });
      this.mapW = START_X + 4 * ISLAND_W - 120;
      const sd = G.Save.data;
      let idx = this.order.indexOf(sd.node);
      if (idx < 0 || !G.Save.isUnlocked(sd.node)) idx = 0;
      this.cur = idx;
      this.target = idx;
      this.ax = this.nodes[idx].x; this.ay = this.nodes[idx].y;
      this.camX = U.clamp(this.ax - G.R.W / 2, 0, this.mapW - G.R.W);
      this.moving = false;
      this.facing = 1;
      this.menu = null;
      this.optionsMenu = null;
      this.parts = new G.Particles();
      this.islands = G.Worlds.list.map((w, i) => this.makeIsland(i));
      G.Music.play('overworld');
      this.enterT = 0;
      this.flash = this.newUnlockFlash();
    },
    newUnlockFlash() {
      // sparkle the most recently unlocked node
      const sd = G.Save.data;
      const id = sd.unlocked[sd.unlocked.length - 1];
      const rec = sd.levels[id];
      return rec && rec.done ? null : id;
    },
    makeIsland(i) {
      const rng = U.rng(1000 + i * 77);
      const cx = START_X + i * ISLAND_W + 250, cy = 300;
      const pts = [];
      const n = 18;
      for (let k = 0; k < n; k++) {
        const a = (k / n) * U.TAU;
        const rx = 370 + rng() * 40, ry = 150 + rng() * 26;
        pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry * (Math.sin(a) > 0 ? 1.05 : 0.95)]);
      }
      const deco = [];
      for (let k = 0; k < 26; k++) {
        const a = rng() * U.TAU, r = 0.35 + rng() * 0.55;
        const x = cx + Math.cos(a) * 340 * r, y = cy + Math.sin(a) * 120 * r;
        // keep decorations off the node path
        if (Math.abs(y - 300) < 70 && x > cx - 300 && x < cx + 300) continue;
        deco.push({ x, y, s: 0.7 + rng() * 0.6, v: rng() });
      }
      deco.sort((a, b) => a.y - b.y);
      return { cx, cy, pts, deco };
    },
    restored(wi) { const r = G.Save.data.levels[wi + 1 + '-B']; return !!(r && r.done); },
    worldOpen(wi) { return G.Save.isUnlocked(wi + 1 + '-1'); },

    goTo(k) {
      if (k === this.cur && !this.moving) return;
      if (!G.Save.isUnlocked(this.order[k])) { G.Audio.play('deny'); return; }
      this.target = k;
      this.moving = true;
    },
    update(dt) {
      this.t += dt;
      this.enterT += dt;
      this.parts.update(dt);
      const I = G.Input;
      if (this.optionsMenu) { this.optionsMenu.update(dt); return; }
      if (this.menu) { this.menu.update(dt); return; }
      const W = G.R.W, H = G.R.H;
      // buttons
      const btnShop = { x: W - 250, y: 14, w: 110, h: 40 }, btnMenu = { x: W - 128, y: 14, w: 110, h: 40 };
      if (G.UI.hit(btnShop) || I.pressed.attack) { G.Audio.play('menuSelect'); G.Scenes.go('shop', {}); return; }
      if (G.UI.hit(btnMenu) || (I.pressed.pause && !I.pressed.confirm) || (I.pressed.back && !I.pressed.attack)) { this.openMenu(); return; }

      if (!this.moving) {
        if ((I.pressed.right || I.pressed.down) && this.cur < this.nodes.length - 1) this.goTo(this.cur + 1);
        else if ((I.pressed.left || I.pressed.up) && this.cur > 0) this.goTo(this.cur - 1);
        else if (I.pressed.confirm || I.pressed.jump && !I.pressed.up) { this.play(); return; }
      }
      // tap a node
      const p = I.pointer;
      if (p.clicked) {
        const mx = p.x + this.camX, my = p.y;
        const playBtn = this.playBtnRect();
        if (playBtn && p.x >= playBtn.x && p.x <= playBtn.x + playBtn.w && p.y >= playBtn.y && p.y <= playBtn.y + playBtn.h) { this.play(); return; }
        this.nodes.forEach((n, k) => {
          if (U.dist(mx, my, n.x, n.y) < 34) {
            if (k === this.cur && !this.moving) this.play();
            else this.goTo(k);
          }
        });
      }
      if (this.moving) {
        const dir = Math.sign(this.target - this.cur);
        const next = this.nodes[this.cur + dir];
        if (!next) { this.moving = false; } else {
          const dx = next.x - this.ax, dy = next.y - this.ay;
          const d = Math.hypot(dx, dy);
          const sp = 340 * dt;
          this.facing = dx >= 0 ? 1 : -1;
          if (d <= sp) {
            this.ax = next.x; this.ay = next.y;
            this.cur += dir;
            G.Audio.play('step');
            if (!G.Save.isUnlocked(this.order[this.cur]) || this.cur === this.target) { this.moving = false; this.target = this.cur; G.Save.data.node = this.order[this.cur]; G.Save.persist(); }
          } else { this.ax += (dx / d) * sp; this.ay += (dy / d) * sp; }
        }
      }
      this.camX = U.damp(this.camX, U.clamp(this.ax - W / 2, 0, this.mapW - W), 5, dt);
      if (this.flash && Math.random() < dt * 10) {
        const n = this.nodes[this.order.indexOf(this.flash)];
        if (n) this.parts.spawn({ x: n.x + U.rand(-24, 24), y: n.y + U.rand(-24, 10), vy: -50, life: 0.8, size: 3, shape: 'spark', color: U.pick(G.Icons.PRISM), glow: true });
      }
    },
    play() {
      if (this.moving) return;
      const id = this.order[this.cur];
      if (!G.Save.isUnlocked(id)) return;
      G.Audio.play('menuSelect');
      G.Save.data.node = id;
      G.Save.persist();
      G.Scenes.go('play', { id });
    },
    openMenu() {
      const W = G.R.W;
      G.Audio.play('menuBack');
      this.menu = new G.UI.Menu([
        { label: 'Resume', onSelect: () => { this.menu = null; } },
        { label: "Lumi's Shop", onSelect: () => G.Scenes.go('shop', {}) },
        { label: 'Options', onSelect: () => { this.optionsMenu = G.OptionsMenu.build(W / 2, 150, () => { this.optionsMenu = null; }); } },
        { label: 'Save & Quit to Title', onSelect: () => { G.Save.persist(); G.Scenes.go('title', {}); } },
      ], { x: W / 2, y: 200, w: 340, itemH: 52, onBack: () => { this.menu = null; } });
    },
    playBtnRect() {
      const H = G.R.H;
      return { x: 320, y: H - 92, w: 120, h: 44 };
    },

    render(ctx) {
      const W = G.R.W, H = G.R.H;
      // sea & sky
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#5a7fd6'); g.addColorStop(0.5, '#8fb6ef'); g.addColorStop(1, '#3a5fb0');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      // faceted clouds
      for (let i = 0; i < 9; i++) {
        const x = ((i * 410 - this.camX * 0.3 + this.t * 8) % (W + 400) + W + 400) % (W + 400) - 200;
        const y = 40 + (i * 53) % 120;
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        U.poly(ctx, [x, y, x + 50, y - 22, x + 110, y - 16, x + 150, y + 4, x + 70, y + 14]);
        ctx.fill();
      }
      ctx.save();
      ctx.translate(-Math.round(this.camX), 0);
      // waves
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 40; i++) {
        const x = (i * 157) % this.mapW, y = 120 + ((i * 97) % 380);
        const o = Math.sin(this.t * 1.5 + i) * 6;
        ctx.beginPath(); ctx.moveTo(x + o, y); ctx.lineTo(x + 12 + o, y - 5); ctx.lineTo(x + 24 + o, y); ctx.stroke();
      }
      this.islands.forEach((isl, i) => this.drawIsland(ctx, isl, i));
      // paths
      for (let k = 0; k < this.nodes.length - 1; k++) {
        const a = this.nodes[k], b = this.nodes[k + 1];
        const open = G.Save.isUnlocked(b.id);
        const steps = Math.floor(U.dist(a.x, a.y, b.x, b.y) / 18);
        for (let s = 1; s < steps; s++) {
          const x = U.lerp(a.x, b.x, s / steps), y = U.lerp(a.y, b.y, s / steps) - Math.sin((s / steps) * Math.PI) * (a.wi !== b.wi ? 40 : 10);
          ctx.fillStyle = open ? '#fff6d8' : 'rgba(40,40,60,0.35)';
          ctx.beginPath(); ctx.arc(x, y, open ? 4 : 3, 0, U.TAU); ctx.fill();
        }
      }
      this.nodes.forEach((n, k) => this.drawNode(ctx, n, k));
      this.parts.draw(ctx, false);
      // avatar
      const walking = this.moving;
      const p = walking ? G.Hero.walkPose(this.t, 12) : G.Hero.idlePose(this.t);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(this.ax, this.ay - 6, 18, 5, 0, 0, U.TAU); ctx.fill();
      G.Hero.draw(ctx, this.ax, this.ay - 6, this.facing, p, 1.0);
      ctx.restore();

      this.drawHUD(ctx);
      if (this.menu || this.optionsMenu) {
        ctx.fillStyle = 'rgba(8,8,20,0.6)';
        ctx.fillRect(0, 0, W, H);
        if (this.optionsMenu) G.OptionsMenu.draw(ctx, this.optionsMenu);
        else {
          G.UI.text(ctx, 'MENU', W / 2, 130, { size: 44, weight: 700, align: 'center', stroke: 8, strokeColor: '#b3261e' });
          this.menu.draw(ctx);
        }
      }
      if (this.enterT < 0.5) { ctx.fillStyle = 'rgba(10,10,25,' + (1 - this.enterT * 2) + ')'; ctx.fillRect(0, 0, W, H); }
    },

    drawIsland(ctx, isl, i) {
      const w = G.Worlds.list[i];
      const th = G.Themes[w.theme];
      const pts = isl.pts;
      // cliff side
      ctx.fillStyle = th.ground.bodyDark;
      ctx.beginPath();
      pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1] + 46) : ctx.moveTo(p[0], p[1] + 46)));
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = th.ground.body;
      for (let k = 0; k < pts.length; k++) {
        const a = pts[k], b = pts[(k + 1) % pts.length];
        if (a[1] < isl.cy - 20 && b[1] < isl.cy - 20) continue;
        ctx.fillStyle = k % 2 ? th.ground.body : th.ground.bodyDark;
        U.poly(ctx, [a[0], a[1], b[0], b[1], b[0], b[1] + 46, a[0], a[1] + 46]);
        ctx.fill();
      }
      // top surface with facets
      ctx.save();
      ctx.beginPath();
      pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      ctx.closePath();
      ctx.fillStyle = th.ground.top;
      ctx.fill();
      ctx.clip();
      for (let k = 0; k < pts.length; k++) {
        const a = pts[k], b = pts[(k + 1) % pts.length];
        ctx.fillStyle = k % 3 === 0 ? U.shade(th.ground.top, 0.12) : k % 3 === 1 ? th.ground.topDark : th.ground.top;
        U.poly(ctx, [isl.cx + (k % 2 ? 40 : -60), isl.cy + (k % 2 ? -10 : 20), a[0], a[1], b[0], b[1]]);
        ctx.fill();
      }
      // decorations
      for (const d of isl.deco) this.drawDeco(ctx, w.theme, d, th);
      // world name banner
      ctx.restore();
      if (!this.restored(i)) {
        // drain the colour (top face + cliff) until this world's boss is beaten
        for (const yo of [0, 23, 46]) {
          ctx.save();
          ctx.beginPath();
          pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1] + yo) : ctx.moveTo(p[0], p[1] + yo)));
          ctx.closePath();
          ctx.clip();
          ctx.globalCompositeOperation = 'saturation';
          ctx.fillStyle = 'hsl(0,0%,50%)';
          ctx.globalAlpha = 0.8;
          ctx.fillRect(isl.cx - 450, isl.cy - 220, 900, 480);
          ctx.restore();
        }
      }
      if (!this.worldOpen(i)) {
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#101020';
        ctx.beginPath();
        pts.forEach((p, k) => (k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      const open = this.worldOpen(i);
      G.UI.text(ctx, 'WORLD ' + w.id, isl.cx, isl.cy - 168, { size: 15, weight: 700, align: 'center', color: '#fff', stroke: 4, strokeColor: 'rgba(20,20,40,0.6)' });
      G.UI.text(ctx, open ? w.name : '???', isl.cx, isl.cy - 146, { size: 24, weight: 700, align: 'center', color: open ? '#fff' : '#c7c9db', stroke: 5, strokeColor: 'rgba(20,20,40,0.6)' });
      if (open) {
        const n = G.Save.shardCount(w.id);
        G.Icons.shard(ctx, isl.cx - 18, isl.cy - 120, 0.55, this.t);
        G.UI.text(ctx, n + '/9', isl.cx - 4, isl.cy - 119, { size: 16, weight: 700, color: '#fff', stroke: 4, strokeColor: 'rgba(20,20,40,0.6)' });
      }
    },
    drawDeco(ctx, theme, d, th) {
      const x = d.x, y = d.y, s = d.s;
      if (theme === 'meadow') {
        ctx.fillStyle = '#7a4f33'; ctx.fillRect(x - 2 * s, y - 10 * s, 4 * s, 10 * s);
        ctx.fillStyle = d.v > 0.5 ? '#3e9e57' : '#4fb563';
        U.poly(ctx, [x, y - 34 * s, x + 14 * s, y - 14 * s, x + 8 * s, y - 6 * s, x - 8 * s, y - 6 * s, x - 14 * s, y - 14 * s]); ctx.fill();
        ctx.fillStyle = '#6fd07a';
        U.poly(ctx, [x, y - 34 * s, x - 14 * s, y - 14 * s, x, y - 14 * s]); ctx.fill();
      } else if (theme === 'caves') {
        const c = d.v > 0.5 ? '#3ee0c8' : '#b48cff';
        ctx.fillStyle = U.shade(c, -0.25);
        U.poly(ctx, [x - 7 * s, y, x - 5 * s, y - 24 * s, x, y - 34 * s, x + 5 * s, y - 24 * s, x + 7 * s, y]); ctx.fill();
        ctx.fillStyle = c;
        U.poly(ctx, [x - 7 * s, y, x - 5 * s, y - 24 * s, x, y - 34 * s, x, y]); ctx.fill();
      } else if (theme === 'peaks') {
        ctx.fillStyle = '#8fa2dc';
        U.poly(ctx, [x - 20 * s, y, x, y - 40 * s, x + 20 * s, y]); ctx.fill();
        ctx.fillStyle = '#fff';
        U.poly(ctx, [x - 7 * s, y - 26 * s, x, y - 40 * s, x + 7 * s, y - 26 * s, x, y - 22 * s]); ctx.fill();
      } else {
        ctx.fillStyle = '#3a2a3a';
        ctx.fillRect(x - 8 * s, y - 34 * s, 16 * s, 34 * s);
        U.poly(ctx, [x - 11 * s, y - 34 * s, x, y - 52 * s, x + 11 * s, y - 34 * s]); ctx.fill();
        ctx.fillStyle = 'rgba(255,140,60,0.8)';
        ctx.fillRect(x - 2 * s, y - 26 * s, 4 * s, 6 * s);
      }
    },
    drawNode(ctx, n, k) {
      const id = n.id;
      const open = G.Save.isUnlocked(id);
      const rec = G.Save.data.levels[id];
      const done = rec && rec.done;
      const w = G.Worlds.list[n.wi];
      const r = n.boss ? 26 : 20;
      const sel = k === this.cur;
      if (sel) {
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(this.t * 5) * 0.3) + ')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(n.x, n.y, r + 8 + Math.sin(this.t * 5) * 2, 0, U.TAU); ctx.stroke();
      }
      // base disc (faceted octagon with thickness)
      const oct = (rr, yo) => { ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = (i / 8) * U.TAU + Math.PI / 8; ctx.lineTo(n.x + Math.cos(a) * rr, n.y + yo + Math.sin(a) * rr * 0.62); } ctx.closePath(); };
      oct(r, 7); ctx.fillStyle = 'rgba(20,20,40,0.5)'; ctx.fill();
      oct(r, 0);
      ctx.fillStyle = !open ? '#8a8ca0' : done ? w.color : '#ffffff';
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.moveTo(n.x - r, n.y); ctx.lineTo(n.x, n.y - r * 0.62); ctx.lineTo(n.x, n.y); ctx.closePath(); ctx.fill();
      if (!open) G.Icons.lock(ctx, n.x, n.y - 2, 0.9);
      else if (n.boss) G.Icons.crown(ctx, n.x, n.y - 2, 1.1, done ? '#fff' : '#ffb02a');
      else G.UI.text(ctx, id, n.x, n.y + 1, { size: 14, weight: 700, align: 'center', color: done ? '#fff' : '#30264a' });
      if (open && !n.boss && rec) {
        for (let i = 0; i < 3; i++) {
          const sx = n.x - 14 + i * 14, sy = n.y + 24;
          ctx.fillStyle = rec.shards[i] ? G.Icons.PRISM[i * 2] : 'rgba(30,30,50,0.45)';
          U.poly(ctx, [sx, sy - 6, sx + 4, sy, sx, sy + 6, sx - 4, sy]);
          ctx.fill();
        }
      }
    },
    drawHUD(ctx) {
      const W = G.R.W, H = G.R.H;
      const sd = G.Save.data;
      G.UI.panel(ctx, 12, 12, 250, 46, { color: '#1a1d3a', alpha: 0.85, r: 12 });
      G.Icons.gem(ctx, 34, 35, 0.9, this.t * 2);
      G.UI.text(ctx, String(sd.gems), 50, 36, { size: 20, weight: 700 });
      G.Icons.shard(ctx, 140, 35, 0.6, this.t);
      G.UI.text(ctx, G.Save.shardCount() + '/36', 154, 36, { size: 20, weight: 700 });
      // buttons
      [['SHOP', W - 250], ['MENU', W - 128]].forEach(([l, x]) => {
        G.UI.panel(ctx, x, 14, 110, 40, { color: l === 'SHOP' ? '#2b7a4b' : '#3a2f6a', alpha: 0.9, r: 10 });
        G.UI.text(ctx, l, x + 55, 35, { size: 18, weight: 700, align: 'center' });
      });
      // info panel
      const id = this.order[this.cur];
      const def = G.Worlds.levels[id];
      const rec = sd.levels[id];
      const pw = Math.min(460, W - 24);
      G.UI.panel(ctx, 12, H - 110, pw, 98, { color: '#1a1d3a', alpha: 0.9 });
      if (def) {
        const w = G.Worlds.worldOf(id);
        G.UI.text(ctx, 'World ' + w.id + ' · ' + w.name, 28, H - 90, { size: 14, color: 'rgba(255,255,255,0.65)' });
        G.UI.text(ctx, G.Worlds.label(id) + '  ' + def.name, 28, H - 66, { size: 22, weight: 700, color: '#fff' });
        if (def.boss) {
          G.UI.text(ctx, rec && rec.done ? 'Defeated!' : 'BOSS STAGE', 28, H - 38, { size: 16, weight: 700, color: '#ffb02a' });
        } else {
          for (let i = 0; i < 3; i++) G.Icons.shard(ctx, 38 + i * 26, H - 36, 0.55, this.t + i, !(rec && rec.shards[i]));
          G.UI.text(ctx, 'Best: ' + (rec && rec.done ? rec.bestGems + ' gems · ' + U.formatTime(rec.bestTime) : '—'), 120, H - 36, { size: 15, color: 'rgba(255,255,255,0.8)' });
        }
        const b = this.playBtnRect();
        if (pw >= 460) {
          G.UI.panel(ctx, b.x, b.y, b.w, b.h, { color: '#c0392b', alpha: 0.95, r: 12 });
          G.UI.text(ctx, '▶ PLAY', b.x + b.w / 2, b.y + b.h / 2 + 1, { size: 20, weight: 700, align: 'center' });
        }
      }
      G.UI.hint(ctx, '←/→ move · Enter play · X shop · Esc menu', W - 16, 72, 'right');
    },
  };
  G.Scenes.register('overworld', OW);
})(window.G);

<script>
// Lumi's Prism Shop: spend gems on permanent upgrades.
(function (G) {
  'use strict';
  const U = G.U;

  // Upgrade catalogue. Add entries here to extend the shop.
  const ITEMS = [
    { id: 'heart1', name: 'Heart Crystal', desc: '+1 maximum heart.', cost: 60, owned: (u) => u.heart >= 1, can: () => true, buy: (u) => { u.heart = Math.max(u.heart, 1); } },
    { id: 'heart2', name: 'Heart Crystal II', desc: 'Another +1 maximum heart.', cost: 150, owned: (u) => u.heart >= 2, can: (u) => u.heart >= 1, buy: (u) => { u.heart = 2; } },
    { id: 'power', name: 'Power Fist', desc: 'Punches deal double damage.', cost: 110, owned: (u) => !!u.power, can: () => true, buy: (u) => { u.power = 1; } },
    { id: 'magnet', name: 'Gem Magnet', desc: 'Nearby gems fly to you.', cost: 80, owned: (u) => !!u.magnet, can: () => true, buy: (u) => { u.magnet = 1; } },
  ];
  G.ShopItems = ITEMS;

  const Shop = {
    enter() {
      this.t = 0;
      this.msg = 'Welcome! Gems for upgrades — a fair trade, Ember!';
      this.msgT = 0;
      this.bg = this.bg || new G.Background(G.Themes.caves);
      this.build();
      G.Music.play('overworld');
    },
    build() {
      const W = G.R.W;
      const u = G.Save.data.upgrades;
      const items = ITEMS.map((it) => ({
        label: it.name,
        valueText: () => (it.owned(u) ? 'OWNED' : !it.can(u) ? 'LOCKED' : '◆ ' + it.cost),
        onSelect: () => this.buy(it),
        item: it,
      }));
      items.push({ label: 'Back to Map', onSelect: () => G.Scenes.go('overworld', {}) });
      const sel = this.menu ? this.menu.sel : 0;
      this.menu = new G.UI.Menu(items, { x: W * 0.36, y: 140, w: Math.min(440, W * 0.55), itemH: 54, gap: 10, size: 24, onBack: () => G.Scenes.go('overworld', {}) });
      this.menu.sel = sel;
    },
    buy(it) {
      const sd = G.Save.data, u = sd.upgrades;
      if (it.owned(u)) { this.say('You already have that one!'); G.Audio.play('deny'); return; }
      if (!it.can(u)) { this.say('Buy the first Heart Crystal before this one.'); G.Audio.play('deny'); return; }
      if (sd.gems < it.cost) { this.say('Not enough gems yet. Explore and break blocks to find more!'); G.Audio.play('deny'); return; }
      sd.gems -= it.cost;
      it.buy(u);
      G.Save.persist();
      G.Audio.play('buy');
      this.say(it.name + ' acquired! ' + it.desc);
      this.build();
    },
    say(m) { this.msg = m; this.msgT = 0; },
    update(dt) { this.t += dt; this.msgT += dt; this.bg.update(dt); this.menu.update(dt); },
    render(ctx) {
      const W = G.R.W, H = G.R.H;
      this.bg.draw(ctx, this.t * 10, 0, W, H);
      ctx.fillStyle = 'rgba(12,8,30,0.45)';
      ctx.fillRect(0, 0, W, H);
      G.UI.text(ctx, "LUMI'S PRISM SHOP", W * 0.36, 80, { size: 36, weight: 700, align: 'center', stroke: 7, strokeColor: '#5a2ab0' });
      this.menu.draw(ctx);
      const it = this.menu.items[this.menu.sel];
      const right = W * 0.36 + this.menu.o.w / 2 + 30;
      const sx = right + (W - right) / 2;
      G.Icons.lumi(ctx, sx, 190, 2.2, this.t);
      G.Hero.draw(ctx, sx, H - 80, -1, G.Hero.idlePose(this.t), 2.2);
      // speech bubble
      const bw = Math.min(W - right - 30, 330);
      const lines = G.UI.wrap(ctx, it && it.item ? it.item.desc : this.msg, bw - 28, 17, 600);
      const lines2 = this.msgT < 3 ? G.UI.wrap(ctx, this.msg, bw - 28, 17, 600) : lines;
      const show = this.msgT < 3 ? lines2 : lines;
      const bh = show.length * 22 + 22;
      G.UI.panel(ctx, sx - bw / 2, 250, bw, bh, { color: '#25295a', r: 12 });
      show.forEach((l, i) => G.UI.text(ctx, l, sx - bw / 2 + 14, 272 + i * 22, { size: 17, weight: 600 }));
      // wallet
      G.UI.panel(ctx, 16, H - 62, 170, 46, { color: '#1a1d3a', r: 12 });
      G.Icons.gem(ctx, 40, H - 39, 0.9, this.t * 2);
      G.UI.text(ctx, String(G.Save.data.gems), 58, H - 38, { size: 22, weight: 700 });
    },
  };
  G.Scenes.register('shop', Shop);
})(window.G);
